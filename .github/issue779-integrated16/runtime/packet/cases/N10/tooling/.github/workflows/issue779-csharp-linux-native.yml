name: C# Linux native N10 pending-start race
on:
  push:
    branches: [codex/issue779-csharp-linux-native-20261013-n10-tree-output-v15]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Promotion requires frozen source reviews and a complete native handoff.
      # Promote only after full source composition review; no native passing claim.
      # Fail closed while any source, fixture, custody, or native-handoff review remains pending.
      N10_SOURCE_CAPTURE_REVIEW_CLEAR: 'true'
      N10_FIXTURE_REVIEW_CLEAR: 'true'
      N10_ROOT_CLEANUP_REVIEW_CLEAR: 'true'
      N10_NATIVE_HANDOFF_REVIEWED: 'true'
      UBUNTU_RUNTIME_REVIEWED: 'true'
      BUILD_REVIEWED: 'true'
      ROOT_TRANSPORT_REVIEWED: 'true'
      OS_AUDIT_REVIEWED: 'true'
      EXECUTION_REVIEW_SHA256: 1cd77e8c9ae5f8e8357639e31081c15a657ed4e49b606bd665431eb4b9076204
      SOURCE_COMMIT: 0c100a94d93f82fd633e5674009a41659940d010
      SOURCE_PARENT: 03ff51b361d686e6e2590a27e9a4f43529cdbaf2
      HARNESS_PARENT: 0c100a94d93f82fd633e5674009a41659940d010
      OS_AUDIT_SHA256: b345b2be77b359af23ade0b334caf76d7fdeb14bd2d4a3f0837beb21232df5e0
      N10_FIXTURE_SHA256: d12bf796efc78236ce59cde2c4a625c3b99565655147eecaee8b39ea3d9cca8a
      N10_RECORD_CHECKER_SHA256: 504bed99afcb6faf1aac03f245bc7520afa88c02aebea116f9dcf1ec4ccbc98d
      N10_RECORD_TEST_SHA256: 6b237895923ff82d8446e16a6691b77b985086de1f59c0034940d470f66ee70e
      # Final reviewed component bytes; independent installation review gates publication.
      BUILD_SCRIPT_SHA256: 4cd547a8c35403270afa1db89fda4049bd5b7decd31cc5813dac506b0dc365d4
      CAPTURE_RECEIPT_SHA256: 653d30169f6fc3aed53274349304dfebc3aff2b529e42bf3a4524a37fa546fd2
      UBUNTU_RUNTIME_SCRIPT_SHA256: 2ce624570b6d77f6eaf552be4a7b6da16c95ef05b2cb64c93c6f0fa666043967
      ROOT_TRANSPORT_SHA256: f3333d1c11db8f5515635e71cf20fce5a2deb5bec27694dc49d234df130388f5
      ACQUISITION_SHA256: 6ce3cee6a9224a869c12e15e55b46af2e54cb353443b449da3ce6b75a9765ef2
      RETENTION_SHA256: 2f4defe92bb4dd97b51435d456b8cbfb10a6c5c90afca8bf782f8a6500144024
      ORCHESTRATOR_SHA256: e5b0f01bf943d0db3c644f541138dcca6b372ca2f781eadd693a7cfbc2c39d14
      SOURCE_REVIEW_SHA256: fe0a30f92a4c9f886e1db733ca5cc8cd59886c7ec31cc7cd01afb7392b98418b
      NATIVE_README_SHA256: 7c725d0943ff62a52b45e0021907b2c0b83db4a177dbcd3da59bed808bc58502
      BATCH_PARSER_TEST_SHA256: 94cb67b53e57cb2fdd2c655254665d27cbb6b8c353ab88f1000ed4df447257d4
    steps:
      - name: Reject unreviewed or incomplete proposal before build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for flag in UBUNTU_RUNTIME_REVIEWED BUILD_REVIEWED ROOT_TRANSPORT_REVIEWED OS_AUDIT_REVIEWED N10_SOURCE_CAPTURE_REVIEW_CLEAR N10_FIXTURE_REVIEW_CLEAR N10_ROOT_CLEANUP_REVIEW_CLEAR N10_NATIVE_HANDOFF_REVIEWED; do
            test "${!flag}" = true
          done
          for pin in BUILD_SCRIPT_SHA256 CAPTURE_RECEIPT_SHA256 UBUNTU_RUNTIME_SCRIPT_SHA256 ROOT_TRANSPORT_SHA256 ACQUISITION_SHA256 RETENTION_SHA256 ORCHESTRATOR_SHA256 SOURCE_REVIEW_SHA256 NATIVE_README_SHA256 OS_AUDIT_SHA256 N10_FIXTURE_SHA256 N10_RECORD_CHECKER_SHA256 N10_RECORD_TEST_SHA256; do
            [[ "${!pin}" =~ ^[0-9a-f]{64}$ ]]
          done
          # This original job clock must also bracket final native publication.
          /usr/bin/python3 -B - <<'PY' >> "$GITHUB_ENV"
          import time
          print('JOB_DEADLINE_MONOTONIC_NS=' + str(time.monotonic_ns() + 2100 * 1000000000))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent execution review before build or native work
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          """Validate the installed independent N10 review before build or native work.

          The workflow pins the review bytes. The review binds all other installed inputs,
          including the workflow with its single review digest replaced by 64 zeroes.
          That normalization breaks only the self-hash cycle; no other byte is excluded.
          This data check grants no admission, runtime capability, or native case credit.
          """
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import time


          RECORD = ".github/issue779-csharp-native/execution-review.json"
          WORKFLOW = ".github/workflows/issue779-csharp-linux-native.yml"
          SCHEMA = "issue779-n10-workflow-execution-review-v1"
          GATES = {
              "BUILD_REVIEWED", "UBUNTU_RUNTIME_REVIEWED", "ROOT_TRANSPORT_REVIEWED",
              "OS_AUDIT_REVIEWED", "N10_SOURCE_CAPTURE_REVIEW_CLEAR",
              "N10_FIXTURE_REVIEW_CLEAR", "N10_ROOT_CLEANUP_REVIEW_CLEAR",
              "N10_NATIVE_HANDOFF_REVIEWED",
          }
          INPUTS = {
              ".github/issue779-csharp-build/build-fdd.sh",
              ".github/issue779-csharp-build/capture-receipt.json",
              ".github/issue779-csharp-native/README.md",
              ".github/issue779-csharp-native/acquire-inbound.sh",
              ".github/issue779-csharp-native/check_n10_pending_start.py",
              ".github/issue779-csharp-native/checkpoint-n10-pending-start.sh",
              ".github/issue779-csharp-native/prepare-os-audit-v2.py",
              ".github/issue779-csharp-native/prepare-root-inputs-v2.sh",
              ".github/issue779-csharp-native/prepare-ubuntu-runtime.py",
              ".github/issue779-csharp-native/retain-native.sh",
              ".github/issue779-csharp-native/run-native.py",
              ".github/issue779-csharp-native/source-review.json",
              ".github/issue779-csharp-native/test_actual_batch_parser.py",
              ".github/issue779-csharp-native/test_n10_pending_start.py",
              WORKFLOW,
          }


          def require(value, code):
              if not value:
                  raise ValueError(code)


          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate-review-member")
                  result[key] = value
              return result


          def normalized_workflow(raw):
              """Exclude exactly the workflow's one digest of its enclosing review."""
              pattern = rb"(?m)^(      EXECUTION_REVIEW_SHA256: )[0-9a-f]{64}$"
              require(len(re.findall(pattern, raw)) == 1, "workflow-review-pin-shape")
              return re.sub(pattern, lambda match: match[1] + b"0" * 64, raw)


          def identity(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                      info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)


          def read_fixed(root, relative, maximum, deadline):
              """Bound regular single-link bytes and retain the descriptor during checks."""
              require(time.monotonic_ns() < deadline, "review-deadline")
              path = root / relative
              before = path.lstat()
              require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                      and stat.S_IMODE(before.st_mode) == 0o644
                      and 0 < before.st_size <= maximum, "review-file-shape")
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  require(identity(os.fstat(fd)) == identity(before), "review-file-identity")
                  raw = bytearray()
                  while len(raw) <= maximum:
                      require(time.monotonic_ns() < deadline, "review-deadline")
                      chunk = os.read(fd, min(65536, maximum + 1 - len(raw)))
                      if not chunk:
                          break
                      raw.extend(chunk)
                  require(len(raw) == before.st_size and len(raw) <= maximum
                          and identity(os.fstat(fd)) == identity(before)
                          and identity(path.lstat()) == identity(before), "review-file-changed")
                  return bytes(raw)
              finally:
                  os.close(fd)


          def validate(root, expected_digest, branch, source_commit, capture_digest, deadline):
              """Require a completed independent review of this exact installed image."""
              require(type(expected_digest) is str
                      and re.fullmatch("[0-9a-f]{64}", expected_digest), "review-pin")
              raw = read_fixed(root, RECORD, 65536, deadline)
              require(hashlib.sha256(raw).hexdigest() == expected_digest, "review-digest")
              review = json.loads(raw, object_pairs_hook=unique)
              keys = {"schema", "branch", "source_commit", "source_capture_sha256",
                      "clear", "released", "findings", "review_gates", "input_bindings",
                      "native_execution", "native_credit", "native_acceptance"}
              require(type(review) is dict and set(review) == keys
                      and review["schema"] == SCHEMA, "review-schema")
              require(review["clear"] is True and review["released"] is True
                      and review["findings"] == [], "review-pending-or-findings")
              require(review["branch"] == branch and review["source_commit"] == source_commit
                      and review["source_capture_sha256"] == capture_digest, "review-source-binding")
              require(all(review[key] is False for key in
                          ("native_execution", "native_credit", "native_acceptance")), "review-not-native-proof")
              gates = review["review_gates"]
              require(type(gates) is dict and set(gates) == GATES
                      and all(value is True for value in gates.values()), "review-gates")
              rows = review["input_bindings"]
              require(type(rows) is dict and set(rows) == INPUTS, "review-input-membership")
              for relative, row in rows.items():
                  require(type(row) is dict and set(row) == {"sha256", "mode", "bytes"}
                          and type(row["sha256"]) is str and re.fullmatch("[0-9a-f]{64}", row["sha256"])
                          and row["mode"] == "0644" and type(row["bytes"]) is int
                          and 0 < row["bytes"] <= 4194304, "review-input-row")
                  data = read_fixed(root, relative, 4194304, deadline)
                  require(len(data) == row["bytes"], "review-input-size")
                  if relative == WORKFLOW:
                      pin = re.findall(rb"(?m)^      EXECUTION_REVIEW_SHA256: ([0-9a-f]{64})$", data)
                      require(pin == [expected_digest.encode()], "workflow-review-pin-binding")
                      data = normalized_workflow(data)
                  require(hashlib.sha256(data).hexdigest() == row["sha256"], "review-input-digest")
              require(time.monotonic_ns() < deadline, "review-deadline")
              return {"inputs_reviewed": len(rows), "clear": True, "native_credit": False}

          try:
              validate(Path(os.environ['GITHUB_WORKSPACE']), os.environ['EXECUTION_REVIEW_SHA256'],
                       os.environ['GITHUB_REF_NAME'], os.environ['SOURCE_COMMIT'],
                       os.environ['CAPTURE_RECEIPT_SHA256'],
                       int(os.environ['JOB_DEADLINE_MONOTONIC_NS']))
          except Exception:
              print('BOOTSTRAP_REJECTED:independent-execution-review', file=__import__('sys').stderr)
              raise SystemExit(1)
          PY
      - name: Verify all reviewed source bytes before interpreter use
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          import hashlib, os, stat, sys, time
          from pathlib import Path
          pins = (
              ('.github/issue779-csharp-build/build-fdd.sh', 'BUILD_SCRIPT_SHA256', 262144),
              ('.github/issue779-csharp-build/capture-receipt.json', 'CAPTURE_RECEIPT_SHA256', 4194304),
              ('.github/issue779-csharp-native/README.md', 'NATIVE_README_SHA256', 131072),
              ('.github/issue779-csharp-native/acquire-inbound.sh', 'ACQUISITION_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-root-inputs-v2.sh', 'ROOT_TRANSPORT_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-os-audit-v2.py', 'OS_AUDIT_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-ubuntu-runtime.py', 'UBUNTU_RUNTIME_SCRIPT_SHA256', 131072),
              ('.github/issue779-csharp-native/retain-native.sh', 'RETENTION_SHA256', 131072),
              ('.github/issue779-csharp-native/run-native.py', 'ORCHESTRATOR_SHA256', 131072),
              ('.github/issue779-csharp-native/source-review.json', 'SOURCE_REVIEW_SHA256', 65536),
              ('.github/issue779-csharp-native/test_actual_batch_parser.py', 'BATCH_PARSER_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/test_n10_pending_start.py', 'N10_RECORD_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/checkpoint-n10-pending-start.sh', 'N10_FIXTURE_SHA256', 131072),
              ('.github/issue779-csharp-native/check_n10_pending_start.py', 'N10_RECORD_CHECKER_SHA256', 131072),
          )
          try:
              for relative, variable, maximum in pins:
                  path = Path(os.environ['GITHUB_WORKSPACE']) / relative
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 < before.st_size <= maximum:
                      raise ValueError()
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      opened = os.fstat(fd)
                      key = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                      if key(before) != key(opened):
                          raise ValueError()
                      data = bytearray()
                      while len(data) <= maximum:
                          if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                              raise ValueError()
                          chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                          if not chunk:
                              break
                          data.extend(chunk)
                      if len(data) != before.st_size or len(data) > maximum or hashlib.sha256(data).hexdigest() != os.environ[variable]:
                          raise ValueError()
                      if key(os.fstat(fd)) != key(before) or key(path.lstat()) != key(before):
                          raise ValueError()
                  finally:
                      os.close(fd)
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
          except Exception:
              print('BOOTSTRAP_REJECTED:reviewed-source-pin', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run fixed N10 record parser data controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/test_n10_pending_start.py"
          printf '%s  %s\n' "$N10_RECORD_TEST_SHA256" "$script" | /usr/bin/sha256sum --check --strict --status
          /usr/bin/timeout --signal=KILL 120 /usr/bin/python3 -B "$script" -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Fixed Ubuntu execution-runtime prerequisite under existing root bounds
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/prepare-ubuntu-runtime.py"
          printf '%s  %s\n' "$UBUNTU_RUNTIME_SCRIPT_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          /usr/bin/python3 -B "$script" --execute \
            --reviewed-script-sha256 "$UBUNTU_RUNTIME_SCRIPT_SHA256" \
            --runner-sha256 "$ORCHESTRATOR_SHA256"
      - name: Same-host unprivileged selected N10 CLI build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # The builder owns its original 1200s interval and 5s cleanup reserve.
          # Reserve the complete interval in the original outer job clock.
          /usr/bin/python3 -B - <<'PY'
          import os, sys, time
          if int(os.environ['JOB_DEADLINE_MONOTONIC_NS']) - time.monotonic_ns() <= 1200 * 1000000000:
              print('BOOTSTRAP_REJECTED:remaining-job-budget', file=sys.stderr)
              sys.exit(1)
          PY
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-build/build-fdd.sh"
          printf '%s  %s\n' "$BUILD_SCRIPT_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          /usr/bin/bash --noprofile --norc "$script" --execute "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/issue779-csharp-n10-build" \
            "$GITHUB_WORKSPACE/.github/issue779-csharp-build/capture-receipt.json"
      - name: Check current build terminal and complete map pins
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          import hashlib, json, os, stat, sys, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'issue779-csharp-n10-build'
          def pairs(rows):
              result = {}
              for key, value in rows:
                  if key in result:
                      raise ValueError()
                  result[key] = value
              return result
          def read(path, maximum):
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 < before.st_size <= maximum:
                  raise ValueError()
              key = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  if key(before) != key(os.fstat(fd)):
                      raise ValueError()
                  data = bytearray()
                  while len(data) <= maximum:
                      if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                          raise ValueError()
                      chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                      if not chunk:
                          break
                      data.extend(chunk)
                  if len(data) != before.st_size or len(data) > maximum or key(os.fstat(fd)) != key(before) or key(path.lstat()) != key(before):
                      raise ValueError()
              finally:
                  os.close(fd)
              return bytes(data)
          try:
              if (root / 'receipts/late-publication-failure.json').exists():
                  raise ValueError()
              raw = read(root / 'receipts/build-receipt.json', 4194304)
              receipt = json.loads(raw, object_pairs_hook=pairs)
              if receipt['schema'] != 'issue779-csharp-fdd-build-v5' or type(receipt['exit']) is not int or receipt['exit'] != 0 or receipt.get('failure') is not None or receipt['diagnostics']:
                  raise ValueError()
              if (receipt['harness_parent'] != os.environ['HARNESS_PARENT']
                      or receipt['harness_retry_parent'] != os.environ['SOURCE_COMMIT']
                      or receipt['harness_retry_parent_parent'] != os.environ['SOURCE_PARENT']):
                  raise ValueError()
              for phase in ('source_before', 'source_after_assets', 'source_after_build', 'source_final'):
                  fact = receipt[phase]
                  if fact['head'] != os.environ['SOURCE_COMMIT'] or fact['count'] != 2865 or any(fact[k] is not True for k in ('index_tree_matches', 'physical_git_sha1', 'physical_sha256_modes')):
                      raise ValueError()
              if not receipt['commands']:
                  raise ValueError()
              for command in receipt['commands']:
                  if type(command['exit']) is not int or command['exit'] != 0 or command['failure'] is not None or command['waited'] is not True or command['group_absent'] is not True or command['timed_out'] is not False or command['forced_cleanup'] is not False:
                      raise ValueError()
              if set(receipt['artifacts']) != {'source', 'tool', 'runtime'}:
                  raise ValueError()
              for name, fact in receipt['artifacts'].items():
                  tsv = read(root / ('handoff/' + name + '.tsv'), 1048576)
                  nodes = read(root / ('handoff/' + name + '-nodes.json'), 4194304)
                  if hashlib.sha256(tsv).hexdigest() != fact['tsv_sha256'] or hashlib.sha256(nodes).hexdigest() != fact['nodes_sha256']:
                      raise ValueError()
                  inventory = json.loads(nodes, object_pairs_hook=pairs)
                  if set(inventory) != {'schema', 'root_name', 'files', 'directories'} or inventory['schema'] != 'issue779-build-node-inventory-v1' or inventory['root_name'] != name:
                      raise ValueError()
                  if len(inventory['files']) != fact['file_count'] or len(inventory['files']) + len(inventory['directories']) != fact['node_count']:
                      raise ValueError()
                  if sum(row['bytes'] for row in inventory['files'].values()) != fact['total_bytes']:
                      raise ValueError()
              if receipt['artifacts']['source']['file_count'] != 2865:
                  raise ValueError()
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
              print('BUILD_TERMINAL_VERIFIED:source2865:no-native-execution', flush=True)
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
          except Exception:
              print('BOOTSTRAP_REJECTED:build-terminal-or-map-pins', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Stage reviewed root inputs and execute fixed N10 pending-start race control
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/run-native.py"
          printf '%s  %s\n' "$ORCHESTRATOR_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          set +e
          /usr/bin/python3 -B "$script" --execute --workspace "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/issue779-csharp-n10-build" \
            --output "$RUNNER_TEMP/issue779-csharp-n10-run" \
            --reviewed-script-sha256 "$ORCHESTRATOR_SHA256"
          code=$?
          set -e
          /usr/bin/python3 -B - "$code" <<'PY'
          import json, os, pathlib, sys, time
          code = int(sys.argv[1])
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue779-csharp-n10-run'
          deadline = int(os.environ['JOB_DEADLINE_MONOTONIC_NS'])
          if time.monotonic_ns() >= deadline or not folder.is_dir() or folder.is_symlink():
              sys.exit(1)
          target = folder / 'outer-terminal.json'
          with target.open('x') as output:
              os.fchmod(output.fileno(), 0o600)
              json.dump({'schema': 'issue779-csharp-native-outer-terminal-v1', 'exit': code}, output)
              output.flush()
              os.fsync(output.fileno())
          if time.monotonic_ns() >= deadline:
              sys.exit(1)
          if code != 0 or (folder / 'native-late-failure.json').exists():
              sys.exit(1)
          receipt = json.loads((folder / 'native-receipt.json').read_bytes())
          if type(receipt.get('exit')) is not int or receipt['exit'] != 0 or receipt.get('fixture_result_verified') is not True:
              sys.exit(1)
          PY
          test "$code" -eq 0
      - name: Retain bounded build and private native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
