name: C# Linux native N15 accepted-work cleanup
on:
  push:
    branches: [codex/issue779-csharp-linux-native-20261013-n15-build-count-v26]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Promotion requires frozen source reviews and a complete native handoff.
      # Promote only after full source composition review; no native passing claim.
      # Fail closed until all three N15 source/custody reviews and final pins are supplied.
      N15_SOURCE_CAPTURE_REVIEW_CLEAR: 'true'
      N15_FIXTURE_REVIEW_CLEAR: 'true'
      N15_ROOT_CLEANUP_REVIEW_CLEAR: 'true'
      UBUNTU_RUNTIME_REVIEWED: 'true'
      BUILD_REVIEWED: 'true'
      ROOT_TRANSPORT_REVIEWED: 'true'
      OS_AUDIT_REVIEWED: 'true'
      SOURCE_COMMIT: a6933fa3dc2c7a88832abf337447f88527477703
      SOURCE_PARENT: 0adef6032217b4181898a4d6d129e1248cb0eda3
      HARNESS_PARENT: a6933fa3dc2c7a88832abf337447f88527477703
      OS_AUDIT_SHA256: b345b2be77b359af23ade0b334caf76d7fdeb14bd2d4a3f0837beb21232df5e0
      N15_FIXTURE_SHA256: 4173aebafc664737d4093fe0de2bc63113db10d193e4caa52851a6405cd82bf9
      N15_RECORD_CHECKER_SHA256: a2c1b288ca88b2e89a5c0b60fad0b187d6a35dc22474cb47b80ef46f65fd4dc8
      REACTIVATION_RETRY_SHA256: 4dbc69f8ae8220077cdf3f94279dabefd78499ffa5d848cf800ced7ccdad40da
      N15_RECORD_TEST_SHA256: 47fb8eae031c783f995bb172c4043879754acd6e026251cd7c5f7b51a7228b54
      N15_FINALIZER_SHA256: 529a0c89664a8bca02e0d2da899b3faedf21671303fcd58c221213971ba27df5
      N15_FINALIZER_TEST_SHA256: 421cef4bd8fbb4aeed46d0a59da879c0811480ab9f252df35b1dfe3489786a66
      N15_OBSERVER_SHA256: f8132a3d583c9573ab3099da89366b17a8477876ef86bd934621ffbc22f9f6fc
      CASE_WORKSPACE_SHA256: 43369dd5912fa125c219ed96f0d564d36b9b917e55df7e02914265ea26e5a3a9
      # Final reviewed component bytes; independent installation review gates publication.
      BUILD_SCRIPT_SHA256: 8942333c8b5b30dbf41fdedbc65125cf8ac5ccd3a50f801a8f571f99d8ca72a3
      CAPTURE_RECEIPT_SHA256: b1e43764ca61d2430f4cfc6e77aa20c3504fcc1be226e1d8e59f21ef127953e7
      UBUNTU_RUNTIME_SCRIPT_SHA256: 17c47e7d3b6e55afd9ab15643b4f9bc3f9c7e0359a04d5e20e2d40b8290f04b5
      ROOT_TRANSPORT_SHA256: 54e5323cf02bb29c0e75abb8c19ae86aac9b860455540f051cd75b4b384fe289
      ACQUISITION_SHA256: cd56e3efc5e15e0edea5f9e90b0861d3fc497ac18e75bcfb7381c7a5e1da288e
      RETENTION_SHA256: 6ba3f76b69e95eb1084e22f4745da1f28dd93bcf7b7a59ac27fe47b8597d461c
      ORCHESTRATOR_SHA256: 1b87de4427e143bd8e6da3f9df44eacef5197e87c4f2dcfb246ed36777c931f1
      SOURCE_REVIEW_SHA256: 2327042742b383df61e874adca6d1148feb92bd6c8272a13d26da759e16a7d49
      NATIVE_README_SHA256: d049638562bd3fb0dfd49aae912b03aae4d9e69e74f36bacf84a67d2c88587ed
      BATCH_PARSER_TEST_SHA256: 94cb67b53e57cb2fdd2c655254665d27cbb6b8c353ab88f1000ed4df447257d4
      N15_HANDOFF_SELECTOR_TEST_SHA256: 745ab9bdba600655d342179daf35a4a6cd90e83849aee4e719952995452fe6b5
    steps:
      - name: Reject unreviewed or incomplete proposal before build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for flag in UBUNTU_RUNTIME_REVIEWED BUILD_REVIEWED ROOT_TRANSPORT_REVIEWED OS_AUDIT_REVIEWED N15_SOURCE_CAPTURE_REVIEW_CLEAR N15_FIXTURE_REVIEW_CLEAR N15_ROOT_CLEANUP_REVIEW_CLEAR; do
            test "${!flag}" = true
          done
          for pin in BUILD_SCRIPT_SHA256 CAPTURE_RECEIPT_SHA256 UBUNTU_RUNTIME_SCRIPT_SHA256 ROOT_TRANSPORT_SHA256 ACQUISITION_SHA256 RETENTION_SHA256 ORCHESTRATOR_SHA256 SOURCE_REVIEW_SHA256 NATIVE_README_SHA256 OS_AUDIT_SHA256 N15_FIXTURE_SHA256 N15_RECORD_CHECKER_SHA256 N15_RECORD_TEST_SHA256 N15_FINALIZER_SHA256 N15_FINALIZER_TEST_SHA256 REACTIVATION_RETRY_SHA256 N15_OBSERVER_SHA256 CASE_WORKSPACE_SHA256 N15_HANDOFF_SELECTOR_TEST_SHA256; do
            [[ "${!pin}" =~ ^[0-9a-f]{64}$ ]]
          done
          # This original job clock must also bracket final native publication.
          /usr/bin/python3 -B - <<'PY' >> "$GITHUB_ENV"
          import time
          print('JOB_DEADLINE_MONOTONIC_NS=' + str(time.monotonic_ns() + 2100 * 1000000000))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all reviewed source bytes before interpreter use
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          import hashlib, os, stat, sys, time
          from pathlib import Path
          pins = (
              ('.github/issue779-csharp-build/build-fdd.sh', 'BUILD_SCRIPT_SHA256', 262144),
              ('.github/issue779-csharp-build/capture-receipt.json', 'CAPTURE_RECEIPT_SHA256', 4194304),
              ('.github/issue779-csharp-native/README.md', 'NATIVE_README_SHA256', 131072),
              ('.github/issue779-csharp-native/acquire-inbound.sh', 'ACQUISITION_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-root-inputs-v2.sh', 'ROOT_TRANSPORT_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-os-audit-v2.py', 'OS_AUDIT_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-ubuntu-runtime.py', 'UBUNTU_RUNTIME_SCRIPT_SHA256', 131072),
              ('.github/issue779-csharp-native/retain-native.sh', 'RETENTION_SHA256', 131072),
              ('.github/issue779-csharp-native/run-native.py', 'ORCHESTRATOR_SHA256', 131072),
              ('.github/issue779-csharp-native/source-review.json', 'SOURCE_REVIEW_SHA256', 65536),
              ('.github/issue779-csharp-native/test_actual_batch_parser.py', 'BATCH_PARSER_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/test_n15_records.py', 'N15_RECORD_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/finalize_n15_observation.py', 'N15_FINALIZER_SHA256', 131072),
              ('.github/issue779-csharp-native/test_finalize_n15_observation.py', 'N15_FINALIZER_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/checkpoint-n15-pending-start-death.sh', 'N15_FIXTURE_SHA256', 131072),
              ('.github/issue779-csharp-native/check_n15_records.py', 'N15_RECORD_CHECKER_SHA256', 131072),
              ('.github/issue779-csharp-native/n15-guard-reactivation-retry.sh', 'REACTIVATION_RETRY_SHA256', 32768),
              ('.github/issue779-csharp-native/observe_n15_pending_start.py', 'N15_OBSERVER_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-case-workspace.py', 'CASE_WORKSPACE_SHA256', 131072),
              ('.github/issue779-csharp-native/test_n15_handoff_selector.py', 'N15_HANDOFF_SELECTOR_TEST_SHA256', 65536),
          )
          expected_pin_variables = {
              'BUILD_SCRIPT_SHA256', 'CAPTURE_RECEIPT_SHA256', 'NATIVE_README_SHA256',
              'ACQUISITION_SHA256', 'ROOT_TRANSPORT_SHA256', 'OS_AUDIT_SHA256',
              'UBUNTU_RUNTIME_SCRIPT_SHA256', 'RETENTION_SHA256', 'ORCHESTRATOR_SHA256',
              'SOURCE_REVIEW_SHA256', 'BATCH_PARSER_TEST_SHA256', 'N15_RECORD_TEST_SHA256',
              'N15_FINALIZER_SHA256', 'N15_FINALIZER_TEST_SHA256', 'N15_FIXTURE_SHA256',
              'N15_RECORD_CHECKER_SHA256', 'REACTIVATION_RETRY_SHA256',
              'N15_OBSERVER_SHA256', 'CASE_WORKSPACE_SHA256', 'N15_HANDOFF_SELECTOR_TEST_SHA256',
          }
          pin_variables = [variable for _, variable, _ in pins]
          pin_paths = [relative for relative, _, _ in pins]
          if (len(pin_variables) != len(expected_pin_variables)
                  or set(pin_variables) != expected_pin_variables
                  or len(pin_paths) != len(set(pin_paths))
                  or pins.count(('.github/issue779-csharp-native/n15-guard-reactivation-retry.sh',
                                'REACTIVATION_RETRY_SHA256', 32768)) != 1):
              raise ValueError('workflow-pin-table-coverage')
          try:
              installed_paths = set(pin_paths) | {'.github/workflows/issue779-csharp-linux-native.yml'}
              for relative in installed_paths:
                  installed = Path(os.environ['GITHUB_WORKSPACE']) / relative
                  mode_stat = installed.lstat()
                  if (not stat.S_ISREG(mode_stat.st_mode) or mode_stat.st_nlink != 1
                          or stat.S_IMODE(mode_stat.st_mode) != 0o644):
                      raise ValueError('installed-input-mode')
              for relative, variable, maximum in pins:
                  path = Path(os.environ['GITHUB_WORKSPACE']) / relative
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 < before.st_size <= maximum:
                      raise ValueError()
                  if stat.S_IMODE(before.st_mode) != 0o644:
                      raise ValueError('installed-input-mode')
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      opened = os.fstat(fd)
                      key = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                      if key(before) != key(opened):
                          raise ValueError()
                      data = bytearray()
                      while len(data) <= maximum:
                          if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                              raise ValueError()
                          chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                          if not chunk:
                              break
                          data.extend(chunk)
                      if len(data) != before.st_size or len(data) > maximum or hashlib.sha256(data).hexdigest() != os.environ[variable]:
                          raise ValueError()
                      if key(os.fstat(fd)) != key(before) or key(path.lstat()) != key(before):
                          raise ValueError()
                  finally:
                      os.close(fd)
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
          except Exception:
              print('BOOTSTRAP_REJECTED:reviewed-source-pin', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run fixed N15 record and finalizer data controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/test_n15_records.py"
          printf '%s  %s\n' "$N15_RECORD_TEST_SHA256" "$script" | /usr/bin/sha256sum --check --strict --status
          /usr/bin/timeout --signal=KILL 120 /usr/bin/python3 -B "$script" -v
          finalizer_test="$GITHUB_WORKSPACE/.github/issue779-csharp-native/test_finalize_n15_observation.py"
          printf '%s  %s\n' "$N15_FINALIZER_TEST_SHA256" "$finalizer_test" | /usr/bin/sha256sum --check --strict --status
          /usr/bin/timeout --signal=KILL 30 /usr/bin/python3 -B "$finalizer_test" -v
          handoff_test="$GITHUB_WORKSPACE/.github/issue779-csharp-native/test_n15_handoff_selector.py"
          printf '%s  %s\n' "$N15_HANDOFF_SELECTOR_TEST_SHA256" "$handoff_test" | /usr/bin/sha256sum --check --strict --status
          /usr/bin/timeout --signal=KILL 30 /usr/bin/python3 -B "$handoff_test" -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Fixed Ubuntu execution-runtime prerequisite under existing root bounds
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/prepare-ubuntu-runtime.py"
          printf '%s  %s\n' "$UBUNTU_RUNTIME_SCRIPT_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          /usr/bin/python3 -B "$script" --execute \
            --reviewed-script-sha256 "$UBUNTU_RUNTIME_SCRIPT_SHA256" \
            --runner-sha256 "$ORCHESTRATOR_SHA256"
      - name: Same-host unprivileged full normal CLI build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # The builder owns its original 1200s interval and 5s cleanup reserve.
          # Reserve the complete interval in the original outer job clock.
          /usr/bin/python3 -B - <<'PY'
          import os, sys, time
          if int(os.environ['JOB_DEADLINE_MONOTONIC_NS']) - time.monotonic_ns() <= 1200 * 1000000000:
              print('BOOTSTRAP_REJECTED:remaining-job-budget', file=sys.stderr)
              sys.exit(1)
          PY
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-build/build-fdd.sh"
          printf '%s  %s\n' "$BUILD_SCRIPT_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          /usr/bin/bash --noprofile --norc "$script" --execute "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/issue779-csharp-n15-build" \
            "$GITHUB_WORKSPACE/.github/issue779-csharp-build/capture-receipt.json"
      - name: Check current build terminal and complete map pins
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          import hashlib, json, os, stat, sys, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'issue779-csharp-n15-build'
          def pairs(rows):
              result = {}
              for key, value in rows:
                  if key in result:
                      raise ValueError()
                  result[key] = value
              return result
          def read(path, maximum):
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 < before.st_size <= maximum:
                  raise ValueError()
              key = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  if key(before) != key(os.fstat(fd)):
                      raise ValueError()
                  data = bytearray()
                  while len(data) <= maximum:
                      if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                          raise ValueError()
                      chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                      if not chunk:
                          break
                      data.extend(chunk)
                  if len(data) != before.st_size or len(data) > maximum or key(os.fstat(fd)) != key(before) or key(path.lstat()) != key(before):
                      raise ValueError()
              finally:
                  os.close(fd)
              return bytes(data)
          try:
              if (root / 'receipts/late-publication-failure.json').exists():
                  raise ValueError()
              raw = read(root / 'receipts/build-receipt.json', 4194304)
              receipt = json.loads(raw, object_pairs_hook=pairs)
              if receipt['schema'] != 'issue779-csharp-fdd-build-v5' or type(receipt['exit']) is not int or receipt['exit'] != 0 or receipt.get('failure') is not None or receipt['diagnostics']:
                  raise ValueError()
              if (receipt['harness_parent'] != os.environ['HARNESS_PARENT']
                      or receipt['harness_retry_parent'] != os.environ['SOURCE_COMMIT']
                      or receipt['harness_retry_parent_parent'] != os.environ['SOURCE_PARENT']):
                  raise ValueError()
              for phase in ('source_before', 'source_after_assets', 'source_after_build', 'source_final'):
                  fact = receipt[phase]
                  if fact['head'] != os.environ['SOURCE_COMMIT'] or fact['count'] != 2869 or any(fact[k] is not True for k in ('index_tree_matches', 'physical_git_sha1', 'physical_sha256_modes')):
                      raise ValueError()
              if not receipt['commands']:
                  raise ValueError()
              for command in receipt['commands']:
                  if type(command['exit']) is not int or command['exit'] != 0 or command['failure'] is not None or command['waited'] is not True or command['group_absent'] is not True or command['timed_out'] is not False or command['forced_cleanup'] is not False:
                      raise ValueError()
              if set(receipt['artifacts']) != {'source', 'tool', 'runtime'}:
                  raise ValueError()
              for name, fact in receipt['artifacts'].items():
                  tsv = read(root / ('handoff/' + name + '.tsv'), 1048576)
                  nodes = read(root / ('handoff/' + name + '-nodes.json'), 4194304)
                  if hashlib.sha256(tsv).hexdigest() != fact['tsv_sha256'] or hashlib.sha256(nodes).hexdigest() != fact['nodes_sha256']:
                      raise ValueError()
                  inventory = json.loads(nodes, object_pairs_hook=pairs)
                  if set(inventory) != {'schema', 'root_name', 'files', 'directories'} or inventory['schema'] != 'issue779-build-node-inventory-v1' or inventory['root_name'] != name:
                      raise ValueError()
                  if len(inventory['files']) != fact['file_count'] or len(inventory['files']) + len(inventory['directories']) != fact['node_count']:
                      raise ValueError()
                  if sum(row['bytes'] for row in inventory['files'].values()) != fact['total_bytes']:
                      raise ValueError()
              if receipt['artifacts']['source']['file_count'] != 2869:
                  raise ValueError()
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
              print('BUILD_TERMINAL_VERIFIED:source2869:no-native-execution', flush=True)
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
          except Exception:
              print('BOOTSTRAP_REJECTED:build-terminal-or-map-pins', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Stage reviewed root inputs and execute fixed N15 pending-start death control
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/run-native.py"
          printf '%s  %s\n' "$ORCHESTRATOR_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          set +e
          /usr/bin/python3 -B "$script" --execute --workspace "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/issue779-csharp-n15-build" \
            --output "$RUNNER_TEMP/issue779-csharp-n15-run" \
            --reviewed-script-sha256 "$ORCHESTRATOR_SHA256"
          code=$?
          set -e
          /usr/bin/python3 -B - "$code" <<'PY'
          import json, os, pathlib, sys, time
          code = int(sys.argv[1])
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue779-csharp-n15-run'
          deadline = int(os.environ['JOB_DEADLINE_MONOTONIC_NS'])
          if time.monotonic_ns() >= deadline or not folder.is_dir() or folder.is_symlink():
              sys.exit(1)
          target = folder / 'outer-terminal.json'
          with target.open('x') as output:
              os.fchmod(output.fileno(), 0o600)
              json.dump({'schema': 'issue779-csharp-native-outer-terminal-v1', 'exit': code}, output)
              output.flush()
              os.fsync(output.fileno())
          if time.monotonic_ns() >= deadline:
              sys.exit(1)
          if code != 0 or (folder / 'native-late-failure.json').exists():
              sys.exit(1)
          receipt = json.loads((folder / 'native-receipt.json').read_bytes())
          if type(receipt.get('exit')) is not int or receipt['exit'] != 0 or receipt.get('fixture_result_verified') is not True:
              sys.exit(1)
          PY
          test "$code" -eq 0
      - name: Retain bounded build and private native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue779-csharp-n15-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/issue779-csharp-n15-build/receipts/
            ${{ runner.temp }}/issue779-csharp-n15-build/handoff/
            ${{ runner.temp }}/issue779-csharp-n15-run/
            ${{ runner.temp }}/issue779-csharp-ubuntu-runtime/
