name: Issue 779 private resource-backed qualification

on:
  push:
    branches: [codex/issue779-private-qualification-20261003]

permissions:
  contents: read

jobs:
  qualification:
    name: Real protected CLI and public Host, no claim
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact private harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm 11.1.3
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Freeze selected source under root ownership
        shell: bash
        run: |
          set -euo pipefail
          task_source="$RUNNER_TEMP/issue779-private-qualification-source"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$task_source"
          git -C "$task_source" checkout --quiet --detach d7e0d1e8c463ee804b6d477e2681a1dd50c6eafa
          test "$(git -C "$task_source" rev-parse HEAD)" = d7e0d1e8c463ee804b6d477e2681a1dd50c6eafa
          test -z "$(git -C "$task_source" status --porcelain)"
          sudo chown -R root:root "$task_source"
      - name: Verify private data and process ownership controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/issue779-private-qualification-source"
          timeout --signal=TERM --kill-after=5s 60s python3 -B -m unittest discover \
            -s tests/evidencehost-consumer/PrivateQualification -p 'test_*.py' -v
          timeout --signal=TERM --kill-after=5s 45s python3 -B \
            tests/evidencehost-consumer/test_private_vstest_diagnostics.py -v
          timeout --signal=TERM --kill-after=5s 30s python3 -B \
            tests/evidencehost-consumer/test_linux_launcher.py PrivateVstestDiagnosticOrchestrationControls -v
          timeout --signal=TERM --kill-after=5s 30s python3 -B \
            tests/evidencehost-consumer/test_private_collector_sample.py -v
          timeout --signal=TERM --kill-after=5s 30s python3 -B \
            tests/evidencehost-consumer/test_linux_launcher.py PrivateCollectorSamplingOrchestrationControls -v
      - name: Execute one compiled qualification variant through both actual entries
        shell: bash
        run: |
          set -euo pipefail
          task_source="$RUNNER_TEMP/issue779-private-qualification-source"
          node_tool="$(command -v node)"
          pnpm_tool="$(command -v pnpm)"
          for task_tool in "$node_tool" "$pnpm_tool"; do
            [[ "$task_tool" == /* && "$task_tool" != *:* && "$task_tool" != *$'\n'* ]]
            test -f "$task_tool" && test -x "$task_tool"
          done
          preparation_path="/usr/share/issue779-dotnet-10.0.401:$(dirname "$node_tool"):$(dirname "$pnpm_tool"):/usr/bin:/bin"
          sudo env "PATH=$preparation_path" /usr/bin/python3 -B "$task_source/tests/evidencehost-consumer/PrivateQualification/run-qualification.py" \
            --source-commit d7e0d1e8c463ee804b6d477e2681a1dd50c6eafa \
            --workflow-head "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --workflow-file .github/workflows/issue779-private-qualification.yml \
            --output "$RUNNER_TEMP/issue779-private-qualification-root-output"
      - name: Retain safe terminal receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          source_receipt="$RUNNER_TEMP/issue779-private-qualification-root-output/qualification-receipt.json"
          task_receipts="$RUNNER_TEMP/issue779-private-qualification-receipts"
          mkdir -m 700 "$task_receipts"
          if sudo test -f "$source_receipt"; then
            sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$source_receipt" "$task_receipts/qualification-receipt.json"
          fi
          source_archive="$RUNNER_TEMP/issue779-private-qualification-root-output/private-diagnostics.tar"
          if sudo test -f "$source_archive"; then
            sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$source_archive" "$task_receipts/private-diagnostics.tar"
          fi
      - name: Upload terminal receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue779-private-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue779-private-qualification-receipts/
          if-no-files-found: warn
          retention-days: 7
