name: C# Linux native N09 retained-slot source preparation
on:
  push:
    branches: [codex/issue779-csharp-linux-native-20261011-n09-retained-allocation-v1]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Exact static scopes reviewed; native result pending; N03 remains separately required.
      SOURCE_CAPTURE_REVIEWED: 'true'
      FIXTURE_REVIEWED: 'true'
      ROOT_CLEANUP_REVIEWED: 'true'
      UBUNTU_RUNTIME_REVIEWED: 'true'
      BUILD_REVIEWED: 'true'
      ROOT_TRANSPORT_REVIEWED: 'true'
      OS_AUDIT_REVIEWED: 'true'
      PARSER_REVIEWED: 'true'
      NATIVE_HANDOFF_REVIEWED: 'true'
      CANCELLATION_INTEGRATION_REVIEW_CLEAR: 'true'
      SOURCE_COMMIT: '0c100a94d93f82fd633e5674009a41659940d010'
      SOURCE_PARENT: '03ff51b361d686e6e2590a27e9a4f43529cdbaf2'
      HARNESS_PARENT: '0c100a94d93f82fd633e5674009a41659940d010'
      INSTALLATION_DELTA_COUNT: '19'
      SOURCE_WHOLE_FILE_COUNT: '2884'
      BUILD_SCRIPT_SHA256: 'f380f48448ca8fedbb52aee1cdfe1ca19f62aeac21ddd8499f9cfc6dc0eaff8e'
      CAPTURE_RECEIPT_SHA256: '653d30169f6fc3aed53274349304dfebc3aff2b529e42bf3a4524a37fa546fd2'
      NATIVE_README_SHA256: 'd844568230e8bd3a08138fc2f2298bd1325627ccda1d780d01624623b6f212be'
      ACQUISITION_SHA256: '1289fa303100586b5ae53f8a07033d7e5c1a0d9d063b9c3fa1709e13350125bb'
      ROOT_TRANSPORT_SHA256: '8410379c983ce4c4578a17ba449425c87d064e878355c6b90e8419dc8a9c9f88'
      OS_AUDIT_SHA256: 'b345b2be77b359af23ade0b334caf76d7fdeb14bd2d4a3f0837beb21232df5e0'
      UBUNTU_RUNTIME_SCRIPT_SHA256: '14592aaaacbd78af3814059cd87bbf513938fada8028d53917d1edcbdbbd9db1'
      RETENTION_SHA256: '427a3b1f9698b930a4cc556c58c766b9e98c919de95b34f00546ac4d67015b59'
      ORCHESTRATOR_SHA256: 'c296bc8d852b41daa8c1d126d6a4c42f44728868ab8f67b62f93602cabc5b928'
      SOURCE_REVIEW_SHA256: '189cef9183e394946a1f3a87f0934616c00ae51e387335798b762463793f8d90'
      BATCH_PARSER_TEST_SHA256: '6c2bd14edeeef3c1b73ef8442a33881e49ca90ecfc71a9eaa1f1c53d8679ba81'
      N09_FIXTURE_SHA256: '7d328dfab17db1378e66fd1ce9d5fd4edfa8b96a673409768387b218d22aca45'
      N09_RECORD_CHECKER_SHA256: '3c1bdb716e32afbd7ece77a8dca90805896a6c046c7d34964ba4c0fc6667a468'
      N09_RECORD_TEST_SHA256: '1eb948ed59c6d2bfd016f61b124e70d6ecc9643aedb815e921f812896e864d25'
      N09_RUNTIME_CANCELLATION_ADAPTER_SHA256: '8b02473ad90695df1840a14af0e02d5d17c3bee79177eb826a228f3345b6ee0f'
      N09_RUNTIME_CHECK_CANCELLATION_RECORDS_SHA256: 'c45238cc3bd129a19af3d04dfa12bc83a82345b130e43f7296808ecee7e5cee6'
      N09_RUNTIME_CHECK_KERNEL_RECORD_SHA256: '90da0002db90ddb8b769bd3530551f10363ce772bc99327bdd27976be71cf3ab'
      N09_RUNTIME_PROJECTION_PARSER_PINS_SHA256: '889840621877bec5fbb3fa0cce5311be016a019d8b77ed0b329417deb10c8cc9'
    steps:
      - name: Reject unreviewed or incomplete proposal before build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for flag in SOURCE_CAPTURE_REVIEWED FIXTURE_REVIEWED ROOT_CLEANUP_REVIEWED UBUNTU_RUNTIME_REVIEWED BUILD_REVIEWED ROOT_TRANSPORT_REVIEWED OS_AUDIT_REVIEWED PARSER_REVIEWED NATIVE_HANDOFF_REVIEWED CANCELLATION_INTEGRATION_REVIEW_CLEAR; do
            test "${!flag}" = true
          done
          for pin in BUILD_SCRIPT_SHA256 CAPTURE_RECEIPT_SHA256 UBUNTU_RUNTIME_SCRIPT_SHA256 ROOT_TRANSPORT_SHA256 ACQUISITION_SHA256 RETENTION_SHA256 ORCHESTRATOR_SHA256 SOURCE_REVIEW_SHA256 NATIVE_README_SHA256 OS_AUDIT_SHA256 N09_FIXTURE_SHA256 N09_RECORD_CHECKER_SHA256 N09_RECORD_TEST_SHA256 N09_RUNTIME_CANCELLATION_ADAPTER_SHA256 N09_RUNTIME_CHECK_CANCELLATION_RECORDS_SHA256 N09_RUNTIME_CHECK_KERNEL_RECORD_SHA256 N09_RUNTIME_PROJECTION_PARSER_PINS_SHA256; do
            [[ "${!pin}" =~ ^[0-9a-f]{64}$ ]]
          done
          # This original job clock must also bracket final native publication.
          /usr/bin/python3 -B - <<'PY' >> "$GITHUB_ENV"
          import time
          print('JOB_DEADLINE_MONOTONIC_NS=' + str(time.monotonic_ns() + 2100 * 1000000000))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all reviewed source bytes before interpreter use
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          import hashlib, os, stat, sys, time
          from pathlib import Path
          pins = (
              ('.github/issue779-csharp-build/build-fdd.sh', 'BUILD_SCRIPT_SHA256', 262144),
              ('.github/issue779-csharp-build/capture-receipt.json', 'CAPTURE_RECEIPT_SHA256', 4194304),
              ('.github/issue779-csharp-native/README.md', 'NATIVE_README_SHA256', 131072),
              ('.github/issue779-csharp-native/acquire-inbound.sh', 'ACQUISITION_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-root-inputs-v2.sh', 'ROOT_TRANSPORT_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-os-audit-v2.py', 'OS_AUDIT_SHA256', 131072),
              ('.github/issue779-csharp-native/prepare-ubuntu-runtime.py', 'UBUNTU_RUNTIME_SCRIPT_SHA256', 131072),
              ('.github/issue779-csharp-native/retain-native.sh', 'RETENTION_SHA256', 131072),
              ('.github/issue779-csharp-native/run-native.py', 'ORCHESTRATOR_SHA256', 131072),
              ('.github/issue779-csharp-native/source-review.json', 'SOURCE_REVIEW_SHA256', 65536),
              ('.github/issue779-csharp-native/test_actual_batch_parser.py', 'BATCH_PARSER_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/test_n09_records.py', 'N09_RECORD_TEST_SHA256', 65536),
              ('.github/issue779-csharp-native/checkpoint-n09-retained-slot.sh', 'N09_FIXTURE_SHA256', 131072),
              ('.github/issue779-csharp-native/check_n09_records.py', 'N09_RECORD_CHECKER_SHA256', 131072),
              ('.github/issue779-csharp-native/cancellation_adapter.py', 'N09_RUNTIME_CANCELLATION_ADAPTER_SHA256', 131072),
              ('.github/issue779-csharp-native/check_cancellation_records.py', 'N09_RUNTIME_CHECK_CANCELLATION_RECORDS_SHA256', 131072),
              ('.github/issue779-csharp-native/check_kernel_record.py', 'N09_RUNTIME_CHECK_KERNEL_RECORD_SHA256', 131072),
              ('.github/issue779-csharp-native/projection-parser-pins.tsv', 'N09_RUNTIME_PROJECTION_PARSER_PINS_SHA256', 131072),
          )
          try:
              for relative, variable, maximum in pins:
                  path = Path(os.environ['GITHUB_WORKSPACE']) / relative
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 < before.st_size <= maximum:
                      raise ValueError()
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      opened = os.fstat(fd)
                      key = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                      if key(before) != key(opened):
                          raise ValueError()
                      data = bytearray()
                      while len(data) <= maximum:
                          if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                              raise ValueError()
                          chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                          if not chunk:
                              break
                          data.extend(chunk)
                      if len(data) != before.st_size or len(data) > maximum or hashlib.sha256(data).hexdigest() != os.environ[variable]:
                          raise ValueError()
                      if key(os.fstat(fd)) != key(before) or key(path.lstat()) != key(before):
                          raise ValueError()
                  finally:
                      os.close(fd)
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
          except Exception:
              print('BOOTSTRAP_REJECTED:reviewed-source-pin', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run fixed N09 record parser data controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/test_n09_records.py"
          printf '%s  %s\n' "$N09_RECORD_TEST_SHA256" "$script" | /usr/bin/sha256sum --check --strict --status
          /usr/bin/timeout --signal=KILL 120 /usr/bin/python3 -B "$script" -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Fixed Ubuntu execution-runtime prerequisite under existing root bounds
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/prepare-ubuntu-runtime.py"
          printf '%s  %s\n' "$UBUNTU_RUNTIME_SCRIPT_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          /usr/bin/python3 -B "$script" --execute \
            --reviewed-script-sha256 "$UBUNTU_RUNTIME_SCRIPT_SHA256" \
            --runner-sha256 "$ORCHESTRATOR_SHA256"
      - name: Same-host unprivileged full normal CLI build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # The builder owns its original 1200s interval and 5s cleanup reserve.
          # Reserve the complete interval in the original outer job clock.
          /usr/bin/python3 -B - <<'PY'
          import os, sys, time
          if int(os.environ['JOB_DEADLINE_MONOTONIC_NS']) - time.monotonic_ns() <= 1200 * 1000000000:
              print('BOOTSTRAP_REJECTED:remaining-job-budget', file=sys.stderr)
              sys.exit(1)
          PY
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-build/build-fdd.sh"
          printf '%s  %s\n' "$BUILD_SCRIPT_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          /usr/bin/bash --noprofile --norc "$script" --execute "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/issue779-csharp-n09-build" \
            "$GITHUB_WORKSPACE/.github/issue779-csharp-build/capture-receipt.json"
      - name: Check current build terminal and complete map pins
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B - <<'PY'
          import hashlib, json, os, stat, sys, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'issue779-csharp-n09-build'
          def pairs(rows):
              result = {}
              for key, value in rows:
                  if key in result:
                      raise ValueError()
                  result[key] = value
              return result
          def read(path, maximum):
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 < before.st_size <= maximum:
                  raise ValueError()
              key = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  if key(before) != key(os.fstat(fd)):
                      raise ValueError()
                  data = bytearray()
                  while len(data) <= maximum:
                      if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                          raise ValueError()
                      chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                      if not chunk:
                          break
                      data.extend(chunk)
                  if len(data) != before.st_size or len(data) > maximum or key(os.fstat(fd)) != key(before) or key(path.lstat()) != key(before):
                      raise ValueError()
              finally:
                  os.close(fd)
              return bytes(data)
          try:
              if (root / 'receipts/late-publication-failure.json').exists():
                  raise ValueError()
              raw = read(root / 'receipts/build-receipt.json', 4194304)
              receipt = json.loads(raw, object_pairs_hook=pairs)
              if receipt['schema'] != 'issue779-csharp-fdd-build-v5' or type(receipt['exit']) is not int or receipt['exit'] != 0 or receipt.get('failure') is not None or receipt['diagnostics']:
                  raise ValueError()
              if (receipt['harness_retry_installation_count'] != int(os.environ['INSTALLATION_DELTA_COUNT'])
                      or receipt['source_whole_file_count'] != int(os.environ['SOURCE_WHOLE_FILE_COUNT'])):
                  raise ValueError()
              if (receipt['harness_parent'] != os.environ['HARNESS_PARENT']
                      or receipt['harness_retry_parent'] != os.environ['SOURCE_COMMIT']
                      or receipt['harness_retry_parent_parent'] != os.environ['SOURCE_PARENT']):
                  raise ValueError()
              for phase in ('source_before', 'source_after_assets', 'source_after_build', 'source_final'):
                  fact = receipt[phase]
                  if fact['head'] != os.environ['SOURCE_COMMIT'] or fact['count'] != 2865 or any(fact[k] is not True for k in ('index_tree_matches', 'physical_git_sha1', 'physical_sha256_modes')):
                      raise ValueError()
              if not receipt['commands']:
                  raise ValueError()
              for command in receipt['commands']:
                  if type(command['exit']) is not int or command['exit'] != 0 or command['failure'] is not None or command['waited'] is not True or command['group_absent'] is not True or command['timed_out'] is not False or command['forced_cleanup'] is not False:
                      raise ValueError()
              if set(receipt['artifacts']) != {'source', 'tool', 'runtime'}:
                  raise ValueError()
              for name, fact in receipt['artifacts'].items():
                  tsv = read(root / ('handoff/' + name + '.tsv'), 1048576)
                  nodes = read(root / ('handoff/' + name + '-nodes.json'), 4194304)
                  if hashlib.sha256(tsv).hexdigest() != fact['tsv_sha256'] or hashlib.sha256(nodes).hexdigest() != fact['nodes_sha256']:
                      raise ValueError()
                  inventory = json.loads(nodes, object_pairs_hook=pairs)
                  if set(inventory) != {'schema', 'root_name', 'files', 'directories'} or inventory['schema'] != 'issue779-build-node-inventory-v1' or inventory['root_name'] != name:
                      raise ValueError()
                  if len(inventory['files']) != fact['file_count'] or len(inventory['files']) + len(inventory['directories']) != fact['node_count']:
                      raise ValueError()
                  if sum(row['bytes'] for row in inventory['files'].values()) != fact['total_bytes']:
                      raise ValueError()
              if receipt['artifacts']['source']['file_count'] != 2849:
                  raise ValueError()
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
              print('BUILD_TERMINAL_VERIFIED:source2849:no-native-execution', flush=True)
              if time.monotonic_ns() >= int(os.environ['JOB_DEADLINE_MONOTONIC_NS']):
                  raise ValueError()
          except Exception:
              print('BOOTSTRAP_REJECTED:build-terminal-or-map-pins', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Stage reviewed root inputs and execute fixed N09 accepted-work cleanup control
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="$GITHUB_WORKSPACE/.github/issue779-csharp-native/run-native.py"
          printf '%s  %s\n' "$ORCHESTRATOR_SHA256" "$script" | /usr/bin/sha256sum --check --strict
          set +e
          /usr/bin/python3 -B "$script" --execute --workspace "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/issue779-csharp-n09-build" \
            --output "$RUNNER_TEMP/issue779-csharp-n09-run" \
            --reviewed-script-sha256 "$ORCHESTRATOR_SHA256"
          code=$?
          set -e
          /usr/bin/python3 -B - "$code" <<'PY'
          import json, os, pathlib, sys, time
          code = int(sys.argv[1])
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue779-csharp-n09-run'
          deadline = int(os.environ['JOB_DEADLINE_MONOTONIC_NS'])
          if time.monotonic_ns() >= deadline or not folder.is_dir() or folder.is_symlink():
              sys.exit(1)
          target = folder / 'outer-terminal.json'
          with target.open('x') as output:
              os.fchmod(output.fileno(), 0o600)
              json.dump({'schema': 'issue779-csharp-native-outer-terminal-v1', 'exit': code}, output)
              output.flush()
              os.fsync(output.fileno())
          if time.monotonic_ns() >= deadline:
              sys.exit(1)
          if code != 0 or (folder / 'native-late-failure.json').exists():
              sys.exit(1)
          receipt = json.loads((folder / 'native-receipt.json').read_bytes())
          if type(receipt.get('exit')) is not int or receipt['exit'] != 0 or receipt.get('native_case_receipt_verified') is not True:
              sys.exit(1)
          PY
          test "$code" -eq 0
      - name: Retain bounded build and private native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue779-csharp-n09-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/issue779-csharp-n09-build/receipts/
            ${{ runner.temp }}/issue779-csharp-n09-build/handoff/
            ${{ runner.temp }}/issue779-csharp-n09-run/
            ${{ runner.temp }}/issue779-csharp-ubuntu-runtime/
