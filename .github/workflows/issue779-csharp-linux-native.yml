name: C# Linux native N11 original worker stall
on:
  push:
    branches: [codex/issue779-csharp-linux-native-20261010-n11-worker-stall-v1]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Promotion requires frozen source reviews and a complete native handoff.
      # Promote only after full source composition review; no native passing claim.
      UBUNTU_RUNTIME_REVIEWED: 'true'
      UBUNTU_RUNTIME_SCRIPT_SHA256: 3899617c0062ce8d3341ed1c4a02f36be7d9d88fcf55271dbe4e8f7a50f3ba33
      N03_INDEPENDENT_REVIEW_CLEAR: 'true'
      N03_SOURCE_REBIND_PENDING: 'false'
      BUILD_REVIEWED: 'true'
      BUILD_SCRIPT_SHA256: 19cb21b4b51746650c0435dc050f2a0af799092f7763aa3b26a6cb4d2a6e0fee
      ROOT_TRANSPORT_REVIEWED: 'true'
      ROOT_TRANSPORT_SHA256: 77d4e661e20a1bdf4afa2a7db93e2efd3279fe691ae5b6492e662ca426e42672
      FIXTURE_REVIEWED: 'true'
      FIXTURE_SHA256: 015214c1e7de494d6a519031dadca4a3722666b940f6a84a4fc8c4596aacb5bd
      OS_AUDIT_REVIEWED: 'true'
