name: C# Linux native N04 peer identity replacement
on:
  push:
    branches: [codex/issue779-csharp-linux-native-20261009-n04-identity-substage-v1]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Promotion requires frozen source reviews and a complete native handoff.
      # Promote only after full source composition review; no native passing claim.
      UBUNTU_RUNTIME_REVIEWED: 'true'
      UBUNTU_RUNTIME_SCRIPT_SHA256: 515f0b58244902cd55a966d32b017f897436130ea8b6f71ac284b581e96cd69a
      N03_INDEPENDENT_REVIEW_CLEAR: 'true'
      N03_SOURCE_REBIND_PENDING: 'false'
      BUILD_REVIEWED: 'true'
      BUILD_SCRIPT_SHA256: 4e688f27ec849bb2ba3eb2554e193b1a99cdd818ea1d23870ae2d34b92a1c96e
      ROOT_TRANSPORT_REVIEWED: 'true'
      ROOT_TRANSPORT_SHA256: 72fb4ae698cdbb03715e9a91acc63febf733c9a9d519dfc3b77fd413739ea07b
      FIXTURE_REVIEWED: 'true'
      FIXTURE_SHA256: 2593a8b1a6a3c6ecb3ce1b1ce6786ffc28ba5c08e547480ddd18847ad994e1ba
      OS_AUDIT_REVIEWED: 'true'
