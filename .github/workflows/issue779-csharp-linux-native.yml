      SOURCE_REVIEW_SHA256: 2e81c0ffb3183bc699d82671679ab46154985f4ba2f56180dd73ad4db5d4ae98
      NATIVE_HANDOFF_REVIEWED: 'true'
      NATIVE_HANDOFF_IMPLEMENTED: 'true'
      ACQUISITION_SHA256: 9cd23af9f4a9ab844299221c64b2b968505f477e64ceaae268d7e7f7f047bcdb
      RETENTION_SHA256: 096b1f8672839560ded52dd18b0faa19123164b854c55aacec43352618ba6346
      ORCHESTRATOR_SHA256: 09f9eee5b04158ea28a62752c578463f61d91e508bda86ba7e12fdcfaa419f27
      CAPTURE_RECEIPT_SHA256: 8bc8f5a31f3952f0858212a5203572b377f58264dbd0c3d1b066739b05bb791b
      BATCH_PARSER_TEST_SHA256: 94cb67b53e57cb2fdd2c655254665d27cbb6b8c353ab88f1000ed4df447257d4
      N04_HELPER_PROJECT_SHA256: 6df583dc8191ea8aa588e62d50280ec8a7e788b63a3570ccec7a26d0fbd51a87
      N04_HELPER_STOP_SHA256: 0ed05a67f555c2b75c436ecb77e2b8f26d7aa66ab8cb3bafb5e92bb85c4df9d6
      N04_HELPER_PROGRAM_SHA256: 7b1505668078bb90668e9ccf6fe79bc1db2631b0b18cd591f499548ab0dcf34d
      N04_HELPER_LOCK_SHA256: a29c6aa8cfb81874ff8bb78dc369d7416f28c9b8cc47e99592bfc019b20c41eb
      N04_HELPER_RECIPE_SHA256: '3d47fb3b1f768ad5c56e1694a3a3a280382d9cd3406bec4df807ac9f00d66547'
      N03_HELPER_RECIPE_SHA256: 7bc0906967cfba542b3919e12855fb5f0e8946d0fe062a5d8371d4a5142101f4
      N03_HELPER_PROGRAM_SHA256: 02a28424a2d57c56213fae8618d50df1019986cadf89246e2ce11411a23c967a
      N03_HELPER_PROJECT_SHA256: 92da6c96d4c88fae754ece54af775a00c1d713c7e44b9a76bda7cc768773514e
      N03_HELPER_LOCK_SHA256: a29c6aa8cfb81874ff8bb78dc369d7416f28c9b8cc47e99592bfc019b20c41eb
      N04_DATA_INPUT_0_SHA256: a10ede95152d200090af64aa43fc22a039ac2f2849c8231f960ff9f155aaec7a
      N04_DATA_INPUT_1_SHA256: eba48c40d6f35001ba30fa7cf733d87dea0a12e23e9c55f11675a6e514f88784
      N04_DATA_INPUT_2_SHA256: 4231cb778726fd3f475de42483f6f731b7a4486c5fd8b3a53e944d931cebc8a5
      N04_DATA_INPUT_3_SHA256: edd51c56e78395200c7a7f31ee9fd7f42a8d0d084e0c79f717716547b67a119f
      N04_DATA_INPUT_4_SHA256: 34322c7506d7f28b46c505e019830065eb9326adb30d425787c675a10c6b4bd2
