name: C# Linux native N07 output-parent substitution
on:
  push:
    branches: [codex/issue779-csharp-linux-native-20261010-n07-budget-order-v7]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Promotion requires frozen source reviews and a complete native handoff.
      # Promote only after full source composition review; no native passing claim.
      UBUNTU_RUNTIME_REVIEWED: 'true'
      UBUNTU_RUNTIME_SCRIPT_SHA256: d7f17faa578e7ac4cd2e0716ad46020fbc753413e984eaa0fcdc73ae1fe29d6c
      N03_INDEPENDENT_REVIEW_CLEAR: 'true'
      N03_SOURCE_REBIND_PENDING: 'false'
      N07_INTEGRATION_REVIEW_CLEAR: 'true'
      N07_SOURCE_REBIND_PENDING: 'false'
      N07_HELPER_QUALIFICATION_PROCEDURE_REVIEW_CLEAR: 'true'
      BUILD_REVIEWED: 'true'
      BUILD_SCRIPT_SHA256: 23912d240cc258fbea1e6941be9559bc3237dbb72a143d91913865d30586b798
      ROOT_TRANSPORT_REVIEWED: 'true'
      ROOT_TRANSPORT_SHA256: 77f42ebd63d3e693d5c49e21ef0503746eefe9fb74bf7dc5c86c1a827aa55b43
