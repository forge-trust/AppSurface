name: Issue 779 C# common source image builds
on:
  push:
    branches: [codex/issue779-integrated16-image-builds-v4-20261014]
permissions:
  contents: read
concurrency:
  group: issue779-integrated16-image-builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        selector: ['None', N04, N05, N06, N07, N08, N09, N10, N11, N12, N13, N14, N15, N16]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Bind original job interval and pristine source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY' >> "$GITHUB_ENV"
          import os,time
          print('JOB_DEADLINE_MONOTONIC_NS='+str(time.monotonic_ns()+1800*1_000_000_000))
          print('IMAGE_JOB_ROOT='+os.environ['RUNNER_TEMP']+'/issue779-integrated-image')
          PY
          mkdir -m 0700 "$RUNNER_TEMP/issue779-integrated-image"
          # Git checkout must retain the captured 0644/0755 file modes.
          # The enclosing job directory remains private (0700).
          umask 022
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/issue779-integrated-image/source"
          git -C "$RUNNER_TEMP/issue779-integrated-image/source" checkout --detach 957da1f23ff743778fa39e3e559511ccdb281345
          umask 077
      - name: Install pinned Ubuntu runtime prerequisite
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TEMP="$IMAGE_JOB_ROOT"
          python3 -B "$GITHUB_WORKSPACE/.github/issue779-integrated16/build/imports/prepare-ubuntu-runtime.py" \
            --execute \
            --reviewed-script-sha256 2962b893b617ff6d2e3e6846df4ea8b170da74ad9b3cd4848b4a0405c4b6daff \
            --runner-sha256 ad1ffed5685c4a9af8de2d9923cad6d4b3476bf7fed5d82607b05460276fdac2
      - name: Measure current Linux child ownership prerequisite
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /private ]]; then sudo -n /usr/bin/install -d -o root -g root -m 0755 /private; fi
          [[ -d /private && ! -L /private && $(stat -c '%u:%g' /private) == 0:0 ]]
          if [[ ! -e /private/tmp ]]; then sudo -n /usr/bin/install -d -o root -g root -m 1777 /private/tmp; fi
          [[ -d /private/tmp && ! -L /private/tmp && $(stat -c '%u:%g:%a' /private/tmp) == 0:0:1777 ]]
          umask 077
          mkdir -m 0700 "$IMAGE_JOB_ROOT/process-preflight"
          root="$GITHUB_WORKSPACE/.github/issue779-integrated16/build"
          export root
          python3 -B - <<'PY_PREFLIGHT_PIN'
          import hashlib,os,stat
          from pathlib import Path
          p=Path(os.environ['root'])/'run_linux_real_child_preflight.py'
          s=p.lstat()
          assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and stat.S_IMODE(s.st_mode)==0o644
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8eb6e1b9bb03959e339333e4dc099826f8d143344e9466a0da9ae701ec2b4b02'
          PY_PREFLIGHT_PIN
          python3 -B "$root/run_linux_real_child_preflight.py"             --builder-dir "$root"             --receipt "$IMAGE_JOB_ROOT/process-preflight/real-child-preflight.json"             --log "$IMAGE_JOB_ROOT/process-preflight/real-child-preflight.log"
          python3 -B - <<'PY_PREFLIGHT_VALIDATE'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          root=Path(os.environ['root'])
          p=root/'run_image.py'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d725b919301f1995b91e05651d88e2e0aecca6aab0c7d6fb7a3bfeb958666a2d'
          sys.path.insert(0,str(root))
          import run_image
          directory=Path(os.environ['IMAGE_JOB_ROOT'])/'process-preflight'
          receipt=directory/'real-child-preflight.json'
          log=directory/'real-child-preflight.log'
          digest=hashlib.sha256(receipt.read_bytes()).hexdigest()
          raw,mode=run_image.pinned_read(receipt,digest)
          assert mode==0o600
          actual=json.loads(raw,object_pairs_hook=run_image.unique)
          run_image.validate_preflight(actual,run_image.BUILD_SHA)
          log_raw,log_mode=run_image.pinned_read(log,actual['log']['sha256'],1048576)
          assert log_mode==0o600 and len(log_raw)==actual['log']['bytes']
          assert actual['log']['path']==str(log)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('VERIFIED_PREFLIGHT_SHA256='+digest+'\n')
          PY_PREFLIGHT_VALIDATE
      - name: Build one selected common source image and genuine regression results
        shell: bash
        env:
          IMAGE_SELECTOR: ${{ matrix.selector }}
          EXECUTION_REVIEW_SHA256: 7121d87f2840dd3fdf59653a4d2dfc88ed605991c31a18f0e168fa1529eeba6e
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.github/issue779-integrated16/build"
          python3 -B "$root/run_image.py" \
            --selector "$IMAGE_SELECTOR" \
            --builder-dir "$root" \
            --harness-root "$GITHUB_WORKSPACE" \
            --source-root "$IMAGE_JOB_ROOT/source" \
            --capture "$GITHUB_WORKSPACE/.github/issue779-csharp-build/capture-receipt.json" \
            --output-root "$IMAGE_JOB_ROOT/orchestration" \
            --review "$root/execution-review.json" --review-sha256 "$EXECUTION_REVIEW_SHA256" \
            --preflight "$IMAGE_JOB_ROOT/process-preflight/real-child-preflight.json" --preflight-sha256 "$VERIFIED_PREFLIGHT_SHA256" \
            --execute
      - name: Retain bounded build evidence and audited image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-integrated-image-${{ matrix.selector }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IMAGE_JOB_ROOT }}/process-preflight/
            ${{ env.IMAGE_JOB_ROOT }}/orchestration/
            ${{ env.IMAGE_JOB_ROOT }}/image/receipts/
            ${{ env.IMAGE_JOB_ROOT }}/image/handoff/
            ${{ env.IMAGE_JOB_ROOT }}/image/published/
            ${{ env.IMAGE_JOB_ROOT }}/image/runtime/
            ${{ env.IMAGE_JOB_ROOT }}/image/source/
            ${{ env.IMAGE_JOB_ROOT }}/issue779-csharp-ubuntu-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
