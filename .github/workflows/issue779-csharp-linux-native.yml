      SOURCE_REVIEW_SHA256: 5986ccbbbb0766f3c050e781bef8755ef1828994bf150d6359ff8465779192ff
      NATIVE_HANDOFF_REVIEWED: 'true'
      NATIVE_HANDOFF_IMPLEMENTED: 'true'
      ACQUISITION_SHA256: 11a84d2fd4f940189b66e5ecaed18887f0378c8eb9c812f56dff87b41eefebb7
      RETENTION_SHA256: 08f8d9d896b497abcc03e21cebba19de09a6a267cb4650cdba8b351c986670c0
      ORCHESTRATOR_SHA256: 32ea62700da9d2d0dd45e1872f3bb804dc5234e7c61f7e468db39265042d4ffb
      CAPTURE_RECEIPT_SHA256: 9dcc944daa1f3fe09b07c149aeb57ec44408919b7ef441874f1e0ed698fc3001
      BATCH_PARSER_TEST_SHA256: 94cb67b53e57cb2fdd2c655254665d27cbb6b8c353ab88f1000ed4df447257d4
      N03_HELPER_RECIPE_SHA256: 7bc0906967cfba542b3919e12855fb5f0e8946d0fe062a5d8371d4a5142101f4
      N03_HELPER_PROGRAM_SHA256: 02a28424a2d57c56213fae8618d50df1019986cadf89246e2ce11411a23c967a
      N03_HELPER_PROJECT_SHA256: 92da6c96d4c88fae754ece54af775a00c1d713c7e44b9a76bda7cc768773514e
      N03_HELPER_LOCK_SHA256: a29c6aa8cfb81874ff8bb78dc369d7416f28c9b8cc47e99592bfc019b20c41eb
      SOURCE_COMMIT: 96c45807e1ab3f4b74bbe6dc487560f2fee6cdfa
      SOURCE_PARENT: e2a09e154aeec502dc618dbfa0d9eaa11614fea4
      HARNESS_PARENT: 96c45807e1ab3f4b74bbe6dc487560f2fee6cdfa
      SHARED_KERNEL_CHECK_SHA256: 90da0002db90ddb8b769bd3530551f10363ce772bc99327bdd27976be71cf3ab
      SHARED_RECORD_CHECK_SHA256: c45238cc3bd129a19af3d04dfa12bc83a82345b130e43f7296808ecee7e5cee6
      SHARED_ARCHIVE_ADAPTER_SHA256: e9b8a2cfe0053f93df03006c727cc1c005be32b64897ea13340fb057e294ec70
      SHARED_CAPTURE_ADAPTER_SHA256: fc9e57334ff18d854d8819524d2ceef9e5d5e04e464234285c978a0329d9b9cf
      SHARED_ARCHIVE_CHECK_SHA256: 53dd388058231fbc995328ac8ca47cf7b7e5e971f28ceba9f638ac5a429b6145
      N11_ROOT_FRAME_SHA256: f4bf675d4c52e6e126a872230ff91b9cb5526244f2ae34dbad474e074c642208
      N11_RECORD_CHECKER_SHA256: eb938170bd0716c84acbaadd90db971806aa789ffc09502cf98aed85934ff947
      N11_STALL_CAPTURE_SHA256: d77dabf16e317e7790bfcc1d458f3d61342655465e4fa1c3e3a2e4ba35992035
      N11_CAPTURE_ENTRY_SHA256: 3e2d2d9015d44ce671682aacc57d7286fd78c1a0103cb74eca40fb165a8037d0
