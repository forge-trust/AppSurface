name: Issue 779 native validation snapshot

on:
  push:
    branches: [codex/issue779-native-validation-20261002]

permissions:
  contents: read

jobs:
  native-gate:
    name: Current source, unchanged solution and patch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Setup pnpm 11.1.3
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare exact frozen source outside the harness checkout
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/issue779-native-validation"
          mkdir -p "$task_root"
          cp .github/issue779-native-validation/* "$task_root/"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$task_root/repo"
          git -C "$task_root/repo" checkout --quiet --detach 11a3602ab84a3cedf37b232afa0406d8f5b94f0b
          git -C "$task_root/repo" remote set-url origin https://github.com/forge-trust/AppSurface.git
          git -C "$task_root/repo" update-ref refs/remotes/origin/main 416b30919e6c4d03b634d9d3fe558884b02f0b91
          python3 "$task_root/verify-snapshot.py"
      - name: Run actual native Linux checks and unchanged coverage gate
        shell: bash
        run: bash "$RUNNER_TEMP/issue779-native-validation/run-native-validation.sh"
      - name: Retain terminal output and partial or complete coverage receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue779-native-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue779-native-validation/receipts/
          if-no-files-found: warn
          retention-days: 7
