  build:
    needs: [worker-controls, evidence-native-measurement, account-creation, account-rollback, packaged-producer, worker-measurement-none, worker-measurement-n04, worker-measurement-n05, worker-measurement-n06, worker-measurement-n07, worker-measurement-n08, worker-measurement-n09, worker-measurement-n10, worker-measurement-n11, worker-measurement-n12, worker-measurement-n13, worker-measurement-n14, worker-measurement-n15, worker-measurement-n16, coverage-security-platform, durable-postgresql-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
