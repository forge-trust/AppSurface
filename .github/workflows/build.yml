name: build.yml

permissions:
  contents: read

env:
  COVERAGE_SDK_VERSION: 10.0.402
  COVERAGE_CLI_CANDIDATE_VERSION: 0.1.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
  COVERAGE_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.gitattributes'
      - '**/*.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config-package-contract:
    name: Config package contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: 10.0.402
      - name: Run source provider proof
        run: dotnet run --project examples/config-key-contract --configuration Release
      - name: Run framework-neutral conformance package tests
        run: dotnet test Config/ForgeTrust.AppSurface.Config.Testing.Tests --configuration Release
      - name: Test packed consumer work-directory guards
        run: python -m unittest discover -s tests/config-package-consumer -p "test_*.py"
      - name: Verify packed Domain, Web, and staged worker contract
        run: python scripts/verify_config_package_consumer.py --work-directory "${{ runner.temp }}/config-package-contract"
      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-package-contract-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/config-package-contract/evidence.json
            ${{ runner.temp }}/config-package-contract/pinned-inventory.md
            ${{ runner.temp }}/config-package-contract/*.log
          if-no-files-found: warn

  coverage-evidence-plan:
    name: Plan solution coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      requires_coverage: ${{ steps.plan.outputs.requires_coverage }}
      requires_native_coverage: ${{ steps.plan.outputs.requires_native_coverage }}
      diff_base: ${{ steps.plan.outputs.diff_base }}
      v3_shadow_diff_base: ${{ steps.plan.outputs.v3_shadow_diff_base }}
    steps:
      - name: Checkout exact event head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: ${{ env.COVERAGE_SDK_VERSION }}
      - name: Select exact coverage SDK
        shell: pwsh
        run: |
          $selection = @{ sdk = @{ version = "${{ env.COVERAGE_SDK_VERSION }}"; rollForward = 'disable' } }
          $selection | ConvertTo-Json | Set-Content -Path (Join-Path (Split-Path -Parent $PWD.Path) 'global.json')
          if ((dotnet --version) -ne "${{ env.COVERAGE_SDK_VERSION }}") { throw 'Coverage planning SDK selection failed' }
      - name: Build validation tool
        run: |
          dotnet restore tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --locked-mode
          dotnet build tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --configuration Release --no-restore
      - name: Collect and plan solution coverage
        id: plan
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "coverage-plan-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $validation = Join-Path $env:GITHUB_WORKSPACE 'tools/ForgeTrust.AppSurface.Evidence.Validation/bin/Release/net10.0/ForgeTrust.AppSurface.Evidence.Validation.dll'
          $changes = Join-Path $root 'changes'
          $plan = Join-Path $root 'plan'
          dotnet $validation --operation collect --repository $env:GITHUB_WORKSPACE --event-file $env:GITHUB_EVENT_PATH --event-name $env:GITHUB_EVENT_NAME --workflow-sha $env:GITHUB_SHA --output $changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet $validation --operation plan --scope coverage --policy .github/evidence.policy.json --changed-paths (Join-Path $changes 'changed-paths.json') --output $plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-Content -Raw (Join-Path $changes 'source-state.json') | ConvertFrom-Json
          $selection = Get-Content -Raw (Join-Path $plan 'selection.json') | ConvertFrom-Json
          $required = if ([bool]$selection.requiresCoverage) { 'true' } else { 'false' }
          "requires_coverage=$required" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          $nativeRequired = if ([bool]$selection.requiresNativeCoverage) { 'true' } else { 'false' }
          "requires_native_coverage=$nativeRequired" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          $diffBase = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $source.baseCommit } else { '' }
          "diff_base=$diffBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          $v3ShadowDiffBase = ''
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $v3ShadowDiffBase = [string]$env:GITHUB_PULL_REQUEST_BASE_SHA
            if ($v3ShadowDiffBase -notmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') {
              throw 'The v3 shadow requires the full immutable pull-request base commit ID.'
            }
          }
          "v3_shadow_diff_base=$v3ShadowDiffBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
      - name: Preserve coverage selection plan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-plan-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

  coverage-cli-candidate:
    name: Pack coverage CLI candidate
    needs: [coverage-evidence-plan]
    if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: ${{ env.COVERAGE_SDK_VERSION }}
          cache: true
          cache-dependency-path: Cli/ForgeTrust.AppSurface.Cli/packages.lock.json

      - name: Select exact coverage SDK
        shell: pwsh
        run: |
          $selection = @{ sdk = @{ version = "${{ env.COVERAGE_SDK_VERSION }}"; rollForward = "disable" } }
          $selection | ConvertTo-Json | Set-Content -Path (Join-Path (Split-Path -Parent $PWD.Path) "global.json")
          if ((dotnet --version) -ne "${{ env.COVERAGE_SDK_VERSION }}") { throw "Coverage SDK selection failed" }

      - name: Restore candidate CLI (locked)
        run: dotnet restore Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --locked-mode

      - name: Pack source and SDK bound candidate CLI
        run: |
          set -euo pipefail
          candidate_feed="$RUNNER_TEMP/coverage-candidate-feed"
          mkdir -p "$candidate_feed"
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          sdk="$(dotnet --version)"
          test "$source_commit" = "$COVERAGE_SOURCE_COMMIT"
          dotnet pack Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj \
            --configuration Release --no-restore --output "$candidate_feed" \
            -p:Version="$COVERAGE_CLI_CANDIDATE_VERSION" \
            -p:PackageVersion="$COVERAGE_CLI_CANDIDATE_VERSION" \
            -p:RepositoryCommit="$source_commit" -p:SourceRevisionId="$source_commit"
          package="$candidate_feed/ForgeTrust.AppSurface.Cli.$COVERAGE_CLI_CANDIDATE_VERSION.nupkg"
          test -f "$package"
          package_sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          jq -n --arg commit "$source_commit" --arg tree "$source_tree" --arg sdk "$sdk" \
            --arg version "$COVERAGE_CLI_CANDIDATE_VERSION" --arg sha256 "$package_sha256" \
            '{schemaVersion:1,commit:$commit,tree:$tree,sdk:$sdk,version:$version,packageSha256:$sha256}' \
            > "$candidate_feed/candidate.json"

      - name: Upload same-run candidate CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cli-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-candidate-feed
          if-no-files-found: error
          retention-days: 1

  coverage-security-platform:
    name: Coverage security contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [coverage-evidence-plan, coverage-cli-candidate]
    if: ${{ needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' }}
    # Leave time for the native suite, candidate installation, and evidence upload.
    # The test command still uses a separate two-minute hang detector.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || matrix.os == 'macos-latest' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      BUILD_CONFIGURATION: Release
      COVERAGE_GATE_DIFF_BASE: ${{ needs.coverage-evidence-plan.outputs.diff_base }}
      COVERAGE_V3_SHADOW_DIFF_BASE: ${{ needs.coverage-evidence-plan.outputs.v3_shadow_diff_base }}
      COVERAGE_V3_SHADOW_CONTRACT_VERSION: '3'
      COVERAGE_V3_SHADOW_REPORT_PROFILE_ID: coverlet-collector-cobertura-v1
      COVERAGE_RUN_SCOPE: ${{ github.repository }}
      COVERAGE_RUN_ID: ${{ github.run_id }}
      COVERAGE_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: ${{ env.COVERAGE_SDK_VERSION }}
          cache: true
          cache-dependency-path: |
            Aspire/ForgeTrust.AppSurface.Aspire.Tests/packages.lock.json
            Cli/ForgeTrust.AppSurface.Cli.Tests/packages.lock.json

      - name: Select exact coverage SDK
        shell: pwsh
        run: |
          $selection = @{ sdk = @{ version = "${{ env.COVERAGE_SDK_VERSION }}"; rollForward = "disable" } }
          $selection | ConvertTo-Json | Set-Content -Path (Join-Path (Split-Path -Parent $PWD.Path) "global.json")
          if ((dotnet --version) -ne "${{ env.COVERAGE_SDK_VERSION }}") { throw "Coverage SDK selection failed" }

      - name: Restore coverage security tests (locked)
        shell: pwsh
        run: |
          dotnet restore Aspire/ForgeTrust.AppSurface.Aspire.Tests/ForgeTrust.AppSurface.Aspire.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore dogfood adapter (locked)
        run: dotnet restore tools/ForgeTrust.AppSurface.Coverage.Dogfood/ForgeTrust.AppSurface.Coverage.Dogfood.csproj --locked-mode

      - name: Download same-source CLI candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-cli-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-candidate-feed

      - name: Verify and install candidate CLI
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP "coverage-candidate-feed"
          $manifest = Get-Content -Raw -Path (Join-Path $feed "candidate.json") | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $sdk = (dotnet --version).Trim()
          $package = Join-Path $feed "ForgeTrust.AppSurface.Cli.${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}.nupkg"
          if ($manifest.commit -ne $env:COVERAGE_SOURCE_COMMIT -or $manifest.commit -ne $commit -or $manifest.tree -ne $tree -or
              $manifest.sdk -ne $sdk -or $manifest.sdk -ne "${{ env.COVERAGE_SDK_VERSION }}" -or
              $manifest.version -ne "${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}" -or !(Test-Path $package)) {
            throw "Candidate CLI package source, SDK, or pinned version does not match this lane."
          }
          if ((Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant() -ne $manifest.packageSha256) {
            throw "Candidate CLI package hash does not match its same-run manifest."
          }
          $toolRoot = Join-Path $env:RUNNER_TEMP "coverage-cli"
          $toolConfig = Join-Path $feed "candidate.nuget.config"
          $escapedFeed = [System.Security.SecurityElement]::Escape($feed)
          @"
          <configuration>
            <packageSources><clear /><add key="candidate" value="$escapedFeed" /></packageSources>
            <fallbackPackageFolders><clear /></fallbackPackageFolders>
          </configuration>
          "@ | Set-Content -LiteralPath $toolConfig
          dotnet tool install ForgeTrust.AppSurface.Cli --tool-path $toolRoot `
            --version "${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}" --configfile $toolConfig
          if ($LASTEXITCODE -ne 0) { throw "Candidate CLI installation failed." }
          $installedArchives = @(Get-ChildItem -LiteralPath (Join-Path $toolRoot ".store") -Recurse -File |
            Where-Object { $_.Name -ieq (Split-Path -Leaf $package) })
          if ($installedArchives.Count -ne 1 -or
              (Get-FileHash -LiteralPath $installedArchives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.packageSha256) {
            throw "Installed CLI archive does not match the same-run candidate."
          }
          $command = Join-Path $toolRoot $(if ($IsWindows) { "appsurface.exe" } else { "appsurface" })
          if (!(Test-Path $command)) { throw "Installed appsurface command was not found." }
          Add-Content -Path $env:GITHUB_ENV -Value "COVERAGE_CLI_PATH=$command"

      - name: Prepare generated docs stylesheet for coverage security tests
        shell: pwsh
        run: |
          $docsStylesheet = "Web/ForgeTrust.AppSurface.Docs/wwwroot/css/site.gen.css"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $docsStylesheet)
          Set-Content -NoNewline -Path $docsStylesheet -Value ""

      - name: Run coverage security contracts
        shell: pwsh
        run: |
          $filter = "FullyQualifiedName~CoverageRunArtifactReaderTests|FullyQualifiedName~CoverageRunOutputGuardSecurityTests|FullyQualifiedName~CoverageGateTests|FullyQualifiedName~CoverageArtifact|FullyQualifiedName~CoverageStorageCommand|FullyQualifiedName~CoverageRunProcessContractTests|FullyQualifiedName~CoverageRunCollectorVersionPreflightTests|FullyQualifiedName~CoverageFanIn|FullyQualifiedName~ForgeTrust.AppSurface.Cli.Tests.Evidence|FullyQualifiedName~ForgeTrust.AppSurface.Cli.Tests.CoverageEvidence|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.EvidenceHost|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.EvidencePrepared|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.EvidenceProducerKeyMaterialExecution|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.EvidenceKeyMaterialFailure|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.EvidenceReusePackageProofTests|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.EvidencePackedReuseJourneyTests|FullyQualifiedName~ForgeTrust.AppSurface.Aspire.Tests.NativeEvidenceProgramTests"
          $arguments = @('coverage', 'run',
            '--test-project', 'Aspire/ForgeTrust.AppSurface.Aspire.Tests/ForgeTrust.AppSurface.Aspire.Tests.csproj',
            '--test-project', 'Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj',
            '--configuration', 'Release', '--no-restore',
            '--output', "${{ runner.temp }}/coverage-native-results", '--test-results', 'junit', '--artifact-retention', 'full',
            '--logger', 'console;verbosity=detailed', '--test-argument', '/p:TailwindEnabled=false',
            '--test-argument', '--filter', '--test-argument', $filter,
            '--test-argument', '--blame-hang', '--test-argument', '--blame-hang-timeout', '--test-argument', '2m',
            '--test-argument', '--blame-hang-dump-type', '--test-argument', 'mini')
          & $env:COVERAGE_CLI_PATH @arguments
          if ($LASTEXITCODE -ne 0) { throw "Native coverage collection failed" }

      - name: Attest successful native coverage evidence
        id: capture-native-coverage
        shell: pwsh
        env:
          COVERAGE_DOGFOOD_OUTPUT: ${{ runner.temp }}/coverage-dogfood-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $collection = "${{ runner.temp }}/coverage-native-results"
          $timingsPath = Join-Path $collection 'timings.json'
          $timings = Get-Content -Raw -LiteralPath $timingsPath | ConvertFrom-Json
          $reports = @{}
          foreach ($entry in $timings.projects) {
            if (!$entry.coverageFile -or $reports.ContainsKey($entry.project)) { throw "Native coverage report index is invalid" }
            # coverage run stages an exact copy of the original collector bytes at coverageFile.
            $reports[$entry.project] = Join-Path $collection $entry.coverageFile
          }
          if ($reports.Count -ne 2) { throw "Expected both native test project reports" }
          $indexPath = Join-Path $env:RUNNER_TEMP 'coverage-native-report-index.json'
          $reports | ConvertTo-Json | Set-Content -LiteralPath $indexPath
          $platform = if ($IsWindows) { "Windows" } elseif ($IsMacOS) { "Darwin" } else { "Linux" }
          $adapter = @('--operation', 'native', '--repository', $PWD.Path, '--cli', $env:COVERAGE_CLI_PATH,
            '--output', $env:COVERAGE_DOGFOOD_OUTPUT, '--configuration', 'Release', '--native-platform', $platform,
            '--raw-index', $indexPath, '--timings', $timingsPath,
            '--run-scope', $env:COVERAGE_RUN_SCOPE, '--run-id', $env:COVERAGE_RUN_ID, '--attempt', $env:COVERAGE_RUN_ATTEMPT)
          if ($env:COVERAGE_GATE_DIFF_BASE) { $adapter += @('--diff-base', $env:COVERAGE_GATE_DIFF_BASE) }
          dotnet run --project tools/ForgeTrust.AppSurface.Coverage.Dogfood/ForgeTrust.AppSurface.Coverage.Dogfood.csproj --configuration Release --no-restore -- @adapter
          if ($LASTEXITCODE -ne 0) { throw "Native coverage capture failed" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "capture-path=$(Join-Path $env:COVERAGE_DOGFOOD_OUTPUT 'capture')"

      - name: Upload attested native coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-native-${{ matrix.os }}
          path: ${{ steps.capture-native-coverage.outputs.capture-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Capture fresh v3 shadow native evidence
        id: capture-v3-shadow-native
        if: ${{ github.event_name == 'pull_request' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' }}
        shell: pwsh
        env:
          COVERAGE_V3_SHADOW_OUTPUT: ${{ runner.temp }}/coverage-fanin-v3-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          COVERAGE_V3_SHADOW_NORMALIZED: ${{ runner.temp }}/coverage-fanin-v3-normalized-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COVERAGE_V3_SHADOW_DIFF_BASE)) { throw "The v3 shadow has no pinned diff base." }
          if (Test-Path -LiteralPath $env:COVERAGE_V3_SHADOW_OUTPUT) { throw "The v3 shadow output path is not fresh." }
          if (Test-Path -LiteralPath $env:COVERAGE_V3_SHADOW_NORMALIZED) { throw "The v3 shadow normalization path is not fresh." }
          $collection = "${{ runner.temp }}/coverage-native-results"
          $timingsPath = Join-Path $collection 'timings.json'
          $timings = Get-Content -Raw -LiteralPath $timingsPath | ConvertFrom-Json
          $reports = @{}
          foreach ($entry in $timings.projects) {
            if (!$entry.coverageFile -or $reports.ContainsKey($entry.project)) { throw "Native v3 shadow report index is invalid." }
            $reports[$entry.project] = Join-Path $collection $entry.coverageFile
          }
          if ($reports.Count -ne 2) { throw "Expected both native test project reports for the v3 shadow." }
          $indexPath = Join-Path $env:RUNNER_TEMP 'coverage-native-v3-report-index.json'
          $reports | ConvertTo-Json | Set-Content -LiteralPath $indexPath
          $platform = if ($IsWindows) { "Windows" } elseif ($IsMacOS) { "Darwin" } else { "Linux" }
          $adapter = @('--operation', 'native', '--contract-version', $env:COVERAGE_V3_SHADOW_CONTRACT_VERSION,
            '--repository', $PWD.Path, '--cli', $env:COVERAGE_CLI_PATH, '--output', $env:COVERAGE_V3_SHADOW_OUTPUT,
            '--configuration', 'Release', '--native-platform', $platform,
            '--raw-index', $indexPath, '--timings', $timingsPath,
            '--run-scope', $env:COVERAGE_RUN_SCOPE, '--run-id', $env:COVERAGE_RUN_ID, '--attempt', $env:COVERAGE_RUN_ATTEMPT,
            '--diff-base', $env:COVERAGE_V3_SHADOW_DIFF_BASE)
          dotnet run --project tools/ForgeTrust.AppSurface.Coverage.Dogfood/ForgeTrust.AppSurface.Coverage.Dogfood.csproj --configuration Release --no-restore -- @adapter
          if ($LASTEXITCODE -ne 0) { throw "Native v3 shadow capture failed." }
          $manifestPath = Join-Path $env:COVERAGE_V3_SHADOW_OUTPUT 'capture/manifest.json'
          if (!(Test-Path -LiteralPath $manifestPath)) { throw "Native v3 shadow capture manifest is missing." }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 3 -or $manifest.producerId -ne $platform.ToLowerInvariant() -or
              $manifest.policy.contractVersion -ne 3 -or $manifest.policy.reportProfileId -ne $env:COVERAGE_V3_SHADOW_REPORT_PROFILE_ID -or
              $manifest.policy.gate.diffBase -ne $env:COVERAGE_V3_SHADOW_DIFF_BASE -or
              $manifest.source.commit -ne $env:COVERAGE_SOURCE_COMMIT -or
              $manifest.run.runScope -ne $env:COVERAGE_RUN_SCOPE -or $manifest.run.runId -ne $env:COVERAGE_RUN_ID -or
              [string]$manifest.run.attempt -ne $env:COVERAGE_RUN_ATTEMPT) {
            throw "Native v3 shadow capture identity, profile, contract, or pinned base differs."
          }
          $proofPath = Join-Path $env:COVERAGE_V3_SHADOW_OUTPUT 'shadow-proof.json'
          if (!(Test-Path -LiteralPath $proofPath)) { throw "Native v3 shadow proof output is missing." }
          $proof = Get-Content -Raw -LiteralPath $proofPath | ConvertFrom-Json
          $expectedAccountingScope = 'UsedBytes is the existing logical operation budget for streams, distinct Git blob work, retained inputs, and staged publication; it does not measure XML DOM heap or peak staged storage.'
          if ($proof.schemaVersion -ne 1 -or $proof.contractVersion -ne 3 -or
              $proof.collector.packageId -ne 'coverlet.collector' -or $proof.collector.verifiedVersion -ne '10.0.1' -or
              $proof.reportProfileId -ne $env:COVERAGE_V3_SHADOW_REPORT_PROFILE_ID -or $proof.operation -ne 'native' -or
              $proof.run.scope -ne $env:COVERAGE_RUN_SCOPE -or $proof.run.id -ne $env:COVERAGE_RUN_ID -or
              [string]$proof.run.attempt -ne $env:COVERAGE_RUN_ATTEMPT -or
              $proof.source.commit -ne $manifest.source.commit -or $proof.source.tree -ne $manifest.source.tree -or
              $proof.diff.baseCommit -ne $env:COVERAGE_V3_SHADOW_DIFF_BASE -or $proof.completed -ne $true -or
              $proof.accounting.scope -ne $expectedAccountingScope -or
              $proof.accounting.logicalOperationBudgetWithinTotalBytes -ne $true -or
              $proof.accounting.maximumAdmittedXmlBytes -le 0 -or
              $proof.accounting.maximumAdmittedRecords -le 0 -or
              $proof.accounting.maximumStagedBytes -le 0 -or $proof.accounting.maximumStagedFiles -le 0 -or
              $proof.process.commandsWithinOperationDeadline -ne $true) {
            throw "Native v3 shadow proof identity or completion metadata differs."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "capture-path=$(Join-Path $env:COVERAGE_V3_SHADOW_OUTPUT 'capture')"

      - name: Upload isolated v3 shadow native evidence
        if: ${{ always() && github.event_name == 'pull_request' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fanin-v3-native-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-fanin-v3-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage security diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-security-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/coverage-native-results
          if-no-files-found: warn
          retention-days: 7

  keycloak-theme-evidence:
    name: Keycloak theme evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYCLOAK_THEME_BASE_IMAGE: quay.io/keycloak/keycloak:26.6@sha256:22c8cf9e79af88d320499c93994bb2c319ca255092d8ae7c7a45dd46d68192e2
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: |
            Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak/packages.lock.json
            Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests/packages.lock.json

      - name: Restore focused Keycloak proof (locked)
        run: dotnet restore Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests.csproj --locked-mode

      - name: Verify theme lifecycle contracts
        run: dotnet test Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests.csproj --configuration Release --no-restore

      - name: Prove the pinned sample theme image and disposable realm
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/keycloak-theme-evidence"
          context="$RUNNER_TEMP/keycloak-theme-context"
          source_directory="$context/themes/appsurface-sample"
          container_id=""
          status="fail"
          phase="setup"
          diagnostic="ASKEYC019"
          source_manifest_digest="unavailable"
          packaged_manifest_digest="unavailable"
          build_contract_digest="unavailable"
          candidate_image_manifest_digest="unavailable"
          image_id="unavailable"
          port=""
          builder_name="appsurface-keycloak-theme-evidence"
          builder_created=false

          write_artifacts() {
            mkdir -p "$artifact_directory"
            cat > "$artifact_directory/keycloak-theme-evidence.json" <<EOF
          {
            "schema": "appsurface-keycloak-theme-evidence-v1",
            "status": "$status",
            "phase": "$phase",
            "diagnostic": "$diagnostic",
            "themeName": "appsurface-sample",
            "platform": "linux/amd64",
            "keycloakBaseImage": "$KEYCLOAK_THEME_BASE_IMAGE",
            "sourceManifestDigest": "$source_manifest_digest",
            "packagedManifestDigest": "$packaged_manifest_digest",
            "buildContractDigest": "$build_contract_digest",
            "candidateImageManifestDigest": "$candidate_image_manifest_digest",
            "candidateImageId": "$image_id"
          }
          EOF
            {
              echo "## Keycloak theme evidence"
              echo
              echo "- Status: $status"
              echo "- Phase: $phase"
              echo "- Diagnostic: $diagnostic"
              echo "- Theme: appsurface-sample"
              echo "- Platform: linux/amd64"
              echo "- Base image: $KEYCLOAK_THEME_BASE_IMAGE"
              echo "- Source manifest SHA-256: $source_manifest_digest"
              echo "- Packaged manifest SHA-256: $packaged_manifest_digest"
              echo "- Build contract SHA-256: $build_contract_digest"
              echo "- Candidate image manifest digest: $candidate_image_manifest_digest"
              echo "- Candidate image ID: $image_id"
            } > "$artifact_directory/keycloak-theme-evidence.md"
            {
              echo "status=$status"
              echo "phase=$phase"
              echo "diagnostic=$diagnostic"
            } > "$artifact_directory/keycloak-theme-evidence.log"
          }

          cleanup() {
            exit_code=$?
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            if [ "$builder_created" = true ]; then
              docker buildx rm "$builder_name" >/dev/null 2>&1 || true
            fi
            write_artifacts
            exit "$exit_code"
          }

          fail() {
            diagnostic="$1"
            phase="$2"
            printf '%s: %s\n' "$diagnostic" "$3" >&2
            exit 1
          }

          trap cleanup EXIT
          mkdir -p "$artifact_directory" "$source_directory"
          docker version --format '{{.Server.Version}}' >/dev/null 2>&1 || {
            status="not-run"
            fail ASKEYC019 docker "Docker Engine is unavailable; not-run cannot satisfy the release gate."
          }
          docker buildx create --name "$builder_name" --driver docker-container --use >/dev/null \
            || fail ASKEYC018 setup-builder "The OCI-export Buildx builder could not be created."
          builder_created=true
          docker buildx inspect --bootstrap >/dev/null \
            || fail ASKEYC018 setup-builder "The OCI-export Buildx builder could not be started."

          mkdir -p "$context/themes/appsurface-sample"
          cp -R examples/auth-aspire-keycloak-apphost/themes/appsurface-sample/. "$source_directory/"
          manifest_lines="$context/manifest-lines"
          first_entry=true
          while IFS= read -r -d '' source_path; do
            relative_path="${source_path#./}"
            if [ "$first_entry" = true ]; then
              first_entry=false
            else
              printf '\n' >> "$manifest_lines"
            fi
            byte_count="$(wc -c < "$source_directory/$relative_path" | tr -d ' ' )"
            file_digest="$(sha256sum "$source_directory/$relative_path" | awk '{print $1}')"
            printf '%s\n%s\n%s' "$relative_path" "$byte_count" "$file_digest" >> "$manifest_lines"
          done < <(cd "$source_directory" && find . -type f -print0 | LC_ALL=C sort -z)
          source_manifest_digest="$(sha256sum "$manifest_lines" | awk '{print $1}')"
          packaged_manifest_digest="$source_manifest_digest"
          build_contract_digest="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            appsurface-keycloak-theme-build-contract-v1 \
            appsurface-sample \
            "$KEYCLOAK_THEME_BASE_IMAGE" \
            linux/amd64 \
            "$source_manifest_digest" \
            "$packaged_manifest_digest" \
            '' | sha256sum | awk '{print $1}')"
          cat > "$context/Containerfile" <<EOF
          FROM $KEYCLOAK_THEME_BASE_IMAGE
          COPY --chown=keycloak:keycloak themes/appsurface-sample/ /opt/keycloak/themes/appsurface-sample/
          LABEL org.appsurface.keycloak.theme.name="appsurface-sample"
          LABEL org.appsurface.keycloak.theme.source-manifest-digest="$source_manifest_digest"
          LABEL org.appsurface.keycloak.theme.manifest-digest="$packaged_manifest_digest"
          LABEL org.appsurface.keycloak.theme.build-contract-digest="$build_contract_digest"
          LABEL org.appsurface.keycloak.theme.base-image="$KEYCLOAK_THEME_BASE_IMAGE"
          LABEL org.appsurface.keycloak.theme.platform="linux/amd64"
          EOF
          phase="build-image"
          docker build --platform linux/amd64 --file "$context/Containerfile" --tag appsurface-keycloak-theme-evidence:ci "$context" || fail ASKEYC018 build-image "The pinned theme image could not be built."
          image_id="$(docker image inspect --format '{{.Id}}' appsurface-keycloak-theme-evidence:ci)"
          for label in \
            "org.appsurface.keycloak.theme.name=appsurface-sample" \
            "org.appsurface.keycloak.theme.source-manifest-digest=$source_manifest_digest" \
            "org.appsurface.keycloak.theme.manifest-digest=$packaged_manifest_digest" \
            "org.appsurface.keycloak.theme.build-contract-digest=$build_contract_digest" \
            "org.appsurface.keycloak.theme.base-image=$KEYCLOAK_THEME_BASE_IMAGE" \
            "org.appsurface.keycloak.theme.platform=linux/amd64"; do
            label_key="${label%%=*}"
            label_value="${label#*=}"
            actual_label="$(docker image inspect --format '{{index .Config.Labels "'"$label_key"'"}}' appsurface-keycloak-theme-evidence:ci)"
            [ "$actual_label" = "$label_value" ] || fail ASKEYC018 inspect-label "The built image label '$label_key' does not match evidence."
          done
          docker run --rm --entrypoint /bin/sh appsurface-keycloak-theme-evidence:ci -c 'test -f /opt/keycloak/themes/appsurface-sample/login/theme.properties && test -f /opt/keycloak/themes/appsurface-sample/login/resources/css/appsurface-sample.css' || fail ASKEYC018 inspect-subtree "The built image does not contain the expected theme subtree."
          docker run --rm --entrypoint /bin/sh appsurface-keycloak-theme-evidence:ci -c 'find /opt/keycloak -type f -name "*keycloak-themes*.jar" -print -quit | grep -q .' || fail ASKEYC015 inspect-archive "The pinned Keycloak image does not expose the supported theme archive layout."
          oci_layout="$context/appsurface-keycloak-theme.oci.tar"
          docker buildx build --platform linux/amd64 --file "$context/Containerfile" --output "type=oci,dest=$oci_layout" "$context" || fail ASKEYC018 export-image "The OCI candidate image could not be exported."
          candidate_image_manifest_digest="$(tar -xOf "$oci_layout" index.json | jq -er '.manifests | select(length == 1) | .[0].digest')" || fail ASKEYC018 inspect-image "The OCI candidate image manifest digest is unavailable."
          rm "$oci_layout"

          mkdir -p "$context/realm-import"
          cat > "$context/realm-import/appsurface-theme-evidence-realm.json" <<'EOF'
          {
            "realm": "appsurface-theme-evidence",
            "enabled": true,
            "loginTheme": "appsurface-sample",
            "clients": [
              {
                "clientId": "appsurface-theme-evidence",
                "enabled": true,
                "publicClient": true,
                "standardFlowEnabled": true,
                "redirectUris": ["http://localhost/*"]
              }
            ]
          }
          EOF
          bootstrap_password="$(openssl rand -hex 24)"
          phase="start-runtime"
          container_id="$(docker run --detach --platform linux/amd64 --publish 127.0.0.1::8080 --volume "$context/realm-import:/opt/keycloak/data/import:ro" --env KC_BOOTSTRAP_ADMIN_USERNAME=theme-evidence --env KC_BOOTSTRAP_ADMIN_PASSWORD="$bootstrap_password" appsurface-keycloak-theme-evidence:ci start-dev --import-realm)" || fail ASKEYC019 start-runtime "The Linux/amd64 disposable Keycloak runtime could not start."
          port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p' | head -n 1)"
          [ -n "$port" ] || fail ASKEYC019 start-runtime "The disposable Keycloak runtime did not publish its HTTP port."
          metadata_url="http://127.0.0.1:$port/realms/appsurface-theme-evidence/.well-known/openid-configuration"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 "$metadata_url" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ] || fail ASKEYC019 start-runtime "The disposable Keycloak runtime did not become ready within 60 attempts (up to 240 seconds)."
          phase="readback"
          access_token="$(curl --fail --silent --show-error --max-time 10 --request POST "http://127.0.0.1:$port/realms/master/protocol/openid-connect/token" --data-urlencode grant_type=password --data-urlencode client_id=admin-cli --data-urlencode username=theme-evidence --data-urlencode password="$bootstrap_password" | jq -er '.access_token')" || fail ASKEYC020 readback "A disposable administrator token could not be acquired for readback."
          curl --fail --silent --show-error --max-time 10 --header "Authorization: Bearer $access_token" "http://127.0.0.1:$port/admin/realms/appsurface-theme-evidence" | jq -e '.loginTheme == "appsurface-sample"' >/dev/null || fail ASKEYC020 readback "Disposable realm readback did not select appsurface-sample."
          phase="verify-resource"
          login_page="$(curl --fail --silent --show-error --max-time 10 --get "http://127.0.0.1:$port/realms/appsurface-theme-evidence/protocol/openid-connect/auth" --data-urlencode client_id=appsurface-theme-evidence --data-urlencode redirect_uri=http://localhost/callback --data-urlencode response_type=code --data-urlencode scope=openid)" || fail ASKEYC021 verify-resource "The disposable authorization challenge could not render the login page."
          resource_url="$(printf '%s' "$login_page" | sed -n 's/.*href="\([^\"]*appsurface-sample\.css[^\"]*\)".*/\1/p' | head -n 1)"
          same_origin="http://127.0.0.1:$port"
          case "$resource_url" in
            "$same_origin"/*) resource_path="${resource_url#"$same_origin"}" ;;
            /*) resource_path="$resource_url" ;;
            *) fail ASKEYC021 verify-resource "The declared stylesheet is missing or not same-origin." ;;
          esac
          resource_path="${resource_path%%\?*}"
          case "$resource_path" in
            *'//'*|*'..'*|*'%2f'*|*'%2F'*) fail ASKEYC021 verify-resource "The declared stylesheet path is unsafe." ;;
          esac
          case "$resource_path" in
            */login/appsurface-sample/*) ;;
            *) fail ASKEYC021 verify-resource "The declared stylesheet path is not an appsurface-sample theme resource." ;;
          esac
          actual_resource_digest="$(curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:$port$resource_path" | sha256sum | awk '{print $1}')" || fail ASKEYC021 verify-resource "The declared stylesheet could not be fetched."
          expected_resource_digest="$(sha256sum "$source_directory/login/resources/css/appsurface-sample.css" | awk '{print $1}')"
          [ "$actual_resource_digest" = "$expected_resource_digest" ] || fail ASKEYC021 verify-resource "The declared stylesheet digest does not match the packaged source."
          status="pass"
          phase="complete"
          diagnostic="pass"

      - name: Upload secret-safe Keycloak theme evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: keycloak-theme-evidence
          path: ${{ runner.temp }}/keycloak-theme-evidence
          if-no-files-found: warn

  durable-postgresql-compatibility:
    name: Durable PostgreSQL release compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: |
            Durable/ForgeTrust.AppSurface.Durable.PostgreSql.Tests/packages.lock.json
            Durable/compatibility/V2WorkHarness/packages.lock.json

      - name: Restore PostgreSQL compatibility tests
        run: dotnet restore Durable/ForgeTrust.AppSurface.Durable.PostgreSql.Tests/ForgeTrust.AppSurface.Durable.PostgreSql.Tests.csproj --locked-mode

      - name: Verify the current provider and exact immediately previous PostgreSQL package
        run: ./Durable/verify-postgresql.sh --ci

      - name: Run the one-command operational assessment proof
        run: ./examples/durable-postgresql/run-local-proof.sh

  packed-durable-consumers:
    name: Packed Durable consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: ${{ env.COVERAGE_SDK_VERSION }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Select exact coverage SDK
        shell: pwsh
        run: |
          $selection = @{ sdk = @{ version = "${{ env.COVERAGE_SDK_VERSION }}"; rollForward = "disable" } }
          $selection | ConvertTo-Json | Set-Content -Path (Join-Path (Split-Path -Parent $PWD.Path) "global.json")
          if ((dotnet --version) -ne "${{ env.COVERAGE_SDK_VERSION }}") { throw "Coverage SDK selection failed" }

      - name: Restore .NET packages (locked)
        run: dotnet restore ForgeTrust.AppSurface.slnx --locked-mode

      - name: Verify packed Durable consumers
        run: ./Durable/verify-packed-consumers.sh

  coverage-collection:
    needs: [coverage-evidence-plan, coverage-cli-candidate]
    if: ${{ !cancelled() && needs.coverage-evidence-plan.result == 'success' && ((needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && needs.coverage-cli-candidate.result == 'success') || (needs.coverage-evidence-plan.outputs.requires_coverage != 'true' && needs.coverage-cli-candidate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: ${{ env.COVERAGE_SDK_VERSION }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Select exact coverage SDK
        shell: pwsh
        run: |
          $selection = @{ sdk = @{ version = "${{ env.COVERAGE_SDK_VERSION }}"; rollForward = "disable" } }
          $selection | ConvertTo-Json | Set-Content -Path (Join-Path (Split-Path -Parent $PWD.Path) "global.json")
          if ((dotnet --version) -ne "${{ env.COVERAGE_SDK_VERSION }}") { throw "Coverage SDK selection failed" }

      - name: Restore .NET packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore ForgeTrust.AppSurface.slnx --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / coverage-collection |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download same-source CLI candidate package
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-cli-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-candidate-feed

      - name: Verify and install candidate CLI
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP "coverage-candidate-feed"
          $manifest = Get-Content -Raw -Path (Join-Path $feed "candidate.json") | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $sdk = (dotnet --version).Trim()
          $package = Join-Path $feed "ForgeTrust.AppSurface.Cli.${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}.nupkg"
          if ($manifest.commit -ne $env:COVERAGE_SOURCE_COMMIT -or $manifest.commit -ne $commit -or $manifest.tree -ne $tree -or
              $manifest.sdk -ne $sdk -or $manifest.sdk -ne "${{ env.COVERAGE_SDK_VERSION }}" -or
              $manifest.version -ne "${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}" -or !(Test-Path $package)) {
            throw "Candidate CLI package source, SDK, or pinned version does not match this lane."
          }
          if ((Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant() -ne $manifest.packageSha256) {
            throw "Candidate CLI package hash does not match its same-run manifest."
          }
          $toolRoot = Join-Path $env:RUNNER_TEMP "coverage-cli"
          $toolConfig = Join-Path $feed "candidate.nuget.config"
          $escapedFeed = [System.Security.SecurityElement]::Escape($feed)
          @"
          <configuration>
            <packageSources><clear /><add key="candidate" value="$escapedFeed" /></packageSources>
            <fallbackPackageFolders><clear /></fallbackPackageFolders>
          </configuration>
          "@ | Set-Content -LiteralPath $toolConfig
          dotnet tool install ForgeTrust.AppSurface.Cli --tool-path $toolRoot `
            --version "${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}" --configfile $toolConfig
          if ($LASTEXITCODE -ne 0) { throw "Candidate CLI installation failed." }
          $installedArchives = @(Get-ChildItem -LiteralPath (Join-Path $toolRoot ".store") -Recurse -File |
            Where-Object { $_.Name -ieq (Split-Path -Leaf $package) })
          if ($installedArchives.Count -ne 1 -or
              (Get-FileHash -LiteralPath $installedArchives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.packageSha256) {
            throw "Installed CLI archive does not match the same-run candidate."
          }
          $command = Join-Path $toolRoot $(if ($IsWindows) { "appsurface.exe" } else { "appsurface" })
          if (!(Test-Path $command)) { throw "Installed appsurface command was not found." }
          Add-Content -Path $env:GITHUB_ENV -Value "COVERAGE_CLI_PATH=$command"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Prepare pinned Aspire CLI bundle
        run: dnx --yes aspire.cli@13.6.5 -- setup --install-path "$HOME/.aspire" --non-interactive

      - name: Verify Tailwind release artifact transport
        run: python3 .github/tests/tailwind_workflow_transport_tests.py

      - name: Verify Durable template release artifact transport
        run: >-
          dotnet test tools/ForgeTrust.AppSurface.PackageIndex.Tests/ForgeTrust.AppSurface.PackageIndex.Tests.csproj
          --configuration Release --no-restore
          --filter FullyQualifiedName~DurableTemplateWorkflowTransportTests

      - name: Verify generated Markdown snippets
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/ForgeTrust.AppSurface.Durable/README.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/migrations/typed-work-definitions-v1.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/ForgeTrust.AppSurface.Durable.PostgreSql/README.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Web/ForgeTrust.AppSurface.Web/README.md

      - name: Verify web assets
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:build
          pnpm --dir Web run assets:verify

      - name: Verify the Durable doctor report consumer
        run: python3 -m unittest discover -s examples/durable-external-activation -p 'test_*.py'

      - name: Verify Cloud Run execution fixture comparisons
        run: python3 -m unittest discover -s Deployment/ForgeTrust.AppSurface.Deployment.GcpCloudRun.Tests/Fixtures/ExecutionEvidence/v1 -p 'test_*.py'

      - name: Test coverage scheduling history helper
        run: python3 -m unittest discover -s .github/tests -p 'coverage_schedule_history_tests.py'

      - name: Restore advisory coverage scheduling history
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/coverage-schedule-history.py restore --output "$RUNNER_TEMP/coverage-schedule/timings.json"

      - name: Collect solution coverage
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        env:
          APP_SURFACE_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/docs-outline-layout-evidence
        run: |
          set -euo pipefail
          validation="tools/ForgeTrust.AppSurface.Evidence.Validation/bin/Release/net10.0/ForgeTrust.AppSurface.Evidence.Validation.dll"
          dotnet restore tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --locked-mode
          dotnet build tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --configuration Release --no-restore
          args=(--operation collect-coverage --repository "$GITHUB_WORKSPACE" --dotnet "$(command -v dotnet)" --coverage-cli "$COVERAGE_CLI_PATH" --output "$RUNNER_TEMP/solution-coverage-collection")
          if [[ -f "$RUNNER_TEMP/coverage-schedule/timings.json" ]]; then args+=(--coverage-schedule-timings "$RUNNER_TEMP/coverage-schedule/timings.json"); fi
          dotnet "$validation" "${args[@]}"

      - name: Preserve same-attempt coverage collection
        if: ${{ success() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solution-coverage-collection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solution-coverage-collection
          if-no-files-found: error
          retention-days: 7

      - name: Publish advisory coverage scheduling timings
        if: ${{ success() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-schedule-timings
          path: ${{ runner.temp }}/solution-coverage-collection/coverage/timings.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload docs outline layout evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-outline-layout-evidence
          path: ${{ runner.temp }}/docs-outline-layout-evidence
          if-no-files-found: warn

      - name: Upload test-result diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        with:
          name: coverage-collection-diagnostics
          path: |
            ${{ runner.temp }}/solution-coverage-collection/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded test-result and slow-test diagnostics summary
        if: ${{ always() && !cancelled() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        run: |
          diagnostics_markdown="$RUNNER_TEMP/solution-coverage-collection/coverage/slow-test-diagnostics.md"
          summary_preview_maximum_bytes=65536
          if [[ -f "$diagnostics_markdown" ]]; then
            diagnostics_bytes="$(wc -c < "$diagnostics_markdown")"
            if (( diagnostics_bytes <= summary_preview_maximum_bytes )); then
              cat "$diagnostics_markdown" >> "$GITHUB_STEP_SUMMARY"
            else
              head -c "$summary_preview_maximum_bytes" "$diagnostics_markdown" >> "$GITHUB_STEP_SUMMARY"
              {
                echo
                echo
                echo "> Test-result and slow-test diagnostics were truncated in this summary (${diagnostics_bytes} bytes total). Download the \`coverage-collection-diagnostics\` artifact for the complete report."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "## Slow-test diagnostics"
              echo
              echo "No slow-test diagnostics Markdown artifact was generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ always() && !cancelled() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && env.CODECOV_TOKEN_PRESENT == 'true' }}
        with:
          files: '${{ runner.temp }}/solution-coverage-collection/coverage/junit-*.xml'
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [coverage-evidence-plan, coverage-cli-candidate, coverage-security-platform, packed-durable-consumers, coverage-collection]
    if: ${{ !cancelled() && needs.coverage-evidence-plan.result == 'success' && needs.packed-durable-consumers.result == 'success' && needs.coverage-collection.result == 'success' && ((needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && needs.coverage-cli-candidate.result == 'success') || (needs.coverage-evidence-plan.outputs.requires_coverage != 'true' && needs.coverage-cli-candidate.result == 'skipped')) && ((needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && needs.coverage-security-platform.result == 'success') || (needs.coverage-evidence-plan.outputs.requires_native_coverage != 'true' && needs.coverage-security-platform.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      COVERAGE_V3_SHADOW_DIFF_BASE: ${{ needs.coverage-evidence-plan.outputs.v3_shadow_diff_base }}
      COVERAGE_V3_SHADOW_CONTRACT_VERSION: '3'
      COVERAGE_V3_SHADOW_REPORT_PROFILE_ID: coverlet-collector-cobertura-v1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: ${{ env.COVERAGE_SDK_VERSION }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Select exact coverage SDK
        shell: pwsh
        run: |
          $selection = @{ sdk = @{ version = "${{ env.COVERAGE_SDK_VERSION }}"; rollForward = "disable" } }
          $selection | ConvertTo-Json | Set-Content -Path (Join-Path (Split-Path -Parent $PWD.Path) "global.json")
          if ((dotnet --version) -ne "${{ env.COVERAGE_SDK_VERSION }}") { throw "Coverage SDK selection failed" }

      - name: Restore .NET packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore ForgeTrust.AppSurface.slnx --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / build |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build coverage gate CLI
        run: dotnet build Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --configuration Release --no-restore

      - name: Download same-attempt coverage collection
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solution-coverage-collection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solution-coverage-collection

      - name: Download same-source CLI candidate package
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-cli-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-candidate-feed

      - name: Verify and install candidate CLI
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP "coverage-candidate-feed"
          $manifest = Get-Content -Raw -Path (Join-Path $feed "candidate.json") | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $sdk = (dotnet --version).Trim()
          $package = Join-Path $feed "ForgeTrust.AppSurface.Cli.${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}.nupkg"
          if ($manifest.commit -ne $env:COVERAGE_SOURCE_COMMIT -or $manifest.commit -ne $commit -or $manifest.tree -ne $tree -or
              $manifest.sdk -ne $sdk -or $manifest.sdk -ne "${{ env.COVERAGE_SDK_VERSION }}" -or
              $manifest.version -ne "${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}" -or !(Test-Path $package)) {
            throw "Candidate CLI package source, SDK, or pinned version does not match this lane."
          }
          if ((Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant() -ne $manifest.packageSha256) {
            throw "Candidate CLI package hash does not match its same-run manifest."
          }
          $toolRoot = Join-Path $env:RUNNER_TEMP "coverage-cli"
          $toolConfig = Join-Path $feed "candidate.nuget.config"
          $escapedFeed = [System.Security.SecurityElement]::Escape($feed)
          @"
          <configuration>
            <packageSources><clear /><add key="candidate" value="$escapedFeed" /></packageSources>
            <fallbackPackageFolders><clear /></fallbackPackageFolders>
          </configuration>
          "@ | Set-Content -LiteralPath $toolConfig
          dotnet tool install ForgeTrust.AppSurface.Cli --tool-path $toolRoot `
            --version "${{ env.COVERAGE_CLI_CANDIDATE_VERSION }}" --configfile $toolConfig
          if ($LASTEXITCODE -ne 0) { throw "Candidate CLI installation failed." }
          $installedArchives = @(Get-ChildItem -LiteralPath (Join-Path $toolRoot ".store") -Recurse -File |
            Where-Object { $_.Name -ieq (Split-Path -Leaf $package) })
          if ($installedArchives.Count -ne 1 -or
              (Get-FileHash -LiteralPath $installedArchives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.packageSha256) {
            throw "Installed CLI archive does not match the same-run candidate."
          }
          $command = Join-Path $toolRoot $(if ($IsWindows) { "appsurface.exe" } else { "appsurface" })
          if (!(Test-Path $command)) { throw "Installed appsurface command was not found." }
          Add-Content -Path $env:GITHUB_ENV -Value "COVERAGE_CLI_PATH=$command"

      - name: Verify generated package chooser
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --configuration Release --no-restore -- verify

      - name: Download same-run native coverage evidence
        if: ${{ needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-native-*
          path: ${{ runner.temp }}/coverage-native-inputs

      - name: Download isolated fresh v3 shadow native evidence
        id: download-v3-shadow-native
        if: ${{ needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-fanin-v3-native-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-fanin-v3-native-inputs

      - name: Run solution coverage and gate
        id: solution-coverage
        env:
          COVERAGE_DIFF_BASE: ${{ needs.coverage-evidence-plan.outputs.diff_base }}
          APP_SURFACE_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/docs-outline-layout-evidence
        run: |
          set -euo pipefail
          validation="tools/ForgeTrust.AppSurface.Evidence.Validation/bin/Release/net10.0/ForgeTrust.AppSurface.Evidence.Validation.dll"
          evidence_root="TestResults/coverage-evidence"
          changes="$RUNNER_TEMP/coverage-changes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          plan="$RUNNER_TEMP/coverage-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          dotnet restore tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --locked-mode
          dotnet build tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --configuration Release --no-restore
          dotnet "$validation" --operation collect --repository "$GITHUB_WORKSPACE" --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --workflow-sha "$GITHUB_SHA" --output "$changes"
          dotnet "$validation" --operation plan --scope coverage --policy .github/evidence.policy.json --changed-paths "$changes/changed-paths.json" --output "$plan"
          args=(--operation run --scope coverage --policy .github/evidence.policy.json --changed-paths "$changes/changed-paths.json" --plan "$plan/evidence-plan.json" --repository "$GITHUB_WORKSPACE" --dotnet "$(command -v dotnet)" --output "$evidence_root")
          if [[ "$(jq -r '.requiresCoverage' "$plan/selection.json")" == "true" ]]; then args+=(--coverage-cli "$COVERAGE_CLI_PATH"); fi
          if [[ -n "$COVERAGE_DIFF_BASE" && "$(jq -r '.requiresCoverage' "$plan/selection.json")" == "true" ]]; then args+=(--diff-base "$COVERAGE_DIFF_BASE"); fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$(jq -r '.requiresNativeCoverage' "$plan/selection.json")" == "true" ]]; then args+=(--native-coverage-directory "$RUNNER_TEMP/coverage-native-inputs"); fi
          if [[ "$(jq -r '.requiresCoverage' "$plan/selection.json")" == "true" ]]; then args+=(--coverage-collection "$RUNNER_TEMP/solution-coverage-collection"); fi
          dotnet "$validation" "${args[@]}"
          dotnet "$validation" --operation verify --scope coverage --policy .github/evidence.policy.json --changed-paths "$changes/changed-paths.json" --plan "$plan/evidence-plan.json" --manifest "$evidence_root/evidence-manifest.json" --artifact-root "$evidence_root/artifacts"

      - name: Capture, accept, and replay v3 shadow fan-in
        id: v3-shadow-fanin
        if: ${{ always() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && github.event_name == 'pull_request' }}
        env:
          COVERAGE_V3_SHADOW_OUTPUT: ${{ runner.temp }}/coverage-fanin-v3-shadow-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${COVERAGE_V3_SHADOW_DIFF_BASE:?The v3 shadow requires a separately pinned immutable base commit.}"
          : "${COVERAGE_CLI_PATH:?The v3 shadow requires the same-run installed candidate CLI.}"
          [[ "$COVERAGE_V3_SHADOW_DIFF_BASE" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
            echo "The v3 shadow base is not a full immutable commit ID." >&2
            exit 1
          }
          [[ ! -e "$COVERAGE_V3_SHADOW_OUTPUT" ]] || {
            echo "The v3 shadow output path is not fresh." >&2
            exit 1
          }
          primary_report="$RUNNER_TEMP/solution-coverage-collection/coverage/coverage.cobertura.xml"
          primary_timings="$RUNNER_TEMP/solution-coverage-collection/coverage/timings.json"
          native_inputs="$RUNNER_TEMP/coverage-fanin-v3-native-inputs"
          [[ -s "$primary_report" && -s "$primary_timings" ]] || {
            echo "The same-run primary collection report or timings are missing." >&2
            exit 1
          }
          [[ -d "$native_inputs" ]] || {
            echo "Fresh v3 native capture artifacts are missing." >&2
            exit 1
          }

          source_tree="$(git rev-parse 'HEAD^{tree}')"
          check_v3_shadow_manifest() {
            local manifest_path="$1"
            local producer="$2"
            [[ -s "$manifest_path" ]] || {
              echo "Required v3 capture manifest is missing: $manifest_path" >&2
              return 1
            }
            jq -e \
              --arg profile "$COVERAGE_V3_SHADOW_REPORT_PROFILE_ID" \
              --arg base "$COVERAGE_V3_SHADOW_DIFF_BASE" \
              --arg scope "$GITHUB_REPOSITORY" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg attempt "$GITHUB_RUN_ATTEMPT" \
              --arg source "$COVERAGE_SOURCE_COMMIT" \
              --arg producer "$producer" \
              '.schemaVersion == 3 and .producerId == $producer
               and .policy.contractVersion == 3 and .policy.reportProfileId == $profile
               and .policy.gate.diffBase == $base and .source.commit == $source
               and .run.runScope == $scope and .run.runId == $run_id
               and .run.attempt == ($attempt | tonumber)' \
              "$manifest_path" >/dev/null
          }
          check_v3_shadow_proof() {
            local proof_path="$1"
            local operation="$2"
            local tree="$3"
            jq -e \
              --arg profile "$COVERAGE_V3_SHADOW_REPORT_PROFILE_ID" \
              --arg base "$COVERAGE_V3_SHADOW_DIFF_BASE" \
              --arg scope "$GITHUB_REPOSITORY" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg attempt "$GITHUB_RUN_ATTEMPT" \
              --arg source "$COVERAGE_SOURCE_COMMIT" \
              --arg tree "$tree" \
              --arg operation "$operation" \
              --arg accounting_scope 'UsedBytes is the existing logical operation budget for streams, distinct Git blob work, retained inputs, and staged publication; it does not measure XML DOM heap or peak staged storage.' \
              '.schemaVersion == 1 and .contractVersion == 3 and .reportProfileId == $profile
               and .collector.packageId == "coverlet.collector" and .collector.verifiedVersion == "10.0.1"
               and .operation == $operation and .run.scope == $scope and .run.id == $run_id
               and .run.attempt == ($attempt | tonumber) and .source.commit == $source
               and .source.tree == $tree and .diff.baseCommit == $base and .completed == true
               and .accounting.scope == $accounting_scope
               and .accounting.logicalOperationBudgetWithinTotalBytes == true
               and (.accounting.maximumAdmittedXmlBytes | type == "number" and . > 0)
               and (.accounting.maximumAdmittedRecords | type == "number" and . > 0 and . <= 4000000)
               and (.accounting.maximumStagedBytes | type == "number" and . > 0)
               and (.accounting.maximumStagedFiles | type == "number" and . > 0 and . <= 10000)
               and .process.commandsWithinOperationDeadline == true' \
              "$proof_path" >/dev/null
          }
          mapfile -d '' -t native_capture_manifests < <(find "$native_inputs" -type f -path '*/capture/manifest.json' -print0)
          [[ "${#native_capture_manifests[@]}" -eq 3 ]] || {
            echo "Expected exactly three fresh v3 native capture manifests." >&2
            exit 1
          }
          for manifest_path in "${native_capture_manifests[@]}"; do
            producer="$(jq -er '.producerId' "$manifest_path")"
            case "$producer" in linux|windows|darwin) ;; *) echo "Unexpected native producer: $producer" >&2; exit 1 ;; esac
            check_v3_shadow_manifest "$manifest_path" "$producer"
            native_root="${manifest_path%/capture/manifest.json}"
            [[ -s "$native_root/shadow-proof.json" ]] || {
              echo "Required v3 native shadow proof is missing for $producer." >&2
              exit 1
            }
            native_tree="$(jq -er '.source.tree' "$manifest_path")"
            check_v3_shadow_proof "$native_root/shadow-proof.json" native "$native_tree"
          done

          dotnet run --project tools/ForgeTrust.AppSurface.Coverage.Dogfood/ForgeTrust.AppSurface.Coverage.Dogfood.csproj \
            --configuration Release --no-restore -- \
            --operation fanin --contract-version "$COVERAGE_V3_SHADOW_CONTRACT_VERSION" \
            --repository "$GITHUB_WORKSPACE" --cli "$COVERAGE_CLI_PATH" \
            --output "$COVERAGE_V3_SHADOW_OUTPUT" --configuration Release \
            --primary "$primary_report" \
            --timings "$primary_timings" \
            --native-inputs "$native_inputs" \
            --diff-base "$COVERAGE_V3_SHADOW_DIFF_BASE" \
            --run-scope "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

          check_v3_shadow_cli_result() {
            local result_path="$1"
            local operation="$2"
            [[ -s "$result_path" ]] || {
              echo "Required v3 CLI result is missing: $result_path" >&2
              return 1
            }
            jq -e --arg operation "$operation" \
              '.schemaVersion == 3
               and .operation == $operation
               and .status == "succeeded"
               and .result.operation == $operation
               and .result.outcome == "succeeded"' \
              "$result_path" >/dev/null
          }
          primary_manifest="$COVERAGE_V3_SHADOW_OUTPUT/primary/manifest.json"
          check_v3_shadow_manifest "$primary_manifest" primary
          for producer in linux windows darwin; do
            check_v3_shadow_manifest "$COVERAGE_V3_SHADOW_OUTPUT/native-$producer/manifest.json" "$producer"
          done
          for operation_pair in \
            "primary capture" "linux capture" "windows capture" "darwin capture" \
            "compose compose" "accept accept" "verify verify"; do
            read -r result_name operation <<<"$operation_pair"
            check_v3_shadow_cli_result "$COVERAGE_V3_SHADOW_OUTPUT/$result_name-result.json" "$operation"
          done

          acceptance="$COVERAGE_V3_SHADOW_OUTPUT/accepted/acceptance.json"
          applicability="$COVERAGE_V3_SHADOW_OUTPUT/accepted/patch-applicability.json"
          diff_metadata="$COVERAGE_V3_SHADOW_OUTPUT/accepted/diff-metadata.json"
          diff_patch="$COVERAGE_V3_SHADOW_OUTPUT/accepted/diff.patch"
          shadow_proof="$COVERAGE_V3_SHADOW_OUTPUT/shadow-proof.json"
          for proof_file in "$acceptance" "$applicability" "$diff_metadata" "$shadow_proof"; do
            [[ -s "$proof_file" ]] || {
              echo "Required v3 acceptance proof output is missing: $proof_file" >&2
              exit 1
            }
          done
          [[ -f "$diff_patch" ]] || {
            echo "Required v3 accepted diff file is missing: $diff_patch" >&2
            exit 1
          }
          jq -e \
            --arg source "$COVERAGE_SOURCE_COMMIT" \
            --arg tree "$source_tree" \
            --arg scope "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.schemaVersion == 3
             and .source.commit == $source
             and .source.tree == $tree
             and .run.runScope == $scope
             and .run.runId == $run_id
             and .run.attempt == ($attempt | tonumber)' \
            "$acceptance" >/dev/null
          jq -e \
            --arg profile "$COVERAGE_V3_SHADOW_REPORT_PROFILE_ID" \
            --arg source "$COVERAGE_SOURCE_COMMIT" \
            --arg tree "$source_tree" \
            --arg scope "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.schemaVersion == 3
             and .reportProfileId == $profile
             and .source.commit == $source
             and .source.tree == $tree
             and .run.runScope == $scope
             and .run.runId == $run_id
             and .run.attempt == ($attempt | tonumber)' \
            "$applicability" >/dev/null
          jq -e \
            --arg base "$COVERAGE_V3_SHADOW_DIFF_BASE" \
            --arg source "$COVERAGE_SOURCE_COMMIT" \
            '.schemaVersion == 3
             and .requestedBaseCommit == $base
             and .headCommit == $source
             and (.mergeBaseCommit | type == "string" and length > 0)' \
            "$diff_metadata" >/dev/null
          check_v3_shadow_proof "$shadow_proof" fanin "$source_tree"

      - name: Summarize v3 shadow result
        if: ${{ always() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && github.event_name == 'pull_request' }}
        env:
          COVERAGE_V3_SHADOW_OUTCOME: ${{ steps.v3-shadow-fanin.outcome }}
          COVERAGE_V3_SHADOW_DOWNLOAD_OUTCOME: ${{ steps.download-v3-shadow-native.outcome }}
        run: |
          {
            echo "### Fan-in v3 qualification (repository authority remains v2)"
            echo
            echo "- Outcome: ${COVERAGE_V3_SHADOW_OUTCOME}"
            echo "- Native capture artifact download: ${COVERAGE_V3_SHADOW_DOWNLOAD_OUTCOME}"
            echo "- Contract version: ${COVERAGE_V3_SHADOW_CONTRACT_VERSION}"
            echo "- Report profile: ${COVERAGE_V3_SHADOW_REPORT_PROFILE_ID}"
            echo "- Pinned base commit: ${COVERAGE_V3_SHADOW_DIFF_BASE}"
            echo "- Run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Accounting scope: UsedBytes is the existing logical operation budget for streams, distinct Git blob work, retained inputs, and staged publication; it does not measure XML DOM heap or peak staged storage."
            echo "- V2 remains the coverage acceptance authority; the v3 shadow must complete with current proof metadata and does not replace v2 acceptance."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload isolated v3 shadow replay output
        if: ${{ always() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fanin-v3-shadow-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-fanin-v3-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test-result diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        with:
          name: test-result-diagnostics
          path: |
            TestResults/coverage-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage gate reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' }}
        with:
          name: coverage-gate-reports
          path: |
            TestResults/coverage-evidence/evidence-summary.md
            TestResults/coverage-evidence/evidence-manifest.json
            TestResults/coverage-evidence/coverage/aggregate-gate/**
            TestResults/coverage-evidence/coverage/patch-gate/**
            TestResults/coverage-evidence/coverage-fanin/**
          if-no-files-found: warn

      - name: Upload unselected coverage manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() && needs.coverage-evidence-plan.outputs.requires_coverage != 'true' }}
        with:
          name: coverage-selection-manifest
          path: |
            TestResults/coverage-evidence/evidence-plan.json
            TestResults/coverage-evidence/selection.json
            TestResults/coverage-evidence/evidence-manifest.json
            TestResults/coverage-evidence/evidence-summary.md
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ success() && needs.coverage-evidence-plan.outputs.requires_coverage == 'true' && steps.solution-coverage.outcome == 'success' && env.CODECOV_TOKEN_PRESENT == 'true' }}
        with:
          files: ${{ github.event_name == 'pull_request' && needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && 'TestResults/coverage-evidence/coverage-fanin/composed/coverage.cobertura.xml' || 'TestResults/coverage-evidence/coverage/coverage.cobertura.xml' }}
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-manifest-gate:
    name: Coverage evidence gate
    if: ${{ always() }}
    needs: [coverage-evidence-plan, coverage-security-platform, packed-durable-consumers, coverage-collection, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless planning, selected native evidence, and the build passed
        if: ${{ needs.coverage-evidence-plan.result != 'success' || needs.build.result != 'success' || needs.packed-durable-consumers.result != 'success' || needs.coverage-collection.result != 'success' || (needs.coverage-evidence-plan.outputs.requires_native_coverage == 'true' && needs.coverage-security-platform.result != 'success') || (needs.coverage-evidence-plan.outputs.requires_native_coverage != 'true' && needs.coverage-security-platform.result != 'skipped' && needs.coverage-security-platform.result != 'success') }}
        run: exit 1
      - name: Confirm the selected coverage evidence gate passed
        if: ${{ needs.coverage-evidence-plan.result == 'success' && needs.build.result == 'success' && needs.packed-durable-consumers.result == 'success' && needs.coverage-collection.result == 'success' && (needs.coverage-evidence-plan.outputs.requires_native_coverage != 'true' || needs.coverage-security-platform.result == 'success') }}
        run: echo 'The selected coverage evidence gate passed.'

  export-appsurface-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: |
            10.0.402
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Restore AppSurface CLI packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / export-appsurface-docs |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build AppSurface CLI (Release)
        run: |
          dotnet build Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-restore

      - name: Verify AppSurface Docs harvest health
        env:
          AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0: Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js
        run: |
          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-build --no-restore -- \
            docs verify-health \
            --repo . \
            --require-complete-event-doclets \
            --environment Production \
            --startup-timeout-seconds 30

      - name: Export AppSurface Docs static site with CDN validation
        env:
          AppSurfaceDocs__Contributor__DefaultBranch: ${{ github.head_ref || github.ref_name }}
          AppSurfaceDocs__Contributor__SourceRef: ${{ github.sha }}
          AppSurfaceDocs__Contributor__SourceUrlTemplate: https://github.com/${{ github.repository }}/blob/{branch}/{path}
          AppSurfaceDocs__Contributor__SymbolSourceUrlTemplate: https://github.com/${{ github.repository }}/blob/{ref}/{path}#L{line}
          AppSurfaceDocs__Contributor__EditUrlTemplate: https://github.com/${{ github.repository }}/edit/{branch}/{path}
          AppSurfaceDocs__Contributor__LastUpdatedMode: Git
          AppSurfaceDocs__Identity__DisplayName: AppSurface
          AppSurfaceDocs__Identity__Wordmark__HighlightText: Surface
          AppSurfaceDocs__Identity__Wordmark__HighlightColor: "#3b82f6"
          AppSurfaceDocs__Identity__BrandingAssets__DirectoryPath: branding
          AppSurfaceDocs__Identity__BrandingAssets__AllowSvgAssets: "true"
          AppSurfaceDocs__Identity__Logo__Path: /branding/appsurface-site-icon.svg
          AppSurfaceDocs__Identity__Favicon__SvgPath: /branding/appsurface-site-icon.svg
          AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0: Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js
        run: |
          printf '%s\n' '/' '/docs' > "$RUNNER_TEMP/appsurface-docs-seeds.txt"
          # CI docs export can spend just over 10s in cold host startup while generating the first harvest snapshot.
          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-build --no-restore -- \
            docs export \
            --repo . \
            --mode cdn \
            --seeds "$RUNNER_TEMP/appsurface-docs-seeds.txt" \
            --output "$RUNNER_TEMP/appsurface-docs-pages" \
            --public-origin https://forge-trust.com \
            --startup-timeout-seconds 30 \
            --strict

      - name: Hydrate release-pinned docs archives
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ROOT: ${{ runner.temp }}/appsurface-docs-pages
        run: |
          set -euo pipefail
          assets_root="${RUNNER_TEMP}/appsurface-release-docs-assets"
          mkdir -p "${assets_root}" "${PAGES_ROOT}/releases"
          mapfile -t release_rows < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.draft | not) | [.tag_name, .prerelease] | @tsv'
          )
          if [[ "${#release_rows[@]}" -eq 0 ]]; then
            exit 0
          fi
          catalog_entries="${RUNNER_TEMP}/appsurface-release-docs-catalog.jsonl"
          : > "${catalog_entries}"
          for release_row in "${release_rows[@]}"; do
            IFS=$'\t' read -r release_tag _is_prerelease <<< "${release_row}"
            version="${release_tag#v}"
            asset_name="appsurface-docs-v${version}.tar.gz"
            asset_dir="${assets_root}/${version}"
            exact_tree="${PAGES_ROOT}/releases/${version}"
            mkdir -p "${asset_dir}" "${exact_tree}"
            if ! gh release download "${release_tag}" --pattern "${asset_name}" --dir "${asset_dir}" --clobber; then
              echo "No release docs archive asset found for ${release_tag}; skipping." >&2
              continue
            fi
            if tar -tzf "${asset_dir}/${asset_name}" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "Release docs archive ${asset_name} contains an unsafe absolute or parent-relative entry." >&2
              exit 1
            fi
            if ! tar -tzvf "${asset_dir}/${asset_name}" | awk '{ kind = substr($1, 1, 1); if (kind != "-" && kind != "d") exit 1 }'; then
              echo "Release docs archive ${asset_name} contains a non-regular tar entry." >&2
              exit 1
            fi
            rm -rf "${exact_tree}"
            mkdir -p "${exact_tree}"
            tar -xzf "${asset_dir}/${asset_name}" -C "${exact_tree}"
            manifest="${exact_tree}/.appsurface-docs-release-manifest.json"
            if [[ ! -f "${manifest}" ]]; then
              echo "Release docs archive ${asset_name} did not contain .appsurface-docs-release-manifest.json." >&2
              exit 1
            fi
            manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
            jq -nc \
              --arg version "${version}" \
              --arg exactTreePath "releases/${version}" \
              --arg releaseManifestSha256 "${manifest_sha256}" \
              '{version:$version,label:$version,summary:("AppSurface " + $version),supportState:"Maintained",visibility:"Public",advisoryState:"None",exactTreePath:$exactTreePath,releaseManifestSha256:$releaseManifestSha256}' \
              >> "${catalog_entries}"
          done
          if [[ -s "${catalog_entries}" ]]; then
            jq -s \
              'def semver_key: (.version | capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)") | [.major,.minor,.patch] | map(tonumber));
               def stable_version: (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"));
               (sort_by(semver_key) | reverse) as $versions |
               ($versions | map(select(stable_version)) | sort_by(semver_key) | reverse | first | .version // null) as $recommended |
               {schema:"appsurface-docs-version-catalog-v1",recommendedVersion:$recommended,versions:($versions | map(. + {supportState:(if .version == $recommended then "Current" else "Maintained" end)}))}' \
              "${catalog_entries}" > "${PAGES_ROOT}/versions.json"
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/appsurface-docs-pages
          include-hidden-files: true

  deploy-appsurface-docs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [export-appsurface-docs, build, coverage-manifest-gate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
