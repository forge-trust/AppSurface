        run: dotnet restore Durable/ForgeTrust.AppSurface.Durable.PostgreSql.Tests/ForgeTrust.AppSurface.Durable.PostgreSql.Tests.csproj --locked-mode

      - name: Verify the current provider and exact immediately previous PostgreSQL package
