      - name: Download current worker measurement segment N05
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n05.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N05
      - name: Download current worker measurement segment N06
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n06.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N06
      - name: Download current worker measurement segment N07
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n07.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N07
      - name: Download current worker measurement segment N08
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n08.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N08
      - name: Download current worker measurement segment N09
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n09.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N09
      - name: Download current worker measurement segment N10
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n10.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N10
      - name: Download current worker measurement segment N11
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n11.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N11
      - name: Download current worker measurement segment N12
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n12.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N12
      - name: Download current worker measurement segment N13
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n13.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N13
      - name: Download current worker measurement segment N14
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n14.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N14
      - name: Download current worker measurement segment N15
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n15.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N15
      - name: Download current worker measurement segment N16
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n16.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N16
      - name: Stage only fixed source-bound native measurement inputs
        run: |
          set -euo pipefail
          umask 077
          mkdir -p TestResults/issue779-native-measurement
          cp "$RUNNER_TEMP/checkpoint4-native-input/measurement-binding.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-supervision.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-sdk.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-sdk-failure.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native/sdk-test-failure.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/source.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native/native-receipt.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/root-file-tests/root-files.trx" TestResults/issue779-native-measurement/
          mkdir -m 0700 TestResults/issue779-native-measurement/root-file-tests
          cp "$RUNNER_TEMP/checkpoint4-native-input/root-file-tests/peer-credentials.trx" TestResults/issue779-native-measurement/root-file-tests/
          cp "$RUNNER_TEMP/checkpoint4-native-input/root-supplement-tests/root-supplement.trx" TestResults/issue779-native-measurement/
          mkdir -m 0700 TestResults/issue779-native-measurement/application-bundle-tests
          cp "$RUNNER_TEMP/checkpoint4-native-input/application-bundle-tests/application-bundle.trx" TestResults/issue779-native-measurement/application-bundle-tests/
          # Preserve the original C3 report/binding for NativeMeasurementTests.
          # The parent-owned account validator must validate both staged lineage directories.
          for variant in creation rollback; do
            destination="TestResults/issue779-native-measurement/accounts-$variant"
            mkdir -m 0700 "$destination"
            for name in source.json measurement-binding.json native-accounts.json native-accounts-receipt.json; do
              cp "$RUNNER_TEMP/checkpoint4-account-$variant-input/$name" "$destination/$name"
            done
          done
          destination=TestResults/issue779-native-measurement/producer-roots
          mkdir -m 0700 "$destination"
          for name in source.json producer-roots-binding.json native-producer-roots.json native-producer-roots-c2.json; do
            cp "$RUNNER_TEMP/checkpoint4-producer-input/$name" "$destination/$name"
          done
          cp "$RUNNER_TEMP/checkpoint4-producer-input/native/native-receipt.json" "$destination/native-receipt.json"
          python3 -B - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('TestResults/issue779-native-measurement').resolve()
          settings = ET.Element('RunSettings')
          collector = ET.SubElement(ET.SubElement(ET.SubElement(settings, 'DataCollectionRunSettings'), 'DataCollectors'), 'DataCollector', friendlyName='XPlat Code Coverage')
          configuration = ET.SubElement(collector, 'Configuration')
          # Only this fixed source-owned data verifier can select the completed current
          # standard report. Original C3/accounts/C2 inputs remain separate for their tests.
          import os, sys, time
          sys.path.insert(0, str(Path('.github/issue779-checkpoint1').resolve()))
          import binding
          from measurement_chain import validate_final
          source_raw = (root / 'source.json').read_bytes()
          capture = binding.validate_capture(binding.decode(source_raw), os.environ['GITHUB_SHA'])
          binding.verify_source(capture, Path.cwd(), deadline=time.monotonic() + 120)
          segments = Path(os.environ['RUNNER_TEMP']) / 'checkpoint4-worker-measurement-input'
          final_report = validate_final(source_raw, segments,
              'github-actions-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
              deadline=time.monotonic() + 120)
          # The first chain report must be the exact producer report already staged above.
          prior_sha = binding.digest((root / 'producer-roots/native-producer-roots.json').read_bytes())
          chain_data = binding.decode((segments / 'N16/chain/chain-binding.json').read_bytes())
          assert chain_data['predecessor']['report_sha256'] == prior_sha
          ET.SubElement(configuration, 'MergeWith').text = str(final_report)
          ET.SubElement(configuration, 'Format').text = 'cobertura'
          ET.ElementTree(settings).write(root / 'native.runsettings', encoding='utf-8', xml_declaration=True)
          PY
          printf 'EVIDENCEHOST_NATIVE_MEASUREMENT=1\n' >> "$GITHUB_ENV"
      - name: Restore .NET packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore ForgeTrust.AppSurface.slnx --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / build |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Verify generated package chooser
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --configuration Release --no-restore -- verify

      - name: Verify Tailwind release artifact transport
        run: python3 .github/tests/tailwind_workflow_transport_tests.py

      - name: Verify Durable template release artifact transport
        run: python3 .github/tests/durable_template_workflow_transport_tests.py

      - name: Verify generated Markdown snippets
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/ForgeTrust.AppSurface.Durable/README.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/migrations/typed-work-definitions-v1.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/ForgeTrust.AppSurface.Durable.PostgreSql/README.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Web/ForgeTrust.AppSurface.Web/README.md

      - name: Verify packed Durable consumers
        run: ./Durable/verify-packed-consumers.sh

      - name: Verify web assets
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:build
          pnpm --dir Web run assets:verify

      - name: Verify the Durable doctor report consumer
        run: python3 -m unittest discover -s examples/durable-external-activation -p 'test_*.py'

      - name: Verify coverage fan-in contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_coverage_fanin.py'

      - name: Download same-run native coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-native-*
          path: ${{ runner.temp }}/coverage-native-inputs

      - name: Run solution coverage and gate
        env:
          BUILD_CONFIGURATION: Release
          BUILD_NO_RESTORE: true
          COVERAGE_PARALLELISM: 2
          COVERAGE_GATE_DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.ref != 'refs/heads/main' && 'origin/main' || '') }}
          COVERAGE_FANIN_NATIVE: ${{ runner.temp }}/coverage-native-inputs
          APP_SURFACE_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/docs-outline-layout-evidence
        run: |
          set -euo pipefail
          worker_uid="$(id -u)"
          worker_gid="$(id -g)"
          worker_groups="$(id -G | tr ' ' ',')"
          timeout --signal=KILL 4320 sudo --non-interactive /usr/bin/python3 -B tests/evidencehost-consumer/test_execution_broker.py \
            --worker-uid "$worker_uid" --worker-gid "$worker_gid" \
            --worker-supplementary-groups "$worker_groups" \
            --subject-uid 65533 --subject-gid 65531 \
            --dotnet "$(readlink -f "$(command -v dotnet)")" \
            --reportgenerator-package "$NUGET_PACKAGES/reportgenerator/5.5.10/tools/net10.0" \
            --command-timeout-seconds 4200 -- \
            /usr/bin/env BUILD_CONFIGURATION=Release BUILD_NO_RESTORE=true COVERAGE_PARALLELISM=2 \
            NUGET_PACKAGES="$NUGET_PACKAGES" EVIDENCEHOST_NATIVE_MEASUREMENT=1 \
            COVERAGE_FANIN_NATIVE="$COVERAGE_FANIN_NATIVE" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            COVERAGE_GATE_DIFF_BASE="$COVERAGE_GATE_DIFF_BASE" APP_SURFACE_TEST_ARTIFACTS_DIR="$APP_SURFACE_TEST_ARTIFACTS_DIR" \
            /usr/bin/bash ./scripts/coverage-solution.sh

      - name: Upload docs outline layout evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-outline-layout-evidence
          path: ${{ runner.temp }}/docs-outline-layout-evidence
          if-no-files-found: warn

      - name: Upload test-result diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: test-result-diagnostics
          path: |
            TestResults/coverage-merged/slow-test-diagnostics.md
            TestResults/coverage-merged/slow-test-diagnostics.json
            TestResults/coverage-merged/timings.json
            TestResults/coverage-merged/junit-*.xml
            TestResults/coverage-merged/projects/**/dotnet-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage gate reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: coverage-gate-reports
          path: |
            TestResults/coverage-merged/fanin-primary/**
            TestResults/coverage-fanin/**
            TestResults/coverage-merged/aggregate-gate/**
            TestResults/coverage-merged/coverage-gate.json
            TestResults/coverage-merged/coverage-gate.md
            TestResults/coverage-merged/coverage-patch-targets.json
            TestResults/coverage-merged/coverage-patch-targets.md
          if-no-files-found: warn

      - name: Publish bounded test-result and slow-test diagnostics summary
        if: ${{ always() && !cancelled() }}
        run: |
          diagnostics_markdown="TestResults/coverage-merged/slow-test-diagnostics.md"
          summary_preview_maximum_bytes=65536
          if [[ -f "$diagnostics_markdown" ]]; then
            diagnostics_bytes="$(wc -c < "$diagnostics_markdown")"
            if (( diagnostics_bytes <= summary_preview_maximum_bytes )); then
              cat "$diagnostics_markdown" >> "$GITHUB_STEP_SUMMARY"
            else
              head -c "$summary_preview_maximum_bytes" "$diagnostics_markdown" >> "$GITHUB_STEP_SUMMARY"
              {
                echo
                echo
                echo "> Test-result and slow-test diagnostics were truncated in this summary (${diagnostics_bytes} bytes total). Download the \`test-result-diagnostics\` artifact for the complete report."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "## Slow-test diagnostics"
              echo
              echo "No slow-test diagnostics Markdown artifact was generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ always() && !cancelled() && env.CODECOV_TOKEN_PRESENT == 'true' }}
        with:
          files: 'TestResults/coverage-merged/coverage.cobertura.xml'
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ always() && !cancelled() && env.CODECOV_TOKEN_PRESENT == 'true' }}
        with:
          files: 'TestResults/coverage-merged/junit-*.xml'
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  export-appsurface-docs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Restore AppSurface CLI packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / export-appsurface-docs |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build AppSurface CLI (Release)
        run: |
          dotnet build Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-restore

      - name: Verify AppSurface Docs harvest health
        env:
          AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0: Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js
        run: |
          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-build --no-restore -- \
            docs verify-health \
            --repo . \
            --require-complete-event-doclets \
            --environment Production \
            --startup-timeout-seconds 30

      - name: Export AppSurface Docs static site with CDN validation
        env:
          AppSurfaceDocs__Contributor__DefaultBranch: ${{ github.head_ref || github.ref_name }}
          AppSurfaceDocs__Contributor__SourceRef: ${{ github.sha }}
          AppSurfaceDocs__Contributor__SourceUrlTemplate: https://github.com/${{ github.repository }}/blob/{branch}/{path}
          AppSurfaceDocs__Contributor__SymbolSourceUrlTemplate: https://github.com/${{ github.repository }}/blob/{ref}/{path}#L{line}
          AppSurfaceDocs__Contributor__EditUrlTemplate: https://github.com/${{ github.repository }}/edit/{branch}/{path}
          AppSurfaceDocs__Contributor__LastUpdatedMode: Git
          AppSurfaceDocs__Identity__DisplayName: AppSurface
          AppSurfaceDocs__Identity__Wordmark__HighlightText: Surface
          AppSurfaceDocs__Identity__Wordmark__HighlightColor: "#3b82f6"
          AppSurfaceDocs__Identity__BrandingAssets__DirectoryPath: branding
          AppSurfaceDocs__Identity__BrandingAssets__AllowSvgAssets: "true"
          AppSurfaceDocs__Identity__Logo__Path: /branding/appsurface-site-icon.svg
          AppSurfaceDocs__Identity__Favicon__SvgPath: /branding/appsurface-site-icon.svg
          AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0: Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js
        run: |
          printf '%s\n' '/' '/docs' > "$RUNNER_TEMP/appsurface-docs-seeds.txt"
          # CI docs export can spend just over 10s in cold host startup while generating the first harvest snapshot.
          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-build --no-restore -- \
            docs export \
            --repo . \
            --mode cdn \
            --seeds "$RUNNER_TEMP/appsurface-docs-seeds.txt" \
            --output "$RUNNER_TEMP/appsurface-docs-pages" \
            --public-origin https://forge-trust.com \
            --startup-timeout-seconds 30 \
            --strict

      - name: Hydrate release-pinned docs archives
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ROOT: ${{ runner.temp }}/appsurface-docs-pages
        run: |
          set -euo pipefail
          assets_root="${RUNNER_TEMP}/appsurface-release-docs-assets"
          mkdir -p "${assets_root}" "${PAGES_ROOT}/releases"
          mapfile -t release_rows < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.draft | not) | [.tag_name, .prerelease] | @tsv'
          )
          if [[ "${#release_rows[@]}" -eq 0 ]]; then
            exit 0
          fi
          catalog_entries="${RUNNER_TEMP}/appsurface-release-docs-catalog.jsonl"
          : > "${catalog_entries}"
          for release_row in "${release_rows[@]}"; do
            IFS=$'\t' read -r release_tag _is_prerelease <<< "${release_row}"
            version="${release_tag#v}"
            asset_name="appsurface-docs-v${version}.tar.gz"
            asset_dir="${assets_root}/${version}"
            exact_tree="${PAGES_ROOT}/releases/${version}"
            mkdir -p "${asset_dir}" "${exact_tree}"
            if ! gh release download "${release_tag}" --pattern "${asset_name}" --dir "${asset_dir}" --clobber; then
              echo "No release docs archive asset found for ${release_tag}; skipping." >&2
              continue
            fi
            if tar -tzf "${asset_dir}/${asset_name}" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "Release docs archive ${asset_name} contains an unsafe absolute or parent-relative entry." >&2
              exit 1
            fi
            if ! tar -tzvf "${asset_dir}/${asset_name}" | awk '{ kind = substr($1, 1, 1); if (kind != "-" && kind != "d") exit 1 }'; then
              echo "Release docs archive ${asset_name} contains a non-regular tar entry." >&2
              exit 1
            fi
            rm -rf "${exact_tree}"
            mkdir -p "${exact_tree}"
            tar -xzf "${asset_dir}/${asset_name}" -C "${exact_tree}"
            manifest="${exact_tree}/.appsurface-docs-release-manifest.json"
            if [[ ! -f "${manifest}" ]]; then
              echo "Release docs archive ${asset_name} did not contain .appsurface-docs-release-manifest.json." >&2
              exit 1
            fi
            manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
            jq -nc \
              --arg version "${version}" \
              --arg exactTreePath "releases/${version}" \
              --arg releaseManifestSha256 "${manifest_sha256}" \
              '{version:$version,label:$version,summary:("AppSurface " + $version),supportState:"Maintained",visibility:"Public",advisoryState:"None",exactTreePath:$exactTreePath,releaseManifestSha256:$releaseManifestSha256}' \
              >> "${catalog_entries}"
          done
          if [[ -s "${catalog_entries}" ]]; then
            jq -s \
              'def semver_key: (.version | capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)") | [.major,.minor,.patch] | map(tonumber));
               def stable_version: (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"));
               (sort_by(semver_key) | reverse) as $versions |
               ($versions | map(select(stable_version)) | sort_by(semver_key) | reverse | first | .version // null) as $recommended |
               {schema:"appsurface-docs-version-catalog-v1",recommendedVersion:$recommended,versions:($versions | map(. + {supportState:(if .version == $recommended then "Current" else "Maintained" end)}))}' \
              "${catalog_entries}" > "${PAGES_ROOT}/versions.json"
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/appsurface-docs-pages
          include-hidden-files: true

  deploy-appsurface-docs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: export-appsurface-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
