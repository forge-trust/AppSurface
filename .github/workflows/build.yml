name: build.yml

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.gitattributes'
      - '**/*.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage-security-platform:
    name: Coverage security contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: |
            Cli/ForgeTrust.AppSurface.Cli.Tests/packages.lock.json

      - name: Restore coverage security tests (locked)
        run: dotnet restore Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj --locked-mode

      - name: Run coverage security contracts
        run: >-
          dotnet test Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~CoverageRunArtifactReaderTests|FullyQualifiedName~CoverageRunOutputGuardSecurityTests|FullyQualifiedName~CoverageGateTests"
          --logger "console;verbosity=detailed"
          --blame-hang
          --blame-hang-timeout 2m
          --blame-hang-dump-type mini

      - name: Upload coverage security diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-security-diagnostics-${{ matrix.os }}
          path: Cli/ForgeTrust.AppSurface.Cli.Tests/TestResults
          if-no-files-found: warn
          retention-days: 7

  keycloak-theme-evidence:
    name: Keycloak theme evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYCLOAK_THEME_BASE_IMAGE: quay.io/keycloak/keycloak:26.6@sha256:22c8cf9e79af88d320499c93994bb2c319ca255092d8ae7c7a45dd46d68192e2
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak/packages.lock.json
            Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests/packages.lock.json

      - name: Restore focused Keycloak proof (locked)
        run: dotnet restore Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests.csproj --locked-mode

      - name: Verify theme lifecycle contracts
        run: dotnet test Auth/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests/ForgeTrust.AppSurface.Auth.Aspire.Keycloak.Tests.csproj --configuration Release --no-restore

      - name: Prove the pinned sample theme image and disposable realm
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/keycloak-theme-evidence"
          context="$RUNNER_TEMP/keycloak-theme-context"
          source_directory="$context/themes/appsurface-sample"
          container_id=""
          status="fail"
          phase="setup"
          diagnostic="ASKEYC019"
          source_manifest_digest="unavailable"
          packaged_manifest_digest="unavailable"
          build_contract_digest="unavailable"
          candidate_image_manifest_digest="unavailable"
          image_id="unavailable"
          port=""
          builder_name="appsurface-keycloak-theme-evidence"
          builder_created=false

          write_artifacts() {
            mkdir -p "$artifact_directory"
            cat > "$artifact_directory/keycloak-theme-evidence.json" <<EOF
          {
            "schema": "appsurface-keycloak-theme-evidence-v1",
            "status": "$status",
            "phase": "$phase",
            "diagnostic": "$diagnostic",
            "themeName": "appsurface-sample",
            "platform": "linux/amd64",
            "keycloakBaseImage": "$KEYCLOAK_THEME_BASE_IMAGE",
            "sourceManifestDigest": "$source_manifest_digest",
            "packagedManifestDigest": "$packaged_manifest_digest",
            "buildContractDigest": "$build_contract_digest",
            "candidateImageManifestDigest": "$candidate_image_manifest_digest",
            "candidateImageId": "$image_id"
          }
          EOF
            {
              echo "## Keycloak theme evidence"
              echo
              echo "- Status: $status"
              echo "- Phase: $phase"
              echo "- Diagnostic: $diagnostic"
              echo "- Theme: appsurface-sample"
              echo "- Platform: linux/amd64"
              echo "- Base image: $KEYCLOAK_THEME_BASE_IMAGE"
              echo "- Source manifest SHA-256: $source_manifest_digest"
              echo "- Packaged manifest SHA-256: $packaged_manifest_digest"
              echo "- Build contract SHA-256: $build_contract_digest"
              echo "- Candidate image manifest digest: $candidate_image_manifest_digest"
              echo "- Candidate image ID: $image_id"
            } > "$artifact_directory/keycloak-theme-evidence.md"
            {
              echo "status=$status"
              echo "phase=$phase"
              echo "diagnostic=$diagnostic"
            } > "$artifact_directory/keycloak-theme-evidence.log"
          }

          cleanup() {
            exit_code=$?
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            if [ "$builder_created" = true ]; then
              docker buildx rm "$builder_name" >/dev/null 2>&1 || true
            fi
            write_artifacts
            exit "$exit_code"
          }

          fail() {
            diagnostic="$1"
            phase="$2"
            printf '%s: %s\n' "$diagnostic" "$3" >&2
            exit 1
          }

          trap cleanup EXIT
          mkdir -p "$artifact_directory" "$source_directory"
          docker version --format '{{.Server.Version}}' >/dev/null 2>&1 || {
            status="not-run"
            fail ASKEYC019 docker "Docker Engine is unavailable; not-run cannot satisfy the release gate."
          }
          docker buildx create --name "$builder_name" --driver docker-container --use >/dev/null \
            || fail ASKEYC018 setup-builder "The OCI-export Buildx builder could not be created."
          builder_created=true
          docker buildx inspect --bootstrap >/dev/null \
            || fail ASKEYC018 setup-builder "The OCI-export Buildx builder could not be started."

          mkdir -p "$context/themes/appsurface-sample"
          cp -R examples/auth-aspire-keycloak-apphost/themes/appsurface-sample/. "$source_directory/"
          manifest_lines="$context/manifest-lines"
          first_entry=true
          while IFS= read -r -d '' source_path; do
            relative_path="${source_path#./}"
            if [ "$first_entry" = true ]; then
              first_entry=false
            else
              printf '\n' >> "$manifest_lines"
            fi
            byte_count="$(wc -c < "$source_directory/$relative_path" | tr -d ' ' )"
            file_digest="$(sha256sum "$source_directory/$relative_path" | awk '{print $1}')"
            printf '%s\n%s\n%s' "$relative_path" "$byte_count" "$file_digest" >> "$manifest_lines"
          done < <(cd "$source_directory" && find . -type f -print0 | LC_ALL=C sort -z)
          source_manifest_digest="$(sha256sum "$manifest_lines" | awk '{print $1}')"
          packaged_manifest_digest="$source_manifest_digest"
          build_contract_digest="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            appsurface-keycloak-theme-build-contract-v1 \
            appsurface-sample \
            "$KEYCLOAK_THEME_BASE_IMAGE" \
            linux/amd64 \
            "$source_manifest_digest" \
            "$packaged_manifest_digest" \
            '' | sha256sum | awk '{print $1}')"
          cat > "$context/Containerfile" <<EOF
          FROM $KEYCLOAK_THEME_BASE_IMAGE
          COPY --chown=keycloak:keycloak themes/appsurface-sample/ /opt/keycloak/themes/appsurface-sample/
          LABEL org.appsurface.keycloak.theme.name="appsurface-sample"
          LABEL org.appsurface.keycloak.theme.source-manifest-digest="$source_manifest_digest"
          LABEL org.appsurface.keycloak.theme.manifest-digest="$packaged_manifest_digest"
          LABEL org.appsurface.keycloak.theme.build-contract-digest="$build_contract_digest"
          LABEL org.appsurface.keycloak.theme.base-image="$KEYCLOAK_THEME_BASE_IMAGE"
          LABEL org.appsurface.keycloak.theme.platform="linux/amd64"
          EOF
          phase="build-image"
          docker build --platform linux/amd64 --file "$context/Containerfile" --tag appsurface-keycloak-theme-evidence:ci "$context" || fail ASKEYC018 build-image "The pinned theme image could not be built."
          image_id="$(docker image inspect --format '{{.Id}}' appsurface-keycloak-theme-evidence:ci)"
          for label in \
            "org.appsurface.keycloak.theme.name=appsurface-sample" \
            "org.appsurface.keycloak.theme.source-manifest-digest=$source_manifest_digest" \
            "org.appsurface.keycloak.theme.manifest-digest=$packaged_manifest_digest" \
            "org.appsurface.keycloak.theme.build-contract-digest=$build_contract_digest" \
            "org.appsurface.keycloak.theme.base-image=$KEYCLOAK_THEME_BASE_IMAGE" \
            "org.appsurface.keycloak.theme.platform=linux/amd64"; do
            label_key="${label%%=*}"
            label_value="${label#*=}"
            actual_label="$(docker image inspect --format '{{index .Config.Labels "'"$label_key"'"}}' appsurface-keycloak-theme-evidence:ci)"
            [ "$actual_label" = "$label_value" ] || fail ASKEYC018 inspect-label "The built image label '$label_key' does not match evidence."
          done
          docker run --rm --entrypoint /bin/sh appsurface-keycloak-theme-evidence:ci -c 'test -f /opt/keycloak/themes/appsurface-sample/login/theme.properties && test -f /opt/keycloak/themes/appsurface-sample/login/resources/css/appsurface-sample.css' || fail ASKEYC018 inspect-subtree "The built image does not contain the expected theme subtree."
          docker run --rm --entrypoint /bin/sh appsurface-keycloak-theme-evidence:ci -c 'find /opt/keycloak -type f -name "*keycloak-themes*.jar" -print -quit | grep -q .' || fail ASKEYC015 inspect-archive "The pinned Keycloak image does not expose the supported theme archive layout."
          oci_layout="$context/appsurface-keycloak-theme.oci.tar"
          docker buildx build --platform linux/amd64 --file "$context/Containerfile" --output "type=oci,dest=$oci_layout" "$context" || fail ASKEYC018 export-image "The OCI candidate image could not be exported."
          candidate_image_manifest_digest="$(tar -xOf "$oci_layout" index.json | jq -er '.manifests | select(length == 1) | .[0].digest')" || fail ASKEYC018 inspect-image "The OCI candidate image manifest digest is unavailable."
          rm "$oci_layout"

          mkdir -p "$context/realm-import"
          cat > "$context/realm-import/appsurface-theme-evidence-realm.json" <<'EOF'
          {
            "realm": "appsurface-theme-evidence",
            "enabled": true,
            "loginTheme": "appsurface-sample",
            "clients": [
              {
                "clientId": "appsurface-theme-evidence",
                "enabled": true,
                "publicClient": true,
                "standardFlowEnabled": true,
                "redirectUris": ["http://localhost/*"]
              }
            ]
          }
          EOF
          bootstrap_password="$(openssl rand -hex 24)"
          phase="start-runtime"
          container_id="$(docker run --detach --platform linux/amd64 --publish 127.0.0.1::8080 --volume "$context/realm-import:/opt/keycloak/data/import:ro" --env KC_BOOTSTRAP_ADMIN_USERNAME=theme-evidence --env KC_BOOTSTRAP_ADMIN_PASSWORD="$bootstrap_password" appsurface-keycloak-theme-evidence:ci start-dev --import-realm)" || fail ASKEYC019 start-runtime "The Linux/amd64 disposable Keycloak runtime could not start."
          port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p' | head -n 1)"
          [ -n "$port" ] || fail ASKEYC019 start-runtime "The disposable Keycloak runtime did not publish its HTTP port."
          metadata_url="http://127.0.0.1:$port/realms/appsurface-theme-evidence/.well-known/openid-configuration"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 "$metadata_url" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ] || fail ASKEYC019 start-runtime "The disposable Keycloak runtime did not become ready within 60 attempts (up to 240 seconds)."
          phase="readback"
          access_token="$(curl --fail --silent --show-error --max-time 10 --request POST "http://127.0.0.1:$port/realms/master/protocol/openid-connect/token" --data-urlencode grant_type=password --data-urlencode client_id=admin-cli --data-urlencode username=theme-evidence --data-urlencode password="$bootstrap_password" | jq -er '.access_token')" || fail ASKEYC020 readback "A disposable administrator token could not be acquired for readback."
          curl --fail --silent --show-error --max-time 10 --header "Authorization: Bearer $access_token" "http://127.0.0.1:$port/admin/realms/appsurface-theme-evidence" | jq -e '.loginTheme == "appsurface-sample"' >/dev/null || fail ASKEYC020 readback "Disposable realm readback did not select appsurface-sample."
          phase="verify-resource"
          login_page="$(curl --fail --silent --show-error --max-time 10 --get "http://127.0.0.1:$port/realms/appsurface-theme-evidence/protocol/openid-connect/auth" --data-urlencode client_id=appsurface-theme-evidence --data-urlencode redirect_uri=http://localhost/callback --data-urlencode response_type=code --data-urlencode scope=openid)" || fail ASKEYC021 verify-resource "The disposable authorization challenge could not render the login page."
          resource_url="$(printf '%s' "$login_page" | sed -n 's/.*href="\([^\"]*appsurface-sample\.css[^\"]*\)".*/\1/p' | head -n 1)"
          same_origin="http://127.0.0.1:$port"
          case "$resource_url" in
            "$same_origin"/*) resource_path="${resource_url#"$same_origin"}" ;;
            /*) resource_path="$resource_url" ;;
            *) fail ASKEYC021 verify-resource "The declared stylesheet is missing or not same-origin." ;;
          esac
          resource_path="${resource_path%%\?*}"
          case "$resource_path" in
            *'//'*|*'..'*|*'%2f'*|*'%2F'*) fail ASKEYC021 verify-resource "The declared stylesheet path is unsafe." ;;
          esac
          case "$resource_path" in
            */login/appsurface-sample/*) ;;
            *) fail ASKEYC021 verify-resource "The declared stylesheet path is not an appsurface-sample theme resource." ;;
          esac
          actual_resource_digest="$(curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:$port$resource_path" | sha256sum | awk '{print $1}')" || fail ASKEYC021 verify-resource "The declared stylesheet could not be fetched."
          expected_resource_digest="$(sha256sum "$source_directory/login/resources/css/appsurface-sample.css" | awk '{print $1}')"
          [ "$actual_resource_digest" = "$expected_resource_digest" ] || fail ASKEYC021 verify-resource "The declared stylesheet digest does not match the packaged source."
          status="pass"
          phase="complete"
          diagnostic="pass"

      - name: Upload secret-safe Keycloak theme evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: keycloak-theme-evidence
          path: ${{ runner.temp }}/keycloak-theme-evidence
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Restore .NET packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore ForgeTrust.AppSurface.slnx --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / build |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Test dormant release-contract classifier
        run: node --experimental-test-coverage --test-coverage-lines=100 --test-coverage-functions=100 --test-coverage-branches=100 --test .github/scripts/release-contract-v1.test.mjs

      - name: Verify generated package chooser
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --configuration Release --no-restore -- verify

      - name: Verify generated Markdown snippets
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/ForgeTrust.AppSurface.Durable/README.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Durable/ForgeTrust.AppSurface.Durable.PostgreSql/README.md
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj --configuration Release --no-restore -- verify --document Web/ForgeTrust.AppSurface.Web/README.md

      - name: Verify packed Durable consumers
        run: ./Durable/verify-packed-consumers.sh

      - name: Verify web assets
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:build
          pnpm --dir Web run assets:verify

      - name: Run solution coverage and gate
        env:
          BUILD_CONFIGURATION: Release
          BUILD_NO_RESTORE: true
          COVERAGE_PARALLELISM: 2
          COVERAGE_GATE_DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          ./scripts/coverage-solution.sh

      - name: Upload slow-test diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: slow-test-diagnostics
          path: |
            TestResults/coverage-merged/slow-test-diagnostics.md
            TestResults/coverage-merged/slow-test-diagnostics.json
          if-no-files-found: warn

      - name: Upload coverage gate reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: coverage-gate-reports
          path: |
            TestResults/coverage-merged/coverage-gate.json
            TestResults/coverage-merged/coverage-gate.md
            TestResults/coverage-merged/coverage-patch-targets.json
            TestResults/coverage-merged/coverage-patch-targets.md
          if-no-files-found: warn

      - name: Publish slow-test diagnostics summary
        if: ${{ always() && !cancelled() }}
        run: |
          diagnostics_markdown="TestResults/coverage-merged/slow-test-diagnostics.md"
          if [[ -f "$diagnostics_markdown" ]]; then
            cat "$diagnostics_markdown" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Slow-test diagnostics"
              echo
              echo "No slow-test diagnostics Markdown artifact was generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ always() && !cancelled() && env.CODECOV_TOKEN_PRESENT == 'true' }}
        with:
          files: 'TestResults/coverage-merged/coverage.cobertura.xml'
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ always() && !cancelled() && env.CODECOV_TOKEN_PRESENT == 'true' }}
        with:
          files: 'TestResults/coverage-merged/junit-*.xml'
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  export-appsurface-docs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json

      - name: Restore AppSurface CLI packages (locked, cache-aware)
        run: |
          start_seconds="$(date +%s)"
          dotnet nuget locals global-packages --list
          dotnet restore Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --locked-mode
          restore_seconds="$(( $(date +%s) - start_seconds ))"
          package_size="$(du -sh "$NUGET_PACKAGES" 2>/dev/null | cut -f1 || true)"

          {
            echo "### NuGet cache summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow job | build.yml / export-appsurface-docs |"
            echo "| Cache hit | ${{ steps.setup-dotnet.outputs.cache-hit }} |"
            echo "| Cache dependency path | \`**/packages.lock.json\`, \`**/packages.*.lock.json\` |"
            echo "| NUGET_PACKAGES | \`$NUGET_PACKAGES\` |"
            echo "| Package folder size | ${package_size:-unknown} |"
            echo "| Locked restore duration | ${restore_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build AppSurface CLI (Release)
        run: |
          dotnet build Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-restore

      - name: Verify AppSurface Docs harvest health
        env:
          AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0: Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js
        run: |
          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-build --no-restore -- \
            docs verify-health \
            --repo . \
            --require-complete-event-doclets \
            --environment Production \
            --startup-timeout-seconds 30

      - name: Export AppSurface Docs static site with CDN validation
        env:
          AppSurfaceDocs__Contributor__DefaultBranch: ${{ github.head_ref || github.ref_name }}
          AppSurfaceDocs__Contributor__SourceRef: ${{ github.sha }}
          AppSurfaceDocs__Contributor__SourceUrlTemplate: https://github.com/${{ github.repository }}/blob/{branch}/{path}
          AppSurfaceDocs__Contributor__SymbolSourceUrlTemplate: https://github.com/${{ github.repository }}/blob/{ref}/{path}#L{line}
          AppSurfaceDocs__Contributor__EditUrlTemplate: https://github.com/${{ github.repository }}/edit/{branch}/{path}
          AppSurfaceDocs__Contributor__LastUpdatedMode: Git
          AppSurfaceDocs__Identity__DisplayName: AppSurface
          AppSurfaceDocs__Identity__Wordmark__HighlightText: Surface
          AppSurfaceDocs__Identity__Wordmark__HighlightColor: "#3b82f6"
          AppSurfaceDocs__Identity__BrandingAssets__DirectoryPath: branding
          AppSurfaceDocs__Identity__BrandingAssets__AllowSvgAssets: "true"
          AppSurfaceDocs__Identity__Logo__Path: /branding/appsurface-site-icon.svg
          AppSurfaceDocs__Identity__Favicon__SvgPath: /branding/appsurface-site-icon.svg
          AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0: Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js
        run: |
          printf '%s\n' '/' '/docs' > "$RUNNER_TEMP/appsurface-docs-seeds.txt"
          # CI docs export can spend just over 10s in cold host startup while generating the first harvest snapshot.
          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release --no-build --no-restore -- \
            docs export \
            --repo . \
            --mode cdn \
            --seeds "$RUNNER_TEMP/appsurface-docs-seeds.txt" \
            --output "$RUNNER_TEMP/appsurface-docs-pages" \
            --public-origin https://forge-trust.com \
            --startup-timeout-seconds 30 \
            --strict

      - name: Hydrate release-pinned docs archives
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ROOT: ${{ runner.temp }}/appsurface-docs-pages
        run: |
          set -euo pipefail
          assets_root="${RUNNER_TEMP}/appsurface-release-docs-assets"
          mkdir -p "${assets_root}" "${PAGES_ROOT}/releases"
          mapfile -t release_rows < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.draft | not) | [.tag_name, .prerelease] | @tsv'
          )
          if [[ "${#release_rows[@]}" -eq 0 ]]; then
            exit 0
          fi
          catalog_entries="${RUNNER_TEMP}/appsurface-release-docs-catalog.jsonl"
          : > "${catalog_entries}"
          for release_row in "${release_rows[@]}"; do
            IFS=$'\t' read -r release_tag _is_prerelease <<< "${release_row}"
            version="${release_tag#v}"
            asset_name="appsurface-docs-v${version}.tar.gz"
            asset_dir="${assets_root}/${version}"
            exact_tree="${PAGES_ROOT}/releases/${version}"
            mkdir -p "${asset_dir}" "${exact_tree}"
            if ! gh release download "${release_tag}" --pattern "${asset_name}" --dir "${asset_dir}" --clobber; then
              echo "No release docs archive asset found for ${release_tag}; skipping." >&2
              continue
            fi
            if tar -tzf "${asset_dir}/${asset_name}" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "Release docs archive ${asset_name} contains an unsafe absolute or parent-relative entry." >&2
              exit 1
            fi
            if ! tar -tzvf "${asset_dir}/${asset_name}" | awk '{ kind = substr($1, 1, 1); if (kind != "-" && kind != "d") exit 1 }'; then
              echo "Release docs archive ${asset_name} contains a non-regular tar entry." >&2
              exit 1
            fi
            rm -rf "${exact_tree}"
            mkdir -p "${exact_tree}"
            tar -xzf "${asset_dir}/${asset_name}" -C "${exact_tree}"
            manifest="${exact_tree}/.appsurface-docs-release-manifest.json"
            if [[ ! -f "${manifest}" ]]; then
              echo "Release docs archive ${asset_name} did not contain .appsurface-docs-release-manifest.json." >&2
              exit 1
            fi
            manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
            jq -nc \
              --arg version "${version}" \
              --arg exactTreePath "releases/${version}" \
              --arg releaseManifestSha256 "${manifest_sha256}" \
              '{version:$version,label:$version,summary:("AppSurface " + $version),supportState:"Maintained",visibility:"Public",advisoryState:"None",exactTreePath:$exactTreePath,releaseManifestSha256:$releaseManifestSha256}' \
              >> "${catalog_entries}"
          done
          if [[ -s "${catalog_entries}" ]]; then
            jq -s \
              'def semver_key: (.version | capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)") | [.major,.minor,.patch] | map(tonumber));
               def stable_version: (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"));
               (sort_by(semver_key) | reverse) as $versions |
               ($versions | map(select(stable_version)) | sort_by(semver_key) | reverse | first | .version // null) as $recommended |
               {schema:"appsurface-docs-version-catalog-v1",recommendedVersion:$recommended,versions:($versions | map(. + {supportState:(if .version == $recommended then "Current" else "Maintained" end)}))}' \
              "${catalog_entries}" > "${PAGES_ROOT}/versions.json"
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/appsurface-docs-pages
          include-hidden-files: true

  deploy-appsurface-docs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: export-appsurface-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
