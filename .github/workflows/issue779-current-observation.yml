name: Issue 779 current systemd Observation

on:
  push:
    branches: [codex/issue779-runtime-validation-20261002]

permissions:
  contents: read

jobs:
  current-observation:
    name: Current production CLI under systemd, no Trusted acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 714a60ea818aabd9d9b0fc9abf2c74d725896ae1
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Setup pnpm 11.1.3
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare pinned web assets required by the CLI build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:build
      - name: Execute current production Observation and exact Trusted rejection
        shell: bash
        env:
          EVIDENCEHOST_PROOF_LABEL: candidate-no-trust-acceptance
          EVIDENCEHOST_WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          EVIDENCEHOST_SOURCE_HEAD_SHA: 714a60ea818aabd9d9b0fc9abf2c74d725896ae1
          EVIDENCEHOST_BASE_REVISION: 4aa8329c76f4279ad319747f9f3c14b9b8de51ef
          EVIDENCEHOST_RUN_ID: ${{ github.run_id }}
          EVIDENCEHOST_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCEHOST_OUTPUT_PARENT: ${{ runner.temp }}/evidencehost-current-observation
        run: |
          set -euo pipefail
          bash scripts/verify-evidencehost-linux-runtime.sh "$EVIDENCEHOST_OUTPUT_PARENT" 2>&1 | tee "$RUNNER_TEMP/evidencehost-current-observation.log"
      - name: Retain actual Observation receipts and console failure output
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue779-current-systemd-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidencehost-current-observation/
            ${{ runner.temp }}/evidencehost-current-observation.log
          if-no-files-found: warn
          retention-days: 7
