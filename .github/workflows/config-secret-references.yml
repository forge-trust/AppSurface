name: Config secret reference contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'Config/**'
      - 'ForgeTrust.AppSurface.Core/**'
      - 'examples/file-secret-references/**'
      - 'Directory.*'
      - '.github/workflows/config-secret-references.yml'
  push:
    branches: [main]
    paths:
      - 'Config/**'
      - 'ForgeTrust.AppSurface.Core/**'
      - 'examples/file-secret-references/**'
      - 'Directory.*'
      - '.github/workflows/config-secret-references.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Secret references (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Run core composition, file and environment contracts
        run: >-
          dotnet test Config/ForgeTrust.AppSurface.Config.Tests/ForgeTrust.AppSurface.Config.Tests.csproj
          --configuration Release -p:RestoreLockedMode=true
          --filter "FullyQualifiedName~ConfigComposition|FullyQualifiedName~SecretContract|FullyQualifiedName~ConfigSecretContract|FullyQualifiedName~FileBasedConfigProvider|FullyQualifiedName~EnvironmentConfigProvider|FullyQualifiedName~ConfigEnvironmentCandidates"
          --logger "trx;LogFileName=secret-reference-contracts.trx"
      - name: Run Google reference and migration contracts with a fake client
        run: >-
          dotnet test Config/ForgeTrust.AppSurface.Config.GoogleSecretManager.Tests/ForgeTrust.AppSurface.Config.GoogleSecretManager.Tests.csproj
          --configuration Release -p:RestoreLockedMode=true
          --logger "trx;LogFileName=google-secret-reference-contracts.trx"
      - name: Run LocalSecrets base and compatibility contracts
        run: >-
          dotnet test Config/ForgeTrust.AppSurface.Config.LocalSecrets.Tests/ForgeTrust.AppSurface.Config.LocalSecrets.Tests.csproj
          --configuration Release -p:RestoreLockedMode=true
          --filter "FullyQualifiedName~AppSurfaceLocalSecretProviderTests|FullyQualifiedName~LocalSecretsRegistrationTests"
          --logger "trx;LogFileName=local-secret-base-contracts.trx"
      - name: Upload contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-secret-contracts-${{ matrix.os }}
          path: Config/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
