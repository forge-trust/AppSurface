name: Evidence gate pilot

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions: {}

concurrency:
  group: evidence-gate-pilot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  controller-capture:
    name: Evidence gate controller capture (non-claiming)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      profile_id: ${{ steps.profile.outputs.profile_id }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the workflow's trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Capture the exact pull-request revision pair
        id: capture
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"

          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-controller.py" \
            --event "$GITHUB_EVENT_PATH" \
            --output "$capture_directory" \
            --target-branch main

          if [[ -f "$capture_directory/source.diff" && ! -L "$capture_directory/source.diff" ]]; then
            printf '%s\n' 'mode=same-repository' >> "$GITHUB_OUTPUT"
          elif [[ -f "$capture_directory/observation.json" && ! -L "$capture_directory/observation.json" ]]; then
            printf '%s\n' 'mode=observation-only' >> "$GITHUB_OUTPUT"
          else
            echo 'The controller did not produce a recognized bounded capture.' >&2
            exit 1
          fi

      - name: Set up the trusted policy planner
        if: ${{ steps.capture.outputs.mode == 'same-repository' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Resolve the base-owned policy for the exact captured change
        if: ${{ steps.capture.outputs.mode == 'same-repository' }}
        shell: bash
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"
          identity="$capture_directory/pull-request-run-identity.json"
          base_revision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["BaseRevision"])' "$identity")
          head_revision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["HeadRevision"])' "$identity")
          planner_project="$GITHUB_WORKSPACE/trusted/Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"
          policy="$GITHUB_WORKSPACE/trusted/.appsurface/evidence/evidence.policy.json"

          dotnet restore "$planner_project" --locked-mode --verbosity quiet
          dotnet run --no-restore --project "$planner_project" -- evidence explain \
            --gate-mode \
            --policy "$policy" \
            --repository "$capture_directory/repository.git" \
            --base-revision "$base_revision" \
            --head-revision "$head_revision" \
            --diff-file "$capture_directory/source.diff" \
            --pr-run-identity "$identity" \
            --output "$RUNNER_TEMP/evidence-gate-plan"

      - name: Export the bounded policy-selected profile
        id: profile
        if: ${{ steps.capture.outputs.mode == 'same-repository' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/evidence-gate-plan/evidence-plan.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as plan_file:
              profile_id = json.load(plan_file)["Profile"]["Id"]
          if not isinstance(profile_id, str) or re.fullmatch(r"[a-z0-9-]{1,64}", profile_id) is None:
              raise SystemExit("The policy-selected profile cannot be exported safely.")
          with open(sys.argv[2], "a", encoding="utf-8") as output_file:
              output_file.write(f"profile_id={profile_id}\n")
          PY

      - name: Compare the captured policy with protected-base policy fixtures
        if: ${{ steps.capture.outputs.mode == 'same-repository' }}
        shell: bash
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"
          protected_base="$GITHUB_WORKSPACE/trusted"
          candidate_directory="$RUNNER_TEMP/evidence-gate-policy-shadow-inputs"
          planner_project="$protected_base/Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"

          python3 "$protected_base/scripts/evidence-gate-policy-shadow.py" \
            --capture-directory "$capture_directory" \
            --protected-base "$protected_base" \
            --output-directory "$candidate_directory"

          dotnet run --no-restore --project "$planner_project" -- evidence shadow-policy \
            --base-policy "$protected_base/.appsurface/evidence/evidence.policy.json" \
            --candidate-policy "$candidate_directory/.appsurface/evidence/evidence.policy.json" \
            --base-fixtures "$protected_base/docs/fixtures/issue-777-policy-shadow/fixtures.json" \
            --candidate-fixtures "$candidate_directory/docs/fixtures/issue-777-policy-shadow/fixtures.json" \
            --output "$RUNNER_TEMP/evidence-gate-policy-shadow-result"

      - name: Create the bounded subject handoff
        shell: bash
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"
          handoff_directory="$RUNNER_TEMP/evidence-gate-handoff"
          plan_arguments=()
          if [[ -f "$capture_directory/source.diff" ]]; then
            plan_arguments=(--plan-file "$RUNNER_TEMP/evidence-gate-plan/evidence-plan.json")
          fi

          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-handoff.py" create \
            --capture-directory "$capture_directory" \
            --trusted-scripts-directory "$GITHUB_WORKSPACE/trusted/scripts" \
            --output-directory "$handoff_directory" \
            "${plan_arguments[@]}"

      - name: Upload the bounded same-run handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-handoff/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  subject-image-preflight:
    name: Evidence gate subject image provenance (non-claiming)
    needs: controller-capture
    if: ${{ needs.controller-capture.result == 'success' && needs.controller-capture.outputs.profile_id == 'code-coverage' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image: ${{ steps.verify.outputs.image }}
    steps:
      - name: Verify the protected-main publisher and registry digest
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_IMAGE: ${{ vars.EVIDENCE_GATE_SUBJECT_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          if [[ ! "$SUBJECT_IMAGE" =~ ^ghcr\.io/forge-trust/appsurface-subject-native-validation@sha256:[0-9a-f]{64}$ ]]; then
            echo 'The configured subject image must be the reviewed GHCR package at its registry digest.' >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          gh attestation verify "oci://$SUBJECT_IMAGE" \
            --repo forge-trust/AppSurface \
            --signer-workflow forge-trust/AppSurface/.github/workflows/evidence-gate-subject-image-publish.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/evidence-gate-image-attestation.json"
          python3 - "$RUNNER_TEMP/evidence-gate-image-attestation.json" "${SUBJECT_IMAGE##*@sha256:}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as verified_file:
              results = json.load(verified_file)
          expected_digest = sys.argv[2]
          if not isinstance(results, list) or not any(
              isinstance(subject.get("digest"), dict)
              and subject["digest"].get("sha256") == expected_digest
              for result in results
              for subject in result.get("verificationResult", {}).get("statement", {}).get("subject", [])
              if isinstance(subject, dict)
          ):
              raise SystemExit("The verified provenance does not name the configured registry digest.")
          PY
          printf 'image=%s\n' "$SUBJECT_IMAGE" >> "$GITHUB_OUTPUT"

  credentialless-subject:
    name: Evidence gate subject (credentialless, non-claiming)
    needs:
      - controller-capture
      - subject-image-preflight
    if: ${{ always() && needs.controller-capture.result == 'success' && (needs.controller-capture.outputs.profile_id != 'code-coverage' || needs.subject-image-preflight.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {}
    steps:
      - name: Download this run's controller handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-gate-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-controller-handoff

      - name: Pull only the attested image digest without credentials
        if: ${{ needs.controller-capture.outputs.profile_id == 'code-coverage' }}
        shell: bash
        env:
          SUBJECT_IMAGE: ${{ needs.subject-image-preflight.outputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "$SUBJECT_IMAGE" =~ ^ghcr\.io/forge-trust/appsurface-subject-native-validation@sha256:[0-9a-f]{64}$ ]]; then
            echo 'The subject image digest is missing or malformed.' >&2
            exit 1
          fi
          auth_file="$RUNNER_TEMP/evidence-gate-empty-registry-auth.json"
          ( umask 077; printf '{}\n' > "$auth_file" )
          env REGISTRY_AUTH_FILE="$auth_file" podman pull --authfile "$auth_file" --tls-verify=true "$SUBJECT_IMAGE"
          env REGISTRY_AUTH_FILE="$auth_file" podman image inspect "$SUBJECT_IMAGE" --format '{{json .RepoDigests}}' |
            python3 -c 'import json,sys; ref=sys.argv[1]; refs=json.load(sys.stdin); sys.exit(0 if isinstance(refs,list) and ref in refs else 1)' "$SUBJECT_IMAGE"

      - name: Execute the bounded non-claiming subject profile
        shell: bash
        env:
          EVIDENCE_GATE_SUBJECT_IMAGE: ${{ needs.subject-image-preflight.outputs.image }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/evidence-gate-controller-handoff/evidence-gate-handoff.py" execute \
            --handoff-directory "$RUNNER_TEMP/evidence-gate-controller-handoff" \
            --subject-checkout "$RUNNER_TEMP/evidence-gate-subject-checkout" \
            --scratch-directory "$RUNNER_TEMP/evidence-gate-subject-scratch" \
            --artifact-export-directory "$RUNNER_TEMP/evidence-gate-subject-artifacts" \
            --result "$RUNNER_TEMP/evidence-gate-subject-result.json" \
            --image-digest "$EVIDENCE_GATE_SUBJECT_IMAGE"

      - name: Upload bounded non-claiming coverage artifacts
        if: ${{ needs.controller-capture.outputs.profile_id == 'code-coverage' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-subject-artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Require independent subject cleanup to attest completion
        if: ${{ always() && needs.controller-capture.outputs.profile_id == 'code-coverage' }}
        shell: bash
        timeout-minutes: 11
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/evidence-gate-controller-handoff/evidence-gate-cleanup-attestation-check.py" \
            --runner-temp "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/evidence-gate-cleanup-attestation.json"

      - name: Upload the bounded non-claiming cleanup attestation
        if: ${{ always() && needs.controller-capture.outputs.profile_id == 'code-coverage' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-cleanup-attestation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Ensure a fixed non-claiming result exists
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/evidence-gate-subject-result.json" <<'PY'
          import os
          import stat
          import sys

          result_path = sys.argv[1]
          fallback = (
              b'{"claimEligible":false,"execution":"failed","schemaVersion":1,'
              b'"diagnostic":{"code":"ASEHB011","message":"The credentialless subject handoff failed before recording its bounded result."}}\n'
          )
          try:
              descriptor = os.open(
                  result_path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                  0o600,
              )
          except FileExistsError:
              metadata = os.lstat(result_path)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > 16 * 1024:
                  raise SystemExit("The subject result path is not a bounded regular file.")
          else:
              with os.fdopen(descriptor, "wb") as result_file:
                  result_file.write(fallback)
          PY

      - name: Upload the fixed non-claiming subject result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-subject-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  trusted-verifier:
    name: Evidence gate verifier (pilot)
    needs:
      - controller-capture
      - subject-image-preflight
      - credentialless-subject
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the workflow's trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Download same-run handoffs when both producer jobs succeeded
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-gate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-verifier-inputs
          merge-multiple: false

      - name: Recapture the current pull-request revision for independent verification
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-controller.py" \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/evidence-gate-verifier-capture" \
            --target-branch main
          test -f "$RUNNER_TEMP/evidence-gate-verifier-capture/pull-request-run-identity.json"

      - name: Bind the downloaded handoff to the fresh Git tree
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          EVIDENCE_PROFILE_ID: ${{ needs.controller-capture.outputs.profile_id }}
          EXPECTED_SUBJECT_IMAGE: ${{ needs.subject-image-preflight.outputs.image }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/evidence-gate-verifier-inputs/evidence-gate-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          subject="$RUNNER_TEMP/evidence-gate-verifier-inputs/evidence-gate-subject-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/evidence-gate-subject-result.json"
          artifacts="$RUNNER_TEMP/evidence-gate-verifier-inputs/evidence-gate-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_args=()
          if [[ "$EVIDENCE_PROFILE_ID" == code-coverage ]]; then
            artifact_args=(--subject-artifacts "$artifacts" --expected-image-digest "$EXPECTED_SUBJECT_IMAGE")
          fi
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-handoff.py" verify \
            --handoff-directory "$handoff" \
            --fresh-capture-directory "$RUNNER_TEMP/evidence-gate-verifier-capture" \
            --subject-result "$subject" \
            "${artifact_args[@]}" \
            --output-plan "$RUNNER_TEMP/evidence-gate-verified-plan.json"

      - name: Require the subject's independent cleanup completion record
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup="$RUNNER_TEMP/evidence-gate-verifier-inputs/evidence-gate-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/evidence-gate-cleanup-attestation.json"
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-verify-cleanup.py" \
            --plan "$RUNNER_TEMP/evidence-gate-verified-plan.json" \
            --attestation "$cleanup"

      - name: Set up the trusted verifier
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Replay the downloaded coverage against the freshly captured diff (non-claiming)
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' && needs.controller-capture.outputs.profile_id == 'code-coverage' }}
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/evidence-gate-verifier-capture"
          artifacts="$RUNNER_TEMP/evidence-gate-verifier-inputs/evidence-gate-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="$GITHUB_WORKSPACE/trusted/Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"

          python3 - "$RUNNER_TEMP/evidence-gate-verified-plan.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as plan_file:
              profile = json.load(plan_file)["Profile"]
          producers = [producer for producer in profile["Producers"] if producer["Id"] == "coverage"]
          expected = {
              "MinLinePercent": 95,
              "MinBranchPercent": 85,
              "MinPatchLinePercent": 95,
              "MinPatchBranchPercent": 85,
              "PatchLineMode": "codecov",
              "TolerancePercent": 0.5,
          }
          if profile["Id"] != "code-coverage" or len(producers) != 1 or producers[0]["CoverageGate"] != expected:
              raise SystemExit("The trusted coverage replay no longer matches the selected base-owned policy.")
          PY

          # Cobertura paths from the fixed subject entrypoint are rooted at /subject.
          # The verifier needs only an existing normalization root; it does not
          # execute or trust any file from the subject's checkout here.
          test ! -e /subject && test ! -L /subject
          sudo -n install -d -m 0755 /subject
          dotnet restore "$project" --locked-mode --verbosity quiet
          dotnet run --no-restore --configuration Release --project "$project" -- coverage gate \
            --coverage "$artifacts/cobertura.xml" \
            --repository-root /subject \
            --diff-file "$capture/source.diff" \
            --diff-label captured-source-diff \
            --min-line 95 --min-branch 85 \
            --min-patch-line 95 --min-patch-branch 85 \
            --patch-line-mode codecov --tolerance 0.5 \
            --output "$RUNNER_TEMP/evidence-gate-trusted-coverage-replay" \
            --no-github-summary

      - name: Resolve current workflow and subject-job identity
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-verifier-context.py" \
            --fresh-identity "$RUNNER_TEMP/evidence-gate-verifier-capture/pull-request-run-identity.json" \
            --output "$RUNNER_TEMP/evidence-gate-expected-identity.json"

      - name: Record bounded non-claiming subject observation
        id: observation
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          EVIDENCE_PROFILE_ID: ${{ needs.controller-capture.outputs.profile_id }}
          EXPECTED_SUBJECT_IMAGE: ${{ needs.subject-image-preflight.outputs.image }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/evidence-gate-verifier-inputs"
          args=(
            --verified-plan "$RUNNER_TEMP/evidence-gate-verified-plan.json"
            --verifier-identity "$RUNNER_TEMP/evidence-gate-expected-identity.json"
            --subject-result "$inputs/evidence-gate-subject-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/evidence-gate-subject-result.json"
            --output "$RUNNER_TEMP/evidence-gate-observation.json"
          )
          if [[ "$EVIDENCE_PROFILE_ID" == code-coverage ]]; then
            args+=(
              --cleanup-record "$inputs/evidence-gate-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/evidence-gate-cleanup-attestation.json"
              --subject-artifacts-directory "$inputs/evidence-gate-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              --expected-image-digest "$EXPECTED_SUBJECT_IMAGE"
            )
          fi
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-observation.py" "${args[@]}"

      - name: Upload bounded non-claiming subject observation
        if: ${{ steps.observation.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-observation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Recompute the host manifest and independently verify the gate
        id: gate_verifier
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/evidence-gate-verifier-capture"
          plan="$RUNNER_TEMP/evidence-gate-verified-plan.json"
          project="$GITHUB_WORKSPACE/trusted/tools/ForgeTrust.AppSurface.EvidenceGate/ForgeTrust.AppSurface.EvidenceGate.csproj"
          policy="$GITHUB_WORKSPACE/trusted/.appsurface/evidence/evidence.policy.json"
          identity="$RUNNER_TEMP/evidence-gate-expected-identity.json"
          host="$RUNNER_TEMP/evidence-gate-host"
          verdict="$RUNNER_TEMP/evidence-gate-verdict"

          dotnet restore "$project" --locked-mode --verbosity quiet
          host_status=0
          dotnet run --no-restore --project "$project" -- run \
            --plan "$plan" --policy "$policy" \
            --repository "$capture/repository.git" --output-dir "$host" || host_status=$?
          if [[ ! -f "$host/evidence-manifest.json" ]]; then
            echo "The trusted host did not produce a bounded manifest (exit $host_status)." >&2
            exit 1
          fi
          dotnet run --no-restore --project "$project" -- verify-gate \
            --plan "$plan" --manifest "$host/evidence-manifest.json" \
            --policy "$policy" --repository "$capture/repository.git" \
            --identity "$identity" --output-dir "$verdict"

      - name: Publish the independent bounded gate verdict
        if: ${{ always() }}
        shell: bash
        env:
          CONTROLLER_RESULT: ${{ needs.controller-capture.result }}
          SUBJECT_RESULT: ${{ needs.credentialless-subject.result }}
          VERIFIER_RESULT: ${{ steps.gate_verifier.outcome }}
        run: |
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-finalize.py" \
            --verdict-directory "$RUNNER_TEMP/evidence-gate-verdict" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --controller-outcome "$CONTROLLER_RESULT" \
            --subject-outcome "$SUBJECT_RESULT" \
            --verifier-outcome "$VERIFIER_RESULT"
