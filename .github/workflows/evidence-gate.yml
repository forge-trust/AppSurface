name: Evidence gate pilot (non-claiming)

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions: {}

concurrency:
  group: evidence-gate-pilot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  controller-capture:
    name: Evidence gate controller capture (non-claiming)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the workflow's trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Capture the exact pull-request revision pair
        id: capture
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"

          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-controller.py" \
            --event "$GITHUB_EVENT_PATH" \
            --output "$capture_directory" \
            --target-branch main

          if [[ -f "$capture_directory/source.diff" && ! -L "$capture_directory/source.diff" ]]; then
            printf '%s\n' 'mode=same-repository' >> "$GITHUB_OUTPUT"
          elif [[ -f "$capture_directory/observation.json" && ! -L "$capture_directory/observation.json" ]]; then
            printf '%s\n' 'mode=observation-only' >> "$GITHUB_OUTPUT"
          else
            echo 'The controller did not produce a recognized bounded capture.' >&2
            exit 1
          fi

      - name: Set up the trusted policy planner
        if: ${{ steps.capture.outputs.mode == 'same-repository' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve the base-owned policy for the exact captured change
        if: ${{ steps.capture.outputs.mode == 'same-repository' }}
        shell: bash
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"
          identity="$capture_directory/pull-request-run-identity.json"
          base_revision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["BaseRevision"])' "$identity")
          head_revision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["HeadRevision"])' "$identity")
          planner_project="$GITHUB_WORKSPACE/trusted/Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"
          policy="$GITHUB_WORKSPACE/trusted/.appsurface/evidence/evidence.policy.json"

          dotnet restore "$planner_project" --locked-mode --verbosity quiet
          dotnet run --no-restore --project "$planner_project" -- evidence explain \
            --gate-mode \
            --policy "$policy" \
            --repository "$capture_directory/repository.git" \
            --base-revision "$base_revision" \
            --head-revision "$head_revision" \
            --diff-file "$capture_directory/source.diff" \
            --pr-run-identity "$identity" \
            --output "$RUNNER_TEMP/evidence-gate-plan"

      - name: Create the bounded subject handoff
        shell: bash
        run: |
          set -euo pipefail
          capture_directory="$RUNNER_TEMP/evidence-gate-capture"
          handoff_directory="$RUNNER_TEMP/evidence-gate-handoff"
          plan_arguments=()
          if [[ -f "$capture_directory/source.diff" ]]; then
            plan_arguments=(--plan-file "$RUNNER_TEMP/evidence-gate-plan/evidence-plan.json")
          fi

          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-handoff.py" create \
            --capture-directory "$capture_directory" \
            --trusted-scripts-directory "$GITHUB_WORKSPACE/trusted/scripts" \
            --output-directory "$handoff_directory" \
            "${plan_arguments[@]}"

      - name: Upload the bounded same-run handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-handoff/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  credentialless-subject:
    name: Evidence gate subject (credentialless, non-claiming)
    needs: controller-capture
    if: ${{ needs.controller-capture.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Download this run's controller handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-gate-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-controller-handoff

      - name: Execute the bounded non-claiming subject profile
        shell: bash
        env:
          EVIDENCE_GATE_SUBJECT_IMAGE: ${{ vars.EVIDENCE_GATE_SUBJECT_IMAGE }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/evidence-gate-controller-handoff/evidence-gate-handoff.py" execute \
            --handoff-directory "$RUNNER_TEMP/evidence-gate-controller-handoff" \
            --subject-checkout "$RUNNER_TEMP/evidence-gate-subject-checkout" \
            --scratch-directory "$RUNNER_TEMP/evidence-gate-subject-scratch" \
            --result "$RUNNER_TEMP/evidence-gate-subject-result.json" \
            --image-digest "$EVIDENCE_GATE_SUBJECT_IMAGE"

      - name: Ensure a fixed non-claiming result exists
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/evidence-gate-subject-result.json" <<'PY'
          import os
          import stat
          import sys

          result_path = sys.argv[1]
          fallback = (
              b'{"claimEligible":false,"execution":"failed","schemaVersion":1,'
              b'"diagnostic":{"code":"ASEHB011","message":"The credentialless subject handoff failed before recording its bounded result."}}\n'
          )
          try:
              descriptor = os.open(
                  result_path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                  0o600,
              )
          except FileExistsError:
              metadata = os.lstat(result_path)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > 16 * 1024:
                  raise SystemExit("The subject result path is not a bounded regular file.")
          else:
              with os.fdopen(descriptor, "wb") as result_file:
                  result_file.write(fallback)
          PY

      - name: Upload the fixed non-claiming subject result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-gate-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-subject-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  trusted-verifier:
    name: Evidence gate verifier (non-claiming; intentionally fails closed)
    needs:
      - controller-capture
      - credentialless-subject
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the workflow's trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Download same-run handoffs when both producer jobs succeeded
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-gate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-verifier-inputs
          merge-multiple: false

      - name: Recapture the current pull-request revision for independent verification
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-controller.py" \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/evidence-gate-verifier-capture" \
            --target-branch main
          test -f "$RUNNER_TEMP/evidence-gate-verifier-capture/pull-request-run-identity.json"

      - name: Bind the downloaded handoff to the fresh Git tree
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/evidence-gate-verifier-inputs/evidence-gate-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-handoff.py" verify \
            --handoff-directory "$handoff" \
            --fresh-capture-directory "$RUNNER_TEMP/evidence-gate-verifier-capture" \
            --output-plan "$RUNNER_TEMP/evidence-gate-verified-plan.json"

      - name: Set up the trusted verifier
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Recompute the host manifest and rehearse independent verification
        if: ${{ needs.controller-capture.result == 'success' && needs.credentialless-subject.result == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/evidence-gate-verifier-capture"
          plan="$RUNNER_TEMP/evidence-gate-verified-plan.json"
          project="$GITHUB_WORKSPACE/trusted/tools/ForgeTrust.AppSurface.EvidenceGate/ForgeTrust.AppSurface.EvidenceGate.csproj"
          policy="$GITHUB_WORKSPACE/trusted/.appsurface/evidence/evidence.policy.json"
          identity="$RUNNER_TEMP/evidence-gate-expected-identity.json"
          host="$RUNNER_TEMP/evidence-gate-rehearsal-host"
          verdict="$RUNNER_TEMP/evidence-gate-rehearsal-verdict"

          python3 "$GITHUB_WORKSPACE/trusted/scripts/evidence-gate-verifier-context.py" \
            --fresh-identity "$capture/pull-request-run-identity.json" \
            --output "$identity"
          dotnet restore "$project" --locked-mode --verbosity quiet
          host_status=0
          dotnet run --no-restore --project "$project" -- run \
            --plan "$plan" --policy "$policy" \
            --repository "$capture/repository.git" --output-dir "$host" || host_status=$?
          if [[ ! -f "$host/evidence-manifest.json" ]]; then
            echo "The trusted host did not produce a bounded manifest (exit $host_status)." >&2
            exit 1
          fi
          dotnet run --no-restore --project "$project" -- verify-gate \
            --plan "$plan" --manifest "$host/evidence-manifest.json" \
            --policy "$policy" --repository "$capture/repository.git" \
            --identity "$identity" --output-dir "$verdict"

      - name: Report the unavailable authorization seams and fail closed
        if: ${{ always() }}
        shell: bash
        env:
          CONTROLLER_RESULT: ${{ needs.controller-capture.result }}
          SUBJECT_RESULT: ${{ needs.credentialless-subject.result }}
        run: |
          {
            echo '## AppSurface evidence gate pilot'
            echo ''
            echo 'This base-owned verifier scaffold is deliberately non-claiming and must not be made required.'
            echo ''
            printf '%s\n' "- Controller capture job: $CONTROLLER_RESULT"
            printf '%s\n' "- Credentialless subject job: $SUBJECT_RESULT"
            echo '- Subject handoff: controller snapshot execution is wired; the fixed result is always non-claiming.'
            echo '- Trusted verifier: the handoff is rebound to a fresh Git capture, then the current PR and subject job are reread for a non-claiming rehearsal.'
            echo '- OCI prerequisite: a digest-pinned image must already exist in the rootless local image store and contain the locked offline feed.'
            echo '- Checkout/isolation attestation: unavailable to the verdict; no trusted verifier consumes an attestation.'
            echo '- Required gate verdict: unavailable; host registrations and complete producer verification are not established.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/evidence-gate-rehearsal-verdict/evidence-gate-summary.md" ]]; then
            cat "$RUNNER_TEMP/evidence-gate-rehearsal-verdict/evidence-gate-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'ASEGH003: Non-claiming pilot scaffold. No trusted verifier or complete producer registrations are available.'
          exit 1
