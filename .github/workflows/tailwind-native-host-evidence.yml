name: Tailwind Native Host Evidence

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact frozen package version to prove.
        required: true
        type: string
      source_commit:
        description: Immutable triggering source commit.
        required: true
        type: string
      producer_artifact_id:
        description: Exact immutable producer artifact ID.
        required: true
        type: string
      expected_subject_sha256:
        description: SHA-256 of tailwind-proof-subject.json.
        required: true
        type: string
      rehearsal:
        description: Enables only the protected main-branch manual rehearsal.
        required: false
        default: false
        type: boolean
    outputs:
      producer_artifact_id:
        value: ${{ jobs.aggregate-evidence.outputs.producer_artifact_id }}
      expected_subject_sha256:
        value: ${{ jobs.aggregate-evidence.outputs.expected_subject_sha256 }}
      aggregate_artifact_id:
        value: ${{ jobs.aggregate-evidence.outputs.aggregate_artifact_id }}
      aggregate_sha256:
        value: ${{ jobs.aggregate-evidence.outputs.aggregate_sha256 }}
      native_invocation_id:
        value: ${{ jobs.aggregate-evidence.outputs.native_invocation_id }}

permissions:
  contents: read
  actions: read

jobs:
  host-matrix-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.runners.outputs.matrix }}
      valid: ${{ steps.runners.outputs.valid }}
    steps:
      - name: Validate configured native runner map
        id: runners
        env:
          CONFIGURED_RUNNERS: ${{ vars.TAILWIND_NATIVE_HOST_RUNNERS }}
          REHEARSAL: ${{ inputs.rehearsal }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RETENTION_DAYS: ${{ github.retention_days }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REHEARSAL" == true && ( "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/main || "$REPOSITORY" != forge-trust/AppSurface ) ]]; then
            echo "Manual native rehearsal is permitted only for workflow_dispatch on refs/heads/main in forge-trust/AppSurface." >&2
            exit 1
          fi
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || {
            echo "github.retention_days must be a positive decimal; the upload action enforces the repository-configured retention limit." >&2
            exit 1
          }
          expected='["linux-arm64","linux-x64","osx-arm64","osx-x64","win-x64"]'
          if [[ -z "$CONFIGURED_RUNNERS" ]]; then
            echo "TAILWIND_NATIVE_HOST_RUNNERS is absent. Configure all five native runner mappings before release evidence can run." >&2
            exit 1
          fi
          jq -e --argjson expected "$expected" '
            type == "object" and (keys | sort) == $expected and
            all(.[]; (type == "string" and length > 0) or
              (type == "array" and length > 0 and all(.[]; type == "string" and length > 0)))
          ' <<<"$CONFIGURED_RUNNERS" >/dev/null || {
            echo "TAILWIND_NATIVE_HOST_RUNNERS must map exactly the five canonical RIDs to nonempty runner labels or label arrays." >&2
            exit 1
          }
          matrix="$(jq -c --argjson binary '{"linux-x64":"tailwindcss-linux-x64","linux-arm64":"tailwindcss-linux-arm64","osx-x64":"tailwindcss-macos-x64","osx-arm64":"tailwindcss-macos-arm64","win-x64":"tailwindcss-windows-x64.exe"}' \
            '{include:[to_entries[] | {rid:.key,labels:.value,binary_name:$binary[.key]}]}' <<<"$CONFIGURED_RUNNERS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo 'valid=true' >> "$GITHUB_OUTPUT"

  native-host:
    name: Native proof (${{ matrix.rid }})
    needs: host-matrix-preflight
    if: ${{ needs.host-matrix-preflight.outputs.valid == 'true' && (!inputs.rehearsal || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'forge-trust/AppSurface')) }}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-matrix-preflight.outputs.matrix) }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      PRODUCER_ARTIFACT_ID: ${{ inputs.producer_artifact_id }}
      EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
      NATIVE_INVOCATION_ID: ${{ inputs.producer_artifact_id }}-${{ github.run_id }}-${{ github.run_attempt }}-tailwind-native
      PRODUCER_RUN_ID: ${{ github.run_id }}
      PRODUCER_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
      REHEARSAL: ${{ inputs.rehearsal }}
    steps:
      - name: Checkout triggering source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Confirm checkout is pinned to the triggering source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_COMMIT" || { echo "Checkout $actual does not match immutable source $SOURCE_COMMIT." >&2; exit 1; }

      - name: Download exact producer artifact
        id: producer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.PRODUCER_ARTIFACT_ID }}
          path: ${{ runner.temp }}/tailwind-producer

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build verifier from this source
        shell: bash
        env:
          SOURCE_REVISION_ID: ${{ env.SOURCE_COMMIT }}
        run: |
          dotnet restore tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --locked-mode
          dotnet build tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/package-index" /p:SourceRevisionId="$SOURCE_REVISION_ID"

      - name: Prove frozen producer package on native host
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          REPORT_ROOT: ${{ runner.temp }}/tailwind-host-report
          WORK_ROOT: ${{ runner.temp }}/tailwind-host-work
        run: |
          set -euo pipefail
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" verify-tailwind-consumer \
            --repo-root "$GITHUB_WORKSPACE" --mode release \
            --artifacts-input "$RUNNER_TEMP/tailwind-producer" \
            --artifact-manifest "$RUNNER_TEMP/tailwind-producer/package-artifact-manifest.json" \
            --producer-subject "$RUNNER_TEMP/tailwind-producer/tailwind-proof-subject.json" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" \
            --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --repository-id "$EXPECTED_REPOSITORY_ID" --producer-run-id "$PRODUCER_RUN_ID" \
            --source-commit "$SOURCE_COMMIT" --native-invocation-id "$NATIVE_INVOCATION_ID" \
            --expected-rid "$RID" --work-directory "$WORK_ROOT" --report-directory "$REPORT_ROOT"

      - name: Confirm mutated producer subject is rejected (manual rehearsal)
        if: ${{ inputs.rehearsal }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          REPORT_ROOT: ${{ runner.temp }}/tailwind-host-report
          WORK_ROOT: ${{ runner.temp }}/tailwind-mutation-work
          MUTATED_PRODUCER_ROOT: ${{ runner.temp }}/tailwind-producer-mutated
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/tailwind-producer" "$MUTATED_PRODUCER_ROOT"
          printf '\n' >> "$MUTATED_PRODUCER_ROOT/tailwind-proof-subject.json"
          log="$RUNNER_TEMP/tailwind-mutation-probe.log"
          if dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" verify-tailwind-consumer \
            --repo-root "$GITHUB_WORKSPACE" --mode release \
            --artifacts-input "$MUTATED_PRODUCER_ROOT" \
            --artifact-manifest "$MUTATED_PRODUCER_ROOT/package-artifact-manifest.json" \
            --producer-subject "$MUTATED_PRODUCER_ROOT/tailwind-proof-subject.json" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" \
            --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --repository-id "$EXPECTED_REPOSITORY_ID" --producer-run-id "$PRODUCER_RUN_ID" \
            --source-commit "$SOURCE_COMMIT" --native-invocation-id "$NATIVE_INVOCATION_ID" \
            --expected-rid "$RID" --work-directory "$WORK_ROOT" \
            --report-directory "$RUNNER_TEMP/tailwind-mutation-report" >"$log" 2>&1; then
            echo "Mutated producer subject unexpectedly passed typed verification." >&2
            exit 1
          fi
          if ! grep -Eqi 'subject|sha.?256|digest' "$log"; then
            cat "$log" >&2
            echo "Mutation probe failed for an unrelated reason; expected a subject integrity rejection." >&2
            exit 1
          fi
          echo "Tailwind producer subject mutation rejected on ${RID}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload host evidence (including failure diagnostics)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailwind-native-host-${{ github.run_id }}-${{ env.NATIVE_INVOCATION_ID }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/tailwind-host-report
          if-no-files-found: warn
          retention-days: ${{ github.retention_days }}

  aggregate-evidence:
    name: Validate five-host evidence transport
    needs: [host-matrix-preflight, native-host]
    if: ${{ always() && needs.host-matrix-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      producer_artifact_id: ${{ inputs.producer_artifact_id }}
      expected_subject_sha256: ${{ inputs.expected_subject_sha256 }}
      aggregate_artifact_id: ${{ steps.upload-aggregate.outputs.artifact-id }}
      aggregate_sha256: ${{ steps.aggregate.outputs.aggregate_sha256 }}
      native_invocation_id: ${{ steps.resolve.outputs.native_invocation_id }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      NATIVE_INVOCATION_ID: ${{ inputs.producer_artifact_id }}-${{ github.run_id }}-${{ github.run_attempt }}-tailwind-native
    steps:
      - name: Initialize aggregate paths
        shell: bash
        run: |
          printf '%s\n' \
            "HOST_ROOT=$RUNNER_TEMP/tailwind-hosts" \
            "PRODUCER_ROOT=$RUNNER_TEMP/tailwind-producer" \
            "AGGREGATE_ROOT=$RUNNER_TEMP/tailwind-aggregate" \
            "HOST_MAP=$RUNNER_TEMP/tailwind-host-artifacts-map.json" >> "$GITHUB_ENV"
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Resolve all current-invocation host IDs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-tailwind-release-artifacts.sh resolve-native-evidence \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --invocation "$NATIVE_INVOCATION_ID" --output "$GITHUB_OUTPUT"
          cp "$GITHUB_OUTPUT.json" "$HOST_MAP"
          echo "native_invocation_id=$NATIVE_INVOCATION_ID" >> "$GITHUB_OUTPUT"
      - name: Download linux-x64 evidence by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_linux_x64_id }}
          path: ${{ runner.temp }}/tailwind-hosts/linux-x64
      - name: Download linux-arm64 evidence by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_linux_arm64_id }}
          path: ${{ runner.temp }}/tailwind-hosts/linux-arm64
      - name: Download osx-x64 evidence by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_osx_x64_id }}
          path: ${{ runner.temp }}/tailwind-hosts/osx-x64
      - name: Download osx-arm64 evidence by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_osx_arm64_id }}
          path: ${{ runner.temp }}/tailwind-hosts/osx-arm64
      - name: Download win-x64 evidence by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_win_x64_id }}
          path: ${{ runner.temp }}/tailwind-hosts/win-x64
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore verifier from locked dependencies
        run: dotnet restore tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --locked-mode
      - name: Download exact producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.producer_artifact_id }}
          path: ${{ runner.temp }}/tailwind-producer
      - name: Build verifier
        env:
          SOURCE_REVISION_ID: ${{ env.SOURCE_COMMIT }}
        run: dotnet build tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -c Release --no-restore --output "$RUNNER_TEMP/package-index" /p:SourceRevisionId="$SOURCE_REVISION_ID"
      - name: Validate host receipts and create aggregate
        id: aggregate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" verify-tailwind-evidence \
            --repo-root "$GITHUB_WORKSPACE" --mode aggregate \
            --artifacts-input "$PRODUCER_ROOT" --artifact-manifest "$PRODUCER_ROOT/package-artifact-manifest.json" \
            --producer-subject "$PRODUCER_ROOT/tailwind-proof-subject.json" \
            --producer-artifact-id "${{ inputs.producer_artifact_id }}" \
            --expected-subject-sha256 "${{ inputs.expected_subject_sha256 }}" \
            --repository-id "$GITHUB_REPOSITORY_ID" --producer-run-id "$GITHUB_RUN_ID" \
            --source-commit "$SOURCE_COMMIT" --native-invocation-id "$NATIVE_INVOCATION_ID" \
            --evidence-input "$HOST_ROOT" --host-artifacts-map "$HOST_MAP" \
            --report-directory "$AGGREGATE_ROOT"
          digest="$(sha256sum "$AGGREGATE_ROOT/tailwind-native-aggregate.json" | awk '{print $1}')"
          echo "aggregate_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Upload aggregate and bound host evidence
        id: upload-aggregate
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailwind-native-aggregate-${{ github.run_id }}-${{ env.NATIVE_INVOCATION_ID }}
          path: ${{ runner.temp }}/tailwind-aggregate
          if-no-files-found: error
          retention-days: ${{ github.retention_days }}
