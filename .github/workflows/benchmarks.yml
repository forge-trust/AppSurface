# .github/workflows/benchmarks.yml
name: Benchmarks

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  NUGET_XMLDOC_MODE: skip
  TERM: xterm

on:
  push:
    branches: [ "main", "benchmarks" ]
    paths-ignore:
      - '**/*.gitattributes'
      - '**/*.gitignore'
      - '**/*.md'
  workflow_dispatch: {}

permissions: {}

jobs:
  run-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # for this repo
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: |
            10.0.402

      - name: Run benchmarks (JSON)
        run: |
          dotnet run --project 'benchmarks/AppSurfaceBenchmarks/AppSurfaceBenchmarks.csproj' -c Release -- --filter '*'

      - name: Publish BenchmarkDotNet artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: artifacts
          path: ./BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: error

      - name: Get repository name
        id: get-repo-name
        shell: pwsh
        run: |
          $repoName = ${env:GITHUB_REPOSITORY}.Split("/")[-1]
          "repo-name=${repoName}" >> ${env:GITHUB_OUTPUT}

      - name: Publish results
        uses: martincostello/benchmarkdotnet-results-publisher@9c523527deddd31d7e022f5db65ccdf3954d32c5 # v2.1.1
        with:
          branch: ${{ github.ref_name }}
          comment-on-threshold: true
          name: AppSurface
          output-file-path: '${{ steps.get-repo-name.outputs.repo-name }}/data.json'
          repo: '${{ github.repository_owner }}/benchmarks'
          repo-token: ${{ secrets.BENCHMARKS_TOKEN }}
