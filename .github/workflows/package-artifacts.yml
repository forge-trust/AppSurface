name: Package Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE: 15e79c1d2dfdcba5a00f3842682b7c4cc6600c2b
  CANDIDATE_BASE: 20433c7e166fa911323cbe065c8c503179462295

jobs:
  verify-candidate:
    name: Verify exact candidate (${{ matrix.scope }})
    if: github.event_name == 'workflow_dispatch' && github.repository == 'forge-trust/AppSurface' && github.ref == 'refs/heads/codex/validate-937-main-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scope: [coverage, native, packages]
    env:
      SCOPE: ${{ matrix.scope }}
    steps:
      - name: Checkout the candidate commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout and prepare disposable runner capacity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git merge-base HEAD "$CANDIDATE_BASE")" = "$CANDIDATE_BASE"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo rm -rf -- /usr/local/lib/android
          echo "EVIDENCE=$RUNNER_TEMP/exact-evidence" >> "$GITHUB_ENV"
          echo "APP_SURFACE_TEST_ARTIFACTS_DIR=$RUNNER_TEMP/docs-outline-layout-evidence" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: 10.0.402

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Verify web assets and prepare pinned Aspire CLI
        run: |
          set -euo pipefail
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:verify
          dnx --yes aspire.cli@13.6.5 -- setup --install-path "$HOME/.aspire" --non-interactive

      - name: Run and verify selected repository evidence
        run: |
          set -euo pipefail
          project=tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj
          validator=tools/ForgeTrust.AppSurface.Evidence.Validation/bin/Release/net10.0/ForgeTrust.AppSurface.Evidence.Validation.dll
          dotnet restore "$project" --locked-mode
          dotnet build "$project" -c Release --no-restore
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          dotnet "$validator" --operation local --scope "$SCOPE" --base "$CANDIDATE_BASE" --repository "$GITHUB_WORKSPACE" --dotnet "$(command -v dotnet)" --output "$EVIDENCE"
          dotnet "$validator" --operation verify --scope "$SCOPE" --policy "$EVIDENCE/local-policy.json" --changed-paths "$EVIDENCE/changed-paths.json" --plan "$EVIDENCE/plan/evidence-plan.json" --manifest "$EVIDENCE/proof/evidence-manifest.json" --artifact-root "$EVIDENCE/proof/artifacts"

      - name: Upload scoped evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-937-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE }}/source-state.json
            ${{ env.EVIDENCE }}/local-policy.json
            ${{ env.EVIDENCE }}/changed-paths.json
            ${{ env.EVIDENCE }}/changed.patch
            ${{ env.EVIDENCE }}/plan/**
            ${{ env.EVIDENCE }}/proof/evidence-manifest.json
            ${{ env.EVIDENCE }}/proof/artifacts/**
            ${{ env.EVIDENCE }}/proof/coverage/slow-test-diagnostics.json
            ${{ env.EVIDENCE }}/proof/coverage/summary.txt
            ${{ env.EVIDENCE }}/proof/package-checks/gate.log
            ${{ env.EVIDENCE }}/proof/package-checks/verify.log
            ${{ env.EVIDENCE }}/proof/package-checks/verify-packages.log
          if-no-files-found: warn
          retention-days: 7
