name: Issue 779 CSharp producer and artifact checkpoint
on:
  push:
    branches: [codex/issue779-checkpoint2-producer-20261016]
  workflow_call:
    inputs:
      measure_roots:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: issue779-csharp-checkpoint2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/checkpoint2-sdk
        with:
          dotnet-version: 10.0.401
      - name: Bind complete source and install the ordinary same-image CSharp package
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/checkpoint2-evidence"
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint2-evidence/source.json"
          export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0
          timeout --signal=KILL 180 dotnet restore Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --locked-mode --disable-parallel -p:UseSharedCompilation=false > "$RUNNER_TEMP/checkpoint2-evidence/restore.log" 2>&1
          timeout --signal=KILL 600 bash scripts/evidencehost-package-smoke.sh "$RUNNER_TEMP/checkpoint2-package-smoke" > "$RUNNER_TEMP/checkpoint2-evidence/package-smoke.log" 2>&1
          cp "$RUNNER_TEMP/checkpoint2-package-smoke/receipt.json" "$RUNNER_TEMP/checkpoint2-evidence/package-smoke.json"
          CHECKPOINT2_TOOL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tool_image"])' "$RUNNER_TEMP/checkpoint2-evidence/package-smoke.json")"
          test -s "$CHECKPOINT2_TOOL/ForgeTrust.AppSurface.Cli.dll"
          printf 'CHECKPOINT2_TOOL=%s\n' "$CHECKPOINT2_TOOL" >> "$GITHUB_ENV"
      - name: Run actual Linux source controls
        shell: bash
        run: |
          set -euo pipefail
          export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0
          timeout --signal=KILL 180 dotnet restore Evidence/ForgeTrust.AppSurface.Evidence.Supervision.Tests/ForgeTrust.AppSurface.Evidence.Supervision.Tests.csproj --locked-mode --disable-parallel > "$RUNNER_TEMP/checkpoint2-evidence/core-restore.log" 2>&1
          timeout --signal=KILL 180 dotnet test Evidence/ForgeTrust.AppSurface.Evidence.Supervision.Tests/ForgeTrust.AppSurface.Evidence.Supervision.Tests.csproj --no-restore -p:UseSharedCompilation=false --logger 'trx;LogFileName=supervision.trx' --results-directory "$RUNNER_TEMP/checkpoint2-evidence/tests" > "$RUNNER_TEMP/checkpoint2-evidence/core-test.log" 2>&1
          timeout --signal=KILL 180 dotnet restore Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj --locked-mode --disable-parallel > "$RUNNER_TEMP/checkpoint2-evidence/cli-restore.log" 2>&1
          timeout --signal=KILL 180 dotnet test Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj --no-restore -p:UseSharedCompilation=false --filter 'FullyQualifiedName~CoverageProtectedOutputRelayTests|FullyQualifiedName~EvidenceRestrictedCoverageProducerTests|FullyQualifiedName~EvidenceRestrictedCoverageFailureTests|FullyQualifiedName~EvidenceRestrictedCoverageFactoryTests' --logger 'trx;LogFileName=coverage.trx' --results-directory "$RUNNER_TEMP/checkpoint2-evidence/tests" > "$RUNNER_TEMP/checkpoint2-evidence/cli-test.log" 2>&1
      - name: Build separate same-source private retained-artifact mutation image
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180 dotnet publish Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --no-restore -c Debug --self-contained false -p:UseSharedCompilation=false -p:EvidencePrivateQualification=C2 -o "$RUNNER_TEMP/checkpoint2-tool-c2" > "$RUNNER_TEMP/checkpoint2-evidence/publish-c2.log" 2>&1
          mkdir -p "$RUNNER_TEMP/checkpoint2-tool-c2/reportgenerator/net10.0"
          cp -R "$HOME/.nuget/packages/reportgenerator/5.5.10/tools/net10.0/." "$RUNNER_TEMP/checkpoint2-tool-c2/reportgenerator/net10.0/"
      - name: Acquire only pinned subject SDK package inputs without project evaluation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 120 dotnet restore .github/issue779-checkpoint2/NuGetContentHash/NuGetContentHash.csproj --locked-mode --disable-parallel > "$RUNNER_TEMP/checkpoint2-evidence/package-hasher-restore.log" 2>&1
          timeout --signal=KILL 120 dotnet build .github/issue779-checkpoint2/NuGetContentHash/NuGetContentHash.csproj --no-restore -p:UseSharedCompilation=false -o "$RUNNER_TEMP/checkpoint2-package-hasher" > "$RUNNER_TEMP/checkpoint2-evidence/package-hasher-build.log" 2>&1
          timeout --signal=KILL 180 python3 -B .github/issue779-checkpoint2/run-native.py --hash-runtime "$(command -v dotnet)" --package-hasher "$RUNNER_TEMP/checkpoint2-package-hasher/NuGetContentHash.dll" --acquire-packages .github/issue779-checkpoint2/subject/packages.lock.json --package-cache "$CHECKPOINT2_TOOL/nuget" > "$RUNNER_TEMP/checkpoint2-evidence/package-acquisition.json"
          cp -R "$CHECKPOINT2_TOOL/nuget" "$RUNNER_TEMP/checkpoint2-tool-c2/nuget"
          export CHECKPOINT2_SDK_ROOT="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          printf 'CHECKPOINT2_SDK_ROOT=%s\n' "$CHECKPOINT2_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Install the pinned standalone root measurement collector
        if: inputs.measure_roots
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 30 python3 -B .github/issue779-checkpoint4/test_producer_roots.py > "$RUNNER_TEMP/checkpoint2-evidence/producer-roots-controls.log" 2>&1
          timeout --signal=KILL 30 python3 -B .github/issue779-checkpoint4/test_producer_retention.py >> "$RUNNER_TEMP/checkpoint2-evidence/producer-roots-controls.log" 2>&1
          timeout --signal=KILL 180 dotnet tool install coverlet.console --version 10.0.1 --tool-path "$RUNNER_TEMP/checkpoint2-coverlet" > "$RUNNER_TEMP/checkpoint2-evidence/producer-roots-install.log" 2>&1
      - name: Measure the unchanged seven controls through standard root collectors
        id: producer_measurement
        if: inputs.measure_roots
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          timeout --signal=KILL 1800 sudo --non-interactive /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 DOTNET_CLI_HOME=/tmp XDG_RUNTIME_DIR=/tmp \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" CHECKPOINT2_TOOL="$CHECKPOINT2_TOOL" CHECKPOINT2_SDK_ROOT="$CHECKPOINT2_SDK_ROOT" \
            /usr/bin/python3 -B - > "$RUNNER_TEMP/checkpoint2-evidence/native-driver.log" 2>&1 <<'PY_ROOTS'
          from pathlib import Path
          from types import SimpleNamespace
          import os
          import subprocess
          import sys
          sys.path.insert(0, '.github/issue779-checkpoint4')
          from producer_roots import BASE, SELF, collector, common
          temporary = Path(os.environ['RUNNER_TEMP'])
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          data = SimpleNamespace(tool=Path(os.environ['CHECKPOINT2_TOOL']), mutation_tool=temporary / 'checkpoint2-tool-c2',
              runtime=Path(os.environ['CHECKPOINT2_SDK_ROOT']), subject=workspace / '.github/issue779-checkpoint2/subject',
              evidence=temporary / 'checkpoint2-evidence', source=os.environ['GITHUB_SHA'], base=BASE)
          prefix = ['/usr/bin/python3', '-B', str(SELF)]
          subprocess.run([*prefix, 'bind', *common(data)], check=True)
          outer_exit = subprocess.run(collector(data, False), check=False).returncode
          finalizer = subprocess.run([*prefix, 'finalize', *common(data), '--collector-exit', str(outer_exit)], check=False)
          raise SystemExit(outer_exit if outer_exit else finalizer.returncode)
          PY_ROOTS
      - name: Execute real CSharp coverage and failure controls under systemd
        if: ${{ !inputs.measure_roots }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 1800 sudo --non-interactive /usr/bin/python3 -B .github/issue779-checkpoint2/run-native.py --tool "$CHECKPOINT2_TOOL" --mutation-tool "$RUNNER_TEMP/checkpoint2-tool-c2" --runtime "$CHECKPOINT2_SDK_ROOT" --subject "$GITHUB_WORKSPACE/.github/issue779-checkpoint2/subject" --output "$RUNNER_TEMP/checkpoint2-evidence/native" --source "$GITHUB_SHA" --base 416b30919e6c4d03b634d9d3fe558884b02f0b91 > "$RUNNER_TEMP/checkpoint2-evidence/native-driver.log" 2>&1
      - name: Preserve bounded private diagnostics after root measurement failure
        id: producer_failure
        if: always() && inputs.measure_roots && steps.producer_measurement.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 30 python3 -B .github/issue779-checkpoint4/test_producer_root_failure.py
          failure="$RUNNER_TEMP/checkpoint2-root-failure"
          timeout --signal=KILL 8 sudo --non-interactive /usr/bin/python3 -B .github/issue779-checkpoint4/producer_root_failure.py --evidence "$RUNNER_TEMP/checkpoint2-evidence" --output "$failure"
          sudo chown "$(id -u):$(id -g)" "$failure" "$failure/metadata.json" "$failure/native-driver-slices.log"
          python3 -B - "$failure" <<'PY_FAILURE'
          from pathlib import Path
          import os
          import stat
          import sys
          root = Path(sys.argv[1])
          assert stat.S_ISDIR(root.lstat().st_mode) and stat.S_IMODE(root.lstat().st_mode) == 0o700
          assert sorted(p.name for p in root.iterdir()) == ['metadata.json', 'native-driver-slices.log']
          for name, limit in [('metadata.json', 8192), ('native-driver-slices.log', 65536)]:
              path = root / name
              metadata = path.lstat()
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1 and stat.S_IMODE(metadata.st_mode) == 0o600
              assert metadata.st_uid == os.getuid() and metadata.st_gid == os.getgid() and metadata.st_size <= limit
          PY_FAILURE
      - name: Upload only the bounded private failure diagnostics
        if: always() && steps.producer_failure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-producer-root-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkpoint2-root-failure/metadata.json
            ${{ runner.temp }}/checkpoint2-root-failure/native-driver-slices.log
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Recheck complete source after execution
        if: always()
        shell: bash
        run: |
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint2-evidence/source.json" --verify
      - name: Verify bounded retention
        id: retention
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/checkpoint2-evidence"
          extra=()
          if [[ '${{ inputs.measure_roots }}' == true ]]; then extra+=(--producer-roots); fi
          python3 -B .github/issue779-checkpoint2/check-retention.py "$RUNNER_TEMP/checkpoint2-evidence" "${extra[@]}"
      - name: Retain exact private receipts and bounded logs
        if: always() && steps.retention.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-csharp-checkpoint2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint2-evidence
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
