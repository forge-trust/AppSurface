name: Issue 779 CSharp producer and artifact checkpoint
on:
  push:
    branches: [codex/issue779-checkpoint2-producer-20261016]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-checkpoint2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/checkpoint2-sdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Bind complete source and build ordinary same-image CSharp CLI
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/checkpoint2-evidence"
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint2-evidence/source.json"
          export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0
          timeout --signal=KILL 180 dotnet restore Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --locked-mode --disable-parallel -p:UseSharedCompilation=false > "$RUNNER_TEMP/checkpoint2-evidence/restore.log" 2>&1
          timeout --signal=KILL 180 dotnet publish Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj --no-restore -c Debug --self-contained false -p:UseSharedCompilation=false -o "$RUNNER_TEMP/checkpoint2-tool" > "$RUNNER_TEMP/checkpoint2-evidence/publish.log" 2>&1
          mkdir -p "$RUNNER_TEMP/checkpoint2-tool/reportgenerator/net10.0"
          cp -R "$HOME/.nuget/packages/reportgenerator/5.5.10/tools/net10.0/." "$RUNNER_TEMP/checkpoint2-tool/reportgenerator/net10.0/"
      - name: Run actual Linux source controls
        shell: bash
        run: |
          set -euo pipefail
          export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0
          timeout --signal=KILL 180 dotnet restore Evidence/ForgeTrust.AppSurface.Evidence.Supervision.Tests/ForgeTrust.AppSurface.Evidence.Supervision.Tests.csproj --locked-mode --disable-parallel > "$RUNNER_TEMP/checkpoint2-evidence/core-restore.log" 2>&1
          timeout --signal=KILL 180 dotnet test Evidence/ForgeTrust.AppSurface.Evidence.Supervision.Tests/ForgeTrust.AppSurface.Evidence.Supervision.Tests.csproj --no-restore -p:UseSharedCompilation=false --logger 'trx;LogFileName=supervision.trx' --results-directory "$RUNNER_TEMP/checkpoint2-evidence/tests" > "$RUNNER_TEMP/checkpoint2-evidence/core-test.log" 2>&1
          timeout --signal=KILL 180 dotnet restore Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj --locked-mode --disable-parallel > "$RUNNER_TEMP/checkpoint2-evidence/cli-restore.log" 2>&1
          timeout --signal=KILL 180 dotnet test Cli/ForgeTrust.AppSurface.Cli.Tests/ForgeTrust.AppSurface.Cli.Tests.csproj --no-restore -p:UseSharedCompilation=false --filter 'FullyQualifiedName~CoverageProtectedOutputRelayTests|FullyQualifiedName~EvidenceRestrictedCoverageProducerTests|FullyQualifiedName~EvidenceRestrictedCoverageFailureTests|FullyQualifiedName~EvidenceRestrictedCoverageFactoryTests' --logger 'trx;LogFileName=coverage.trx' --results-directory "$RUNNER_TEMP/checkpoint2-evidence/tests" > "$RUNNER_TEMP/checkpoint2-evidence/cli-test.log" 2>&1
      - name: Acquire only pinned subject SDK package inputs without project evaluation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180 python3 -B .github/issue779-checkpoint2/run-native.py --acquire-packages .github/issue779-checkpoint2/subject/packages.lock.json --package-cache "$RUNNER_TEMP/checkpoint2-tool/nuget" > "$RUNNER_TEMP/checkpoint2-evidence/package-acquisition.json"
          export CHECKPOINT2_SDK_ROOT="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          printf 'CHECKPOINT2_SDK_ROOT=%s\n' "$CHECKPOINT2_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Execute real CSharp coverage and failure controls under systemd
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 1800 sudo --non-interactive /usr/bin/python3 -B .github/issue779-checkpoint2/run-native.py --tool "$RUNNER_TEMP/checkpoint2-tool" --runtime "$CHECKPOINT2_SDK_ROOT" --subject "$GITHUB_WORKSPACE/.github/issue779-checkpoint2/subject" --output "$RUNNER_TEMP/checkpoint2-evidence/native" --source "$GITHUB_SHA" --base 416b30919e6c4d03b634d9d3fe558884b02f0b91 > "$RUNNER_TEMP/checkpoint2-evidence/native-driver.log" 2>&1
      - name: Recheck complete source after execution
        if: always()
        shell: bash
        run: |
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint2-evidence/source.json" --verify
      - name: Verify bounded retention
        id: retention
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/checkpoint2-evidence"
          python3 -B .github/issue779-checkpoint2/check-retention.py "$RUNNER_TEMP/checkpoint2-evidence"
      - name: Retain exact private receipts and bounded logs
        if: always() && steps.retention.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-csharp-checkpoint2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint2-evidence
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
