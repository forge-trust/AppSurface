name: package-gate.yml

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-gate-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Verify web assets
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:verify

      - name: Restore with isolated NuGet cache
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          dotnet restore ForgeTrust.AppSurface.slnx --configfile NuGet.package-gate.config

      - name: Build release packages
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          dotnet build ForgeTrust.AppSurface.slnx --configuration Release --no-restore

      - name: Validate package manifest gate
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --configuration Release --no-build -- gate

      - name: Verify generated package documentation
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --configuration Release --no-build -- verify

      - name: Verify package artifacts
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
          PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
          PACKAGE_ARTIFACTS: ${{ runner.temp }}/package-gate-artifacts
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -- \
            verify-packages \
            --package-version "${PACKAGE_VERSION}" \
            --artifacts-output "${PACKAGE_ARTIFACTS}" \
            --artifact-manifest "${PACKAGE_ARTIFACTS}/package-artifact-manifest.json" \
            --report "${PACKAGE_ARTIFACTS}/package-validation-report.md"

      - name: Upload package validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appsurface-package-gate-validation-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/package-gate-artifacts/package-validation-report.md
            ${{ runner.temp }}/package-gate-artifacts/tailwind-package-consumer-proof.md
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof.md
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof.evidence.json
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof/NuGet.tool.config
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof/consumer/NuGet.config
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof/consumer/.config/dotnet-tools.json
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof/consumer/TestResults/**
            ${{ runner.temp }}/package-gate-artifacts/coverage-cli-consumer-proof/logs/**
            ${{ runner.temp }}/package-gate-artifacts/docs-package-consumer-proof.md
            ${{ runner.temp }}/package-gate-artifacts/docs-package-consumer-proof/consumer/NuGet.config
            ${{ runner.temp }}/package-gate-artifacts/docs-package-consumer-proof/consumer/Docs.ConsumerProof.csproj
            ${{ runner.temp }}/package-gate-artifacts/docs-package-consumer-proof/consumer/packages.lock.json
            ${{ runner.temp }}/package-gate-artifacts/docs-package-consumer-proof/consumer/obj/project.assets.json
            ${{ runner.temp }}/package-gate-artifacts/docs-package-consumer-proof/logs/**
          if-no-files-found: warn
