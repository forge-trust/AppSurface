name: package-gate.yml

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-gate-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Packed Cloud Tasks isolation proof archives the pinned baseline commit.
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/appsurface-dotnet
        with:
          dotnet-version: |
            10.0.402

      - name: Build repository validation tool
        run: |
          dotnet restore tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --locked-mode
          dotnet build tools/ForgeTrust.AppSurface.Evidence.Validation/ForgeTrust.AppSurface.Evidence.Validation.csproj --configuration Release --no-restore

      - name: Collect and plan package checks
        id: plan
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/package-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          validation="$GITHUB_WORKSPACE/tools/ForgeTrust.AppSurface.Evidence.Validation/bin/Release/net10.0/ForgeTrust.AppSurface.Evidence.Validation.dll"
          dotnet "$validation" --operation collect --repository "$GITHUB_WORKSPACE" --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --workflow-sha "$GITHUB_SHA" --output "$root/changes"
          dotnet "$validation" --operation plan --scope packages --policy .github/evidence.policy.json --changed-paths "$root/changes/changed-paths.json" --output "$root/plan"
          selection="$root/plan/selection.json"
          required="$(jq -r '.requiresPackageChecks | tostring' "$selection")"
          echo "requires_package_checks=$required" >> "$GITHUB_OUTPUT"
          echo "evidence_root=$root" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: ${{ steps.plan.outputs.requires_package_checks == 'true' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.3

      - name: Setup Node.js
        if: ${{ steps.plan.outputs.requires_package_checks == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Verify web assets
        if: ${{ steps.plan.outputs.requires_package_checks == 'true' }}
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:verify

      - name: Prepare pinned Aspire CLI bundle
        if: ${{ steps.plan.outputs.requires_package_checks == 'true' }}
        run: dnx --yes aspire.cli@13.6.5 -- setup --install-path "$HOME/.aspire" --non-interactive

      - name: Run and verify scoped package evidence
        id: package-evidence
        env:
          EVIDENCE_ROOT: ${{ steps.plan.outputs.evidence_root }}
        run: |
          set -euo pipefail
          validation="tools/ForgeTrust.AppSurface.Evidence.Validation/bin/Release/net10.0/ForgeTrust.AppSurface.Evidence.Validation.dll"
          proof="$RUNNER_TEMP/package-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          dotnet "$validation" --operation run --scope packages --policy .github/evidence.policy.json --changed-paths "$EVIDENCE_ROOT/changes/changed-paths.json" --plan "$EVIDENCE_ROOT/plan/evidence-plan.json" --repository "$GITHUB_WORKSPACE" --dotnet "$(command -v dotnet)" --output "$proof"
          dotnet "$validation" --operation verify --scope packages --policy .github/evidence.policy.json --changed-paths "$EVIDENCE_ROOT/changes/changed-paths.json" --plan "$EVIDENCE_ROOT/plan/evidence-plan.json" --manifest "$proof/evidence-manifest.json" --artifact-root "$proof/artifacts"
          echo "proof=$proof" >> "$GITHUB_OUTPUT"

      - name: Upload package validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appsurface-package-gate-validation-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/package-evidence-*/evidence-summary.md
            ${{ runner.temp }}/package-evidence-*/evidence-manifest.json
            ${{ runner.temp }}/package-evidence-*/artifacts/**
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/package-validation-report.md
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/durable-template-consumer-proof.json
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/tailwind-package-consumer-proof.md
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/cloudtasks-package-consumer-proof.md
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof.md
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof.evidence.json
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof/NuGet.tool.config
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof/consumer/NuGet.config
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof/consumer/.config/dotnet-tools.json
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof/consumer/TestResults/**
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/coverage-cli-consumer-proof/logs/**
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/docs-package-consumer-proof.md
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/docs-package-consumer-proof/consumer/NuGet.config
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/docs-package-consumer-proof/consumer/Docs.ConsumerProof.csproj
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/docs-package-consumer-proof/consumer/packages.lock.json
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/docs-package-consumer-proof/consumer/obj/project.assets.json
            ${{ runner.temp }}/package-evidence-*/package-checks/artifacts/docs-package-consumer-proof/logs/**
            ${{ runner.temp }}/package-plan-*/changes/**
            ${{ runner.temp }}/package-plan-*/plan/**
          if-no-files-found: warn
