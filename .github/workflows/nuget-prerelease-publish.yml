name: NuGet Prerelease Publish

on:
  push:
    tags:
      - 'v*.*.*-*'

concurrency:
  group: nuget-prerelease-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    if: ${{ github.repository == 'forge-trust/AppSurface' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps.tag.outputs.package-version }}
      tag-commit: ${{ steps.tag.outputs.tag-commit }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate prerelease tag
        id: tag
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(preview|alpha|beta|rc)\.[1-9][0-9]*$'
          if [[ ! "${tag_name}" =~ ${tag_pattern} ]]; then
            echo "Tag '${tag_name}' must match v<major>.<minor>.<patch>-<preview|alpha|beta|rc>.<positive-number>." >&2
            exit 1
          fi

          git fetch --force origin "refs/tags/${tag_name}:refs/tags/${tag_name}"
          git cat-file -e "${GITHUB_SHA}^{commit}"
          tag_type="$(git cat-file -t "refs/tags/${tag_name}")"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "Prerelease publish requires an annotated tag. '${tag_name}' is ${tag_type}." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag '${tag_name}' resolves to ${tag_commit}, not immutable triggering commit ${GITHUB_SHA}." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag '${tag_name}' resolves to ${tag_commit}, which is not reachable from origin/main." >&2
            exit 1
          fi

          {
            echo "package-version=${tag_name#v}"
            echo "tag-commit=${tag_commit}"
          } >> "${GITHUB_OUTPUT}"

  validate-release-environment:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read

    steps:
      - name: Validate protected NuGet environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/nuget-prerelease")"; then
            echo "Environment 'nuget-prerelease' must exist before prerelease publishing can run." >&2
            exit 1
          fi

          required_reviewer_rules="$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<< "${environment_json}")"
          prevent_self_review_rules="$(jq '[.protection_rules[]? | select(.type == "required_reviewers" and .prevent_self_review == true)] | length' <<< "${environment_json}")"

          if [[ "${required_reviewer_rules}" -lt 1 ]]; then
            echo "Environment 'nuget-prerelease' must exist with required reviewers before prerelease publishing can run." >&2
            exit 1
          fi

          if [[ "${prevent_self_review_rules}" -lt 1 ]]; then
            echo "Environment 'nuget-prerelease' must prevent self-review before prerelease publishing can run." >&2
            exit 1
          fi

          if ! smoke_environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/nuget-prerelease-smoke")"; then
            echo "Environment 'nuget-prerelease-smoke' must exist before prerelease smoke install can run." >&2
            exit 1
          fi

          smoke_wait_timer_rules="$(jq '[.protection_rules[]? | select(.type == "wait_timer" and .wait_timer == 25)] | length' <<< "${smoke_environment_json}")"
          smoke_required_reviewer_rules="$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<< "${smoke_environment_json}")"

          if [[ "${smoke_wait_timer_rules}" -lt 1 ]]; then
            echo "Environment 'nuget-prerelease-smoke' must enforce a 25-minute wait timer before prerelease smoke install can run." >&2
            exit 1
          fi

          if [[ "${smoke_required_reviewer_rules}" -gt 0 ]]; then
            echo "Environment 'nuget-prerelease-smoke' must not require reviewers before prerelease smoke install can run." >&2
            exit 1
          fi

  native-host-evidence:
    needs:
      - validate-tag
      - validate-source-ci
      - pack-and-verify
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/tailwind-native-host-evidence.yml
    with:
      package_version: ${{ needs.validate-tag.outputs.package-version }}
      source_commit: ${{ needs.validate-tag.outputs.tag-commit }}
      producer_artifact_id: ${{ needs.pack-and-verify.outputs.producer_artifact_id }}
      expected_subject_sha256: ${{ needs.pack-and-verify.outputs.expected_subject_sha256 }}

  validate-source-ci:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate source workflows succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.validate-tag.outputs.tag-commit }}
        run: |
          set -euo pipefail

          for workflow in build.yml package-gate.yml; do
            run_url="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "${workflow}" \
              --branch main \
              --commit "${TAG_COMMIT}" \
              --json conclusion,status,url \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].url // ""')"

            if [[ -z "${run_url}" ]]; then
              echo "Required workflow '${workflow}' has no successful completed run for ${TAG_COMMIT} on main." >&2
              exit 1
            fi

            echo "Validated ${workflow}: ${run_url}"
          done

  pack-and-verify:
    name: pack-and-verify
    needs:
      - validate-tag
      - validate-source-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      producer_artifact_id: ${{ steps.binding.outputs.producer_artifact_id }}
      expected_subject_sha256: ${{ steps.binding.outputs.expected_subject_sha256 }}

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag-commit }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build source-stamped PackageIndex verifier
        env:
          SOURCE_REVISION_ID: ${{ needs.validate-tag.outputs.tag-commit }}
        run: |
          dotnet restore tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --locked-mode
          dotnet build tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -c Release --no-restore --output "$RUNNER_TEMP/package-index" /p:SourceRevisionId="$SOURCE_REVISION_ID"

      - name: Resolve frozen producer bundle by exact run-scoped name
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-tailwind-release-artifacts.sh resolve-producer \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --name "appsurface-prerelease-packages-$GITHUB_RUN_ID" --output "$GITHUB_OUTPUT"

      - name: Download recovered producer by immutable ID
        if: ${{ steps.recovery.outputs.producer_found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.recovery.outputs.producer_artifact_id }}
          path: ${{ runner.temp }}/package-artifacts

      - name: Setup pnpm
        if: ${{ steps.recovery.outputs.producer_found != 'true' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3

      - name: Setup Node.js
        if: ${{ steps.recovery.outputs.producer_found != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify web assets
        if: ${{ steps.recovery.outputs.producer_found != 'true' }}
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:verify

      - name: Verify package artifacts
        if: ${{ steps.recovery.outputs.producer_found != 'true' }}
        env:
          PACKAGE_VERSION: ${{ needs.validate-tag.outputs.package-version }}
          PACKAGE_ARTIFACTS: ${{ runner.temp }}/package-artifacts
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ needs.validate-tag.outputs.tag-commit }}
        run: |
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" \
            verify-packages \
            --package-version "${PACKAGE_VERSION}" \
            --artifacts-output "${PACKAGE_ARTIFACTS}" \
            --artifact-manifest "${PACKAGE_ARTIFACTS}/package-artifact-manifest.json" \
            --report "${PACKAGE_ARTIFACTS}/package-validation-report.md" \
            --repository-id "$REPOSITORY_ID" --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-attempt "$PRODUCER_ATTEMPT" --source-commit "$SOURCE_COMMIT"

      - name: Upload frozen producer bundle
        id: upload-producer
        if: ${{ success() && steps.recovery.outputs.producer_found != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appsurface-prerelease-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/package-artifacts
          if-no-files-found: error
          retention-days: ${{ github.retention_days }}

      - name: Re-emit frozen producer binding
        id: binding
        env:
          RECOVERED_ID: ${{ steps.recovery.outputs.producer_artifact_id }}
          UPLOADED_ID: ${{ steps.upload-producer.outputs.artifact-id }}
          PACKAGE_ARTIFACTS: ${{ runner.temp }}/package-artifacts
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ needs.validate-tag.outputs.tag-commit }}
          BINDING_REPORT_DIRECTORY: ${{ runner.temp }}/tailwind-producer-binding-report
          RESOLVED_BINDING: ${{ runner.temp }}/tailwind-resolved-producer-binding.json
        shell: bash
        run: |
          set -euo pipefail
          producer_id="$RECOVERED_ID"
          [[ -n "$producer_id" ]] || producer_id="$UPLOADED_ID"
          [[ "$producer_id" =~ ^[1-9][0-9]*$ ]]
          subject="$PACKAGE_ARTIFACTS/tailwind-proof-subject.json"
          [[ -f "$subject" ]]
          subject_sha256="$(sha256sum "$subject" | awk '{print $1}')"
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" verify-tailwind-evidence \
            --repo-root "$GITHUB_WORKSPACE" --mode producer-binding \
            --artifacts-input "$PACKAGE_ARTIFACTS" \
            --artifact-manifest "$PACKAGE_ARTIFACTS/package-artifact-manifest.json" \
            --producer-subject "$subject" --producer-artifact-id "$producer_id" \
            --expected-subject-sha256 "$subject_sha256" --repository-id "$REPOSITORY_ID" \
            --producer-run-id "$PRODUCER_RUN_ID" --source-commit "$SOURCE_COMMIT" \
            --report-directory "$BINDING_REPORT_DIRECTORY" --resolved-binding-output "$RESOLVED_BINDING"
          jq -e --arg repository "$REPOSITORY_ID" --arg run "$PRODUCER_RUN_ID" \
            --arg source "$SOURCE_COMMIT" --arg artifact "$producer_id" --arg subject "$subject_sha256" \
            '.schema == "appsurface-tailwind-resolved-producer-binding-v1" and
             .repositoryId == $repository and .producerRunId == $run and
             .sourceCommit == $source and .producerArtifactId == $artifact and
             .subjectSha256 == $subject and
             (.producerAttempt | type == "string" and test("^[1-9][0-9]*$"))' "$RESOLVED_BINDING" >/dev/null
          echo "producer_artifact_id=$(jq -er '.producerArtifactId' "$RESOLVED_BINDING")" >> "$GITHUB_OUTPUT"
          echo "expected_subject_sha256=$(jq -er '.subjectSha256' "$RESOLVED_BINDING")" >> "$GITHUB_OUTPUT"

      - name: Upload package validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appsurface-prerelease-validation-diagnostics-${{ needs.validate-tag.outputs.package-version }}
          path: |
            ${{ runner.temp }}/package-artifacts/package-validation-report.md
            ${{ runner.temp }}/package-artifacts/tailwind-package-consumer-proof.md
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof.md
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof.evidence.json
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof/NuGet.tool.config
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof/consumer/NuGet.config
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof/consumer/.config/dotnet-tools.json
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof/consumer/TestResults/**
            ${{ runner.temp }}/package-artifacts/coverage-cli-consumer-proof/logs/**
            ${{ runner.temp }}/package-artifacts/docs-package-consumer-proof.md
            ${{ runner.temp }}/package-artifacts/docs-package-consumer-proof/consumer/NuGet.config
            ${{ runner.temp }}/package-artifacts/docs-package-consumer-proof/consumer/Docs.ConsumerProof.csproj
            ${{ runner.temp }}/package-artifacts/docs-package-consumer-proof/consumer/packages.lock.json
            ${{ runner.temp }}/package-artifacts/docs-package-consumer-proof/consumer/obj/project.assets.json
            ${{ runner.temp }}/package-artifacts/docs-package-consumer-proof/logs/**
          if-no-files-found: warn


  publish-nuget:
    name: publish-nuget
    needs:
      - validate-tag
      - validate-release-environment
      - native-host-evidence
      - pack-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: nuget-prerelease
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.validate-tag.outputs.tag-commit }}
      REPOSITORY_ID: ${{ github.repository_id }}
      PRODUCER_RUN_ID: ${{ github.run_id }}
      PRODUCER_ARTIFACT_ID: ${{ needs.pack-and-verify.outputs.producer_artifact_id }}
      EXPECTED_SUBJECT_SHA256: ${{ needs.pack-and-verify.outputs.expected_subject_sha256 }}
      CURRENT_AGGREGATE_ARTIFACT_ID: ${{ needs.native-host-evidence.outputs.aggregate_artifact_id }}
      CURRENT_AGGREGATE_SHA256: ${{ needs.native-host-evidence.outputs.aggregate_sha256 }}
      CURRENT_NATIVE_INVOCATION_ID: ${{ needs.native-host-evidence.outputs.native_invocation_id }}

    steps:
      - name: Initialize publication paths
        shell: bash
        run: |
          printf '%s\n' \
            "PACKAGE_ARTIFACTS=$RUNNER_TEMP/package-artifacts" \
            "AGGREGATE_DIRECTORY=$RUNNER_TEMP/tailwind-aggregate" \
            "RECOVERED_START_DIRECTORY=$RUNNER_TEMP/recovered-publication-start" \
            "PREFLIGHT_REPORT_DIRECTORY=$RUNNER_TEMP/tailwind-publish-preflight-report" \
            "PUBLICATION_DIRECTORY=$RUNNER_TEMP/tailwind-publication" >> "$GITHUB_ENV"
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag-commit }}

      - name: Resolve original publication-start artifact
        id: start-recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-tailwind-release-artifacts.sh resolve-publication \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --name "publication-start-$GITHUB_RUN_ID" --output "$GITHUB_OUTPUT"

      - name: Download recovered publication-start by immutable ID
        if: ${{ steps.start-recovery.outputs.publication_found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.start-recovery.outputs.publication_artifact_id }}
          path: ${{ runner.temp }}/recovered-publication-start

      - name: Select original producer and aggregate binding
        id: candidate
        env:
          RECOVERED: ${{ steps.start-recovery.outputs.publication_found }}
          RECOVERED_START_ID: ${{ steps.start-recovery.outputs.publication_artifact_id }}
          START_RECEIPT: ${{ runner.temp }}/recovered-publication-start/publication-start-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RECOVERED" == true ]]; then
            [[ -f "$START_RECEIPT" ]]
            python3 - "$START_RECEIPT" <<'PY'
          import json
          import pathlib
          import sys

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          with pathlib.Path(sys.argv[1]).open("r", encoding="utf-8") as stream:
              value = json.load(stream, object_pairs_hook=reject_duplicate_keys)
          if not isinstance(value, dict):
              raise ValueError("publication-start receipt root must be a JSON object")
          PY
            jq -e --arg producer "$PRODUCER_ARTIFACT_ID" \
              '.producerArtifactId == $producer and (.producerArtifactId | type == "string" and test("^[1-9][0-9]*$"))' "$START_RECEIPT" >/dev/null
            aggregate_id="$(jq -er 'select(.aggregateArtifactId | type == "string" and test("^[1-9][0-9]*$")) | .aggregateArtifactId' "$START_RECEIPT")"
            aggregate_sha="$(jq -er '.aggregateSha256' "$START_RECEIPT")"
            invocation="$(jq -er '.nativeInvocationId' "$START_RECEIPT")"
            [[ "$aggregate_id" =~ ^[1-9][0-9]*$ && "$aggregate_sha" =~ ^[0-9a-f]{64}$ ]]
            [[ "$RECOVERED_START_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            echo "start_receipt_path=$START_RECEIPT" >> "$GITHUB_OUTPUT"
            echo "start_artifact_id=$RECOVERED_START_ID" >> "$GITHUB_OUTPUT"
          else
            aggregate_id="$CURRENT_AGGREGATE_ARTIFACT_ID"
            aggregate_sha="$CURRENT_AGGREGATE_SHA256"
            invocation="$CURRENT_NATIVE_INVOCATION_ID"
            [[ "$aggregate_id" =~ ^[1-9][0-9]*$ && "$aggregate_sha" =~ ^[0-9a-f]{64}$ && -n "$invocation" ]]
            echo "start_receipt_path=$PREFLIGHT_REPORT_DIRECTORY/publication-start-receipt.json" >> "$GITHUB_OUTPUT"
          fi
          echo "aggregate_artifact_id=$aggregate_id" >> "$GITHUB_OUTPUT"
          echo "expected_aggregate_sha256=$aggregate_sha" >> "$GITHUB_OUTPUT"
          echo "native_invocation_id=$invocation" >> "$GITHUB_OUTPUT"

      - name: Download frozen producer bundle by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.PRODUCER_ARTIFACT_ID }}
          path: ${{ runner.temp }}/package-artifacts

      - name: Download original aggregate by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.aggregate_artifact_id }}
          path: ${{ runner.temp }}/tailwind-aggregate

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore verifier from locked dependencies
        run: dotnet restore tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj --locked-mode

      - name: Build source-stamped verifier
        env:
          SOURCE_REVISION_ID: ${{ env.SOURCE_COMMIT }}
        run: dotnet build tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -c Release --no-restore --output "$RUNNER_TEMP/package-index" /p:SourceRevisionId="$SOURCE_REVISION_ID"

      - name: Validate evidence and prepare publication inputs
        shell: bash
        env:
          AGGREGATE_ARTIFACT_ID: ${{ steps.candidate.outputs.aggregate_artifact_id }}
          EXPECTED_AGGREGATE_SHA256: ${{ steps.candidate.outputs.expected_aggregate_sha256 }}
          PREFLIGHT_OUTPUT_DIRECTORY: ${{ steps.start-recovery.outputs.publication_found == 'true' && format('{0}/tailwind-recovery-validation-report', runner.temp) || env.PREFLIGHT_REPORT_DIRECTORY }}
        run: |
          set -euo pipefail
          bundle_args=(--repo-root "$GITHUB_WORKSPACE" --artifacts-input "$PACKAGE_ARTIFACTS" \
            --artifact-manifest "$PACKAGE_ARTIFACTS/package-artifact-manifest.json" \
            --producer-subject "$PACKAGE_ARTIFACTS/tailwind-proof-subject.json" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --repository-id "$REPOSITORY_ID" --producer-run-id "$PRODUCER_RUN_ID" --source-commit "$SOURCE_COMMIT")
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" verify-tailwind-evidence \
            "${bundle_args[@]}" --mode publish-preflight \
            --aggregate-input "$AGGREGATE_DIRECTORY" --aggregate-artifact-id "$AGGREGATE_ARTIFACT_ID" \
            --expected-aggregate-sha256 "$EXPECTED_AGGREGATE_SHA256" \
            --publication-directory "$PUBLICATION_DIRECTORY" --report-directory "$PREFLIGHT_OUTPUT_DIRECTORY"

      - name: Upload publication-start receipt
        id: upload-start
        if: ${{ success() && steps.start-recovery.outputs.publication_found != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-start-${{ github.run_id }}
          path: ${{ runner.temp }}/tailwind-publish-preflight-report/publication-start-receipt.json
          if-no-files-found: error
          retention-days: ${{ github.retention_days }}

      - name: Resolve authoritative publication receipt
        id: start-binding
        env:
          RECOVERED_ID: ${{ steps.start-recovery.outputs.publication_artifact_id }}
          UPLOADED_ID: ${{ steps.upload-start.outputs.artifact-id }}
          RECOVERED: ${{ steps.start-recovery.outputs.publication_found }}
          FRESH_RECEIPT: ${{ runner.temp }}/tailwind-publish-preflight-report/publication-start-receipt.json
          RECOVERED_RECEIPT: ${{ runner.temp }}/recovered-publication-start/publication-start-receipt.json
        run: |
          set -euo pipefail
          start_id="$RECOVERED_ID"
          receipt="$RECOVERED_RECEIPT"
          if [[ "$RECOVERED" != true ]]; then start_id="$UPLOADED_ID"; receipt="$FRESH_RECEIPT"; fi
          [[ "$start_id" =~ ^[1-9][0-9]*$ && -f "$receipt" ]]
          echo "artifact_id=$start_id" >> "$GITHUB_OUTPUT"
          echo "receipt_path=$receipt" >> "$GITHUB_OUTPUT"

      - name: Download authoritative publication-start by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.start-binding.outputs.artifact_id }}
          path: ${{ runner.temp }}/authoritative-publication-start

      - name: Validate uploaded publication-start before requesting credentials
        env:
          START_ARTIFACT_ID: ${{ steps.start-binding.outputs.artifact_id }}
          START_RECEIPT_PATH: ${{ runner.temp }}/authoritative-publication-start/publication-start-receipt.json
          AGGREGATE_ARTIFACT_ID: ${{ steps.candidate.outputs.aggregate_artifact_id }}
          EXPECTED_AGGREGATE_SHA256: ${{ steps.candidate.outputs.expected_aggregate_sha256 }}
          VALIDATION_REPORT_DIRECTORY: ${{ runner.temp }}/tailwind-start-validation-report
        shell: bash
        run: |
          set -euo pipefail
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" verify-tailwind-evidence \
            --mode validate-publication-start --repo-root "$GITHUB_WORKSPACE" \
            --artifacts-input "$PACKAGE_ARTIFACTS" \
            --artifact-manifest "$PACKAGE_ARTIFACTS/package-artifact-manifest.json" \
            --producer-subject "$PACKAGE_ARTIFACTS/tailwind-proof-subject.json" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --repository-id "$REPOSITORY_ID" --producer-run-id "$PRODUCER_RUN_ID" --source-commit "$SOURCE_COMMIT" \
            --aggregate-input "$AGGREGATE_DIRECTORY" --aggregate-artifact-id "$AGGREGATE_ARTIFACT_ID" \
            --expected-aggregate-sha256 "$EXPECTED_AGGREGATE_SHA256" \
            --publication-directory "$PUBLICATION_DIRECTORY" --publication-start-receipt "$START_RECEIPT_PATH" \
            --publication-start-artifact-id "$START_ARTIFACT_ID" --report-directory "$VALIDATION_REPORT_DIRECTORY"

      - name: Validate NuGet trusted publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail

          if [[ -z "${NUGET_USER}" ]]; then
            echo "Environment or repository variable 'NUGET_USER' must contain the nuget.org profile name used by the trusted publishing policy." >&2
            exit 1
          fi

      - name: Request NuGet trusted publishing token
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          START_ARTIFACT_ID: ${{ steps.start-binding.outputs.artifact_id }}
          START_RECEIPT_PATH: ${{ runner.temp }}/authoritative-publication-start/publication-start-receipt.json
          AGGREGATE_ARTIFACT_ID: ${{ steps.candidate.outputs.aggregate_artifact_id }}
          EXPECTED_AGGREGATE_SHA256: ${{ steps.candidate.outputs.expected_aggregate_sha256 }}
          PUBLISH_REPORT_DIRECTORY: ${{ runner.temp }}/tailwind-publish-report
        run: |
          set -euo pipefail
          bundle_args=(--repo-root "$GITHUB_WORKSPACE" --artifacts-input "$PACKAGE_ARTIFACTS" \
            --artifact-manifest "$PACKAGE_ARTIFACTS/package-artifact-manifest.json" \
            --producer-subject "$PACKAGE_ARTIFACTS/tailwind-proof-subject.json" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --repository-id "$REPOSITORY_ID" --producer-run-id "$PRODUCER_RUN_ID" --source-commit "$SOURCE_COMMIT")
          aggregate_args=(--aggregate-input "$AGGREGATE_DIRECTORY" --aggregate-artifact-id "$AGGREGATE_ARTIFACT_ID" \
            --expected-aggregate-sha256 "$EXPECTED_AGGREGATE_SHA256")
          dotnet "$RUNNER_TEMP/package-index/ForgeTrust.AppSurface.PackageIndex.dll" publish-prerelease \
            "${bundle_args[@]}" "${aggregate_args[@]}" --publication-directory "$PUBLICATION_DIRECTORY" \
            --publication-start-receipt "$START_RECEIPT_PATH" --publication-start-artifact-id "$START_ARTIFACT_ID" \
            --publish-log "$PACKAGE_ARTIFACTS/package-publish-log.md" --report-directory "$PUBLISH_REPORT_DIRECTORY" \
            --api-key-env NUGET_API_KEY

      - name: Upload publish ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appsurface-prerelease-publish-log-${{ needs.validate-tag.outputs.package-version }}
          path: ${{ runner.temp }}/package-artifacts/package-publish-log.md
          if-no-files-found: warn
          retention-days: ${{ github.retention_days }}

  smoke-install:
    needs:
      - validate-tag
      - pack-and-verify
      - publish-nuget
    runs-on: ubuntu-latest
    environment:
      name: nuget-prerelease-smoke
      deployment: false
    timeout-minutes: 70

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag-commit }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Download validated package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack-and-verify.outputs.producer_artifact_id }}
          path: ${{ runner.temp }}/package-artifacts

      - name: Smoke install published packages
        env:
          PACKAGE_ARTIFACTS: ${{ runner.temp }}/package-artifacts
          SMOKE_WORK_DIR: ${{ runner.temp }}/package-smoke
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -- \
            smoke-install \
            --artifact-manifest "${PACKAGE_ARTIFACTS}/package-artifact-manifest.json" \
            --smoke-work-dir "${SMOKE_WORK_DIR}" \
            --smoke-report "${SMOKE_WORK_DIR}/package-smoke-report.md"

      - name: Upload smoke install report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appsurface-prerelease-smoke-${{ needs.validate-tag.outputs.package-version }}
          path: ${{ runner.temp }}/package-smoke/package-smoke-report.md
          if-no-files-found: warn
