name: C# candidate FDD build prerequisite (proposal)
on:
  push:
    branches: [codex/issue779-csharp-linux-build-20261006]
permissions:
  contents: read
concurrency:
  group: issue779-csharp-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Main must promote the reviewed assembled harness before pushing it.
      BUILD_REVIEWED: 'true'
      BUILD_SCRIPT_SHA256: 2596bbe581476edef608a9efe89fd6ab85ac04cda2b7103304a355719f9e79ca
    steps:
      - name: Promotion gate
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_REVIEWED" = true
          [[ "$BUILD_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Unprivileged normal CLI FDD build and inventories
        shell: bash
        run: |
          set -euo pipefail
          script=.github/issue779-csharp-build/build-fdd.sh
          printf '%s  %s\n' "$BUILD_SCRIPT_SHA256" "$script" | sha256sum --check --strict
          bash "$script" --execute "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/issue779-csharp-build" \
            "$GITHUB_WORKSPACE/.github/issue779-csharp-build/capture-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue779-csharp-build-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/issue779-csharp-build/receipts/
            ${{ runner.temp }}/issue779-csharp-build/handoff/
