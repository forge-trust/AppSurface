name: EvidenceHost CSharp runtime cutover and coverage

on:
  push:
    branches: [codex/issue779-checkpoint4-cutover-20261018]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidencehost-csharp-cutover-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  protected-parent-controls:
    name: Protected parent transport and semantic controls (no admission)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select the fresh parent-control SDK directory on the runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'DOTNET_INSTALL_DIR=%s/evidencehost-parent-controls-dotnet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Bind current source and test closed parent transport without API access
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/protected-parent-controls"
          mkdir -m 0700 "$evidence"
          printf 'PARENT_CONTROL_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$evidence/source.json"
          (cd .github/issue779-protected-consumer && timeout --signal=KILL 60 python3 -B -m unittest -v test_provenance test_github_parent test_dispatch test_entrypoint) > "$evidence/transport-controls.log" 2>&1
      - name: Compile the ordinary semantic consumer and exercise the actual fixed child
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          project=.github/issue779-protected-consumer/semantic-gate/ProtectedParentGate.csproj
          timeout --signal=KILL 120 dotnet restore "$project" --locked-mode --disable-parallel -warnaserror > "$PARENT_CONTROL_EVIDENCE/build.log" 2>&1
          timeout --signal=KILL 120 dotnet build "$project" -c Release --no-restore -m:1 -nr:false -p:UseSharedCompilation=false -warnaserror >> "$PARENT_CONTROL_EVIDENCE/build.log" 2>&1
          host="$(readlink -f "$(command -v dotnet)")"
          timeout --signal=KILL 90 python3 -B .github/issue779-protected-consumer/test_semantic_gate.py --dotnet "$host" --consumer "$GITHUB_WORKSPACE/.github/issue779-protected-consumer/semantic-gate/bin/Release/net10.0/EvidenceHost.ProtectedParentGate.dll" > "$PARENT_CONTROL_EVIDENCE/semantic-controls.log" 2>&1
          (cd .github/issue779-protected-consumer && ISSUE779_PARENT_TEST_DOTNET="$host" timeout --signal=KILL 30 python3 -B -m unittest -v test_dispatch_semantic) > "$PARENT_CONTROL_EVIDENCE/dispatch-semantic-controls.log" 2>&1
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$PARENT_CONTROL_EVIDENCE/source.json" --verify
      - name: Retain bounded parent control logs without protected-acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-protected-parent-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protected-parent-controls
          retention-days: 7
          include-hidden-files: true

  worker-controls:
    name: All sixteen current CSharp worker controls
    uses: ./.github/workflows/issue779-checkpoint1-worker.yml

  packaged-producer:
    name: Packaged CSharp CLI producer and artifact custody
    needs: account-rollback
    uses: ./.github/workflows/issue779-checkpoint2-producer.yml
    with:
      measure_roots: true
      prior_artifact_name: ${{ needs.account-rollback.outputs.artifact_name }}

  application-consumers:
    name: CSharp CLI and SDK application consumers
    uses: ./.github/workflows/issue779-checkpoint3-application.yml

  account-creation:
    name: Genuine account creation with the successful C3 measurement
    needs: application-consumers
    uses: ./.github/workflows/issue779-checkpoint4-accounts.yml
    with:
      variant: C4Accounts
      prior_kind: c3
      prior_artifact_name: issue779-checkpoint3-application-${{ github.run_id }}-${{ github.run_attempt }}

  account-rollback:
    name: Genuine reserved rollback with the successful account measurement
    needs: account-creation
    uses: ./.github/workflows/issue779-checkpoint4-accounts.yml
    with:
      variant: C4AccountRollback
      prior_kind: accounts
      prior_artifact_name: ${{ needs.account-creation.outputs.artifact_name }}

  worker-measurement-none:
    name: Standard root measurement for current C1 None
    needs: packaged-producer
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "None"
      prior_artifact_name: issue779-csharp-checkpoint2-${{ github.run_id }}-${{ github.run_attempt }}

  worker-measurement-n04:
    name: Standard root measurement for current C1 N04
    needs: worker-measurement-none
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N04"
      prior_artifact_name: ${{ needs.worker-measurement-none.outputs.artifact_name }}

  worker-measurement-n05:
    name: Standard root measurement for current C1 N05
    needs: worker-measurement-n04
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N05"
      prior_artifact_name: ${{ needs.worker-measurement-n04.outputs.artifact_name }}

  worker-measurement-n06:
    name: Standard root measurement for current C1 N06
    needs: worker-measurement-n05
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N06"
      prior_artifact_name: ${{ needs.worker-measurement-n05.outputs.artifact_name }}

  worker-measurement-n07:
    name: Standard root measurement for current C1 N07
    needs: worker-measurement-n06
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N07"
      prior_artifact_name: ${{ needs.worker-measurement-n06.outputs.artifact_name }}

  worker-measurement-n08:
    name: Standard root measurement for current C1 N08
    needs: worker-measurement-n07
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N08"
      prior_artifact_name: ${{ needs.worker-measurement-n07.outputs.artifact_name }}

  worker-measurement-n09:
    name: Standard root measurement for current C1 N09
    needs: worker-measurement-n08
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N09"
      prior_artifact_name: ${{ needs.worker-measurement-n08.outputs.artifact_name }}

  worker-measurement-n10:
    name: Standard root measurement for current C1 N10
    needs: worker-measurement-n09
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N10"
      prior_artifact_name: ${{ needs.worker-measurement-n09.outputs.artifact_name }}

  worker-measurement-n11:
    name: Standard root measurement for current C1 N11
    needs: worker-measurement-n10
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N11"
      prior_artifact_name: ${{ needs.worker-measurement-n10.outputs.artifact_name }}

  worker-measurement-n12:
    name: Standard root measurement for current C1 N12
    needs: worker-measurement-n11
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N12"
      prior_artifact_name: ${{ needs.worker-measurement-n11.outputs.artifact_name }}

  worker-measurement-n13:
    name: Standard root measurement for current C1 N13
    needs: worker-measurement-n12
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N13"
      prior_artifact_name: ${{ needs.worker-measurement-n12.outputs.artifact_name }}

  worker-measurement-n14:
    name: Standard root measurement for current C1 N14
    needs: worker-measurement-n13
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N14"
      prior_artifact_name: ${{ needs.worker-measurement-n13.outputs.artifact_name }}

  worker-measurement-n15:
    name: Standard root measurement for current C1 N15
    needs: worker-measurement-n14
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N15"
      prior_artifact_name: ${{ needs.worker-measurement-n14.outputs.artifact_name }}

  worker-measurement-n16:
    name: Standard root measurement for current C1 N16
    needs: worker-measurement-n15
    uses: ./.github/workflows/issue779-checkpoint1-measurement.yml
    with:
      selector: "N16"
      prior_artifact_name: ${{ needs.worker-measurement-n15.outputs.artifact_name }}

  solution-coverage:
    name: Unchanged solution and codecov patch gates
    needs: [protected-parent-controls, worker-controls, application-consumers, account-creation, account-rollback, packaged-producer, worker-measurement-none, worker-measurement-n04, worker-measurement-n05, worker-measurement-n06, worker-measurement-n07, worker-measurement-n08, worker-measurement-n09, worker-measurement-n10, worker-measurement-n11, worker-measurement-n12, worker-measurement-n13, worker-measurement-n14, worker-measurement-n15, worker-measurement-n16]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      COVERAGE_GATE_DIFF_BASE: "1991280e8af049db592ebcb705cbf66f4b4c6e8b"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Bind source and verify retired runtime is absent
        run: |
          set -euo pipefail
          umask 077
          printf 'NUGET_PACKAGES=%s/checkpoint4-nuget\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -m 0700 "$RUNNER_TEMP/checkpoint4-evidence"
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint4-evidence/source.json"
          python3 -B .github/issue779-checkpoint4/verify-cutover.py
          python3 -B .github/issue779-checkpoint4/test_cutover.py
          test "$(git rev-parse "$COVERAGE_GATE_DIFF_BASE^{commit}")" = "$COVERAGE_GATE_DIFF_BASE"
          git merge-base --is-ancestor "$COVERAGE_GATE_DIFF_BASE" "$GITHUB_SHA"
          git rev-parse "$COVERAGE_GATE_DIFF_BASE" > "$RUNNER_TEMP/checkpoint4-evidence/comparison-base.txt"
      - name: Download current native measurement from the successful application lane
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue779-checkpoint3-application-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint4-native-input
      - name: Download the successful account creation lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.account-creation.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-account-creation-input
      - name: Download the successful account rollback lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.account-rollback.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-account-rollback-input
      - name: Download the successful packaged producer root measurement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue779-csharp-checkpoint2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint4-producer-input
      - name: Download current worker measurement segment None
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-none.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/None
      - name: Download current worker measurement segment N04
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n04.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N04
      - name: Download current worker measurement segment N05
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n05.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N05
      - name: Download current worker measurement segment N06
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n06.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N06
      - name: Download current worker measurement segment N07
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n07.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N07
      - name: Download current worker measurement segment N08
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n08.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N08
      - name: Download current worker measurement segment N09
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n09.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N09
      - name: Download current worker measurement segment N10
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n10.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N10
      - name: Download current worker measurement segment N11
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n11.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N11
      - name: Download current worker measurement segment N12
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n12.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N12
      - name: Download current worker measurement segment N13
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n13.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N13
      - name: Download current worker measurement segment N14
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n14.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N14
      - name: Download current worker measurement segment N15
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n15.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N15
      - name: Download current worker measurement segment N16
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.worker-measurement-n16.outputs.artifact_name }}
          path: ${{ runner.temp }}/checkpoint4-worker-measurement-input/N16
      - name: Stage only fixed source-bound native measurement inputs
        run: |
          set -euo pipefail
          umask 077
          mkdir -p TestResults/issue779-native-measurement
          cp "$RUNNER_TEMP/checkpoint4-native-input/measurement-binding.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-supervision.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-sdk.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-sdk-failure.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native/sdk-test-failure.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/source.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native/native-receipt.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/root-file-tests/root-files.trx" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/root-supplement-tests/root-supplement.trx" TestResults/issue779-native-measurement/
          # Preserve the original C3 report/binding for NativeMeasurementTests.
          # The parent-owned account validator must validate both staged lineage directories.
          for variant in creation rollback; do
            destination="TestResults/issue779-native-measurement/accounts-$variant"
            mkdir -m 0700 "$destination"
            for name in source.json measurement-binding.json native-accounts.json native-accounts-receipt.json; do
              cp "$RUNNER_TEMP/checkpoint4-account-$variant-input/$name" "$destination/$name"
            done
          done
          destination=TestResults/issue779-native-measurement/producer-roots
          mkdir -m 0700 "$destination"
          for name in source.json producer-roots-binding.json native-producer-roots.json native-producer-roots-c2.json; do
            cp "$RUNNER_TEMP/checkpoint4-producer-input/$name" "$destination/$name"
          done
          cp "$RUNNER_TEMP/checkpoint4-producer-input/native/native-receipt.json" "$destination/native-receipt.json"
          python3 -B - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('TestResults/issue779-native-measurement').resolve()
          settings = ET.Element('RunSettings')
          collector = ET.SubElement(ET.SubElement(ET.SubElement(settings, 'DataCollectionRunSettings'), 'DataCollectors'), 'DataCollector', friendlyName='XPlat Code Coverage')
          configuration = ET.SubElement(collector, 'Configuration')
          # Only this fixed source-owned data verifier can select the completed current
          # standard report. Original C3/accounts/C2 inputs remain separate for their tests.
          import os, sys, time
          sys.path.insert(0, str(Path('.github/issue779-checkpoint1').resolve()))
          import binding
          from measurement_chain import validate_final
          source_raw = (root / 'source.json').read_bytes()
          capture = binding.validate_capture(binding.decode(source_raw), os.environ['GITHUB_SHA'])
          binding.verify_source(capture, Path.cwd(), deadline=time.monotonic() + 120)
          segments = Path(os.environ['RUNNER_TEMP']) / 'checkpoint4-worker-measurement-input'
          final_report = validate_final(source_raw, segments,
              'github-actions-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
              deadline=time.monotonic() + 120)
          # The first chain report must be the exact producer report already staged above.
          prior_sha = binding.digest((root / 'producer-roots/native-producer-roots.json').read_bytes())
          chain_data = binding.decode((segments / 'N16/chain/chain-binding.json').read_bytes())
          assert chain_data['predecessor']['report_sha256'] == prior_sha
          ET.SubElement(configuration, 'MergeWith').text = str(final_report)
          ET.SubElement(configuration, 'Format').text = 'cobertura'
          ET.ElementTree(settings).write(root / 'native.runsettings', encoding='utf-8', xml_declaration=True)
          PY
          printf 'EVIDENCEHOST_NATIVE_MEASUREMENT=1\n' >> "$GITHUB_ENV"
      - name: Restore the complete ordinary solution in locked mode
        run: dotnet restore ForgeTrust.AppSurface.slnx --locked-mode -p:EvidencePrivateQualification=None
      - name: Build and verify repository web assets
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:build
          pnpm --dir Web run assets:verify
      - name: Verify generated snippets and package index
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -c Release --no-restore -- verify
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj -c Release --no-restore -- verify
      - name: Run the unchanged solution and patch coverage command
        env:
          BUILD_CONFIGURATION: Release
          BUILD_NO_RESTORE: "true"
          COVERAGE_PARALLELISM: "2"
          APP_SURFACE_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/docs-outline-layout-evidence
        run: |
          set -euo pipefail
          worker_uid="$(id -u)"
          worker_gid="$(id -g)"
          worker_groups="$(id -G | tr ' ' ',')"
          timeout --signal=KILL 4320 sudo --non-interactive /usr/bin/python3 -B tests/evidencehost-consumer/test_execution_broker.py \
            --worker-uid "$worker_uid" --worker-gid "$worker_gid" \
            --worker-supplementary-groups "$worker_groups" \
            --subject-uid 65533 --subject-gid 65531 \
            --dotnet "$(readlink -f "$(command -v dotnet)")" \
            --reportgenerator-package "$NUGET_PACKAGES/reportgenerator/5.5.10/tools/net10.0" \
            --command-timeout-seconds 4200 -- \
            /usr/bin/env BUILD_CONFIGURATION=Release BUILD_NO_RESTORE=true COVERAGE_PARALLELISM=2 COVERAGE_GATE_DIFF_BASE="$COVERAGE_GATE_DIFF_BASE" NUGET_PACKAGES="$NUGET_PACKAGES" EVIDENCEHOST_NATIVE_MEASUREMENT=1 APP_SURFACE_TEST_ARTIFACTS_DIR="$APP_SURFACE_TEST_ARTIFACTS_DIR" \
            /usr/bin/bash ./scripts/coverage-solution.sh 2>&1 | tee "$RUNNER_TEMP/checkpoint4-evidence/coverage.log"
      - name: Recheck source after all executions
        if: always()
        run: python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint4-evidence/source.json" --verify
      - name: Retain numerical reports and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-checkpoint4-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkpoint4-evidence
            TestResults/coverage-merged/coverage.cobertura.xml
            TestResults/coverage-merged/coverage-gate.json
            TestResults/coverage-merged/patch-coverage*.json
            TestResults/coverage-merged/coverage-patch-targets.json
            TestResults/coverage-merged/coverage-patch-targets.md
            TestResults/coverage-merged/timings.json
            TestResults/coverage-merged/**/dotnet-test.log
            TestResults/coverage-merged/**/*.trx
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
