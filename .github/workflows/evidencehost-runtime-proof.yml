name: EvidenceHost CSharp runtime cutover and coverage

on:
  push:
    branches: [codex/issue779-checkpoint4-cutover-20261018]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidencehost-csharp-cutover-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  packaged-producer:
    name: Packaged CSharp CLI producer and artifact custody
    uses: ./.github/workflows/issue779-checkpoint2-producer.yml

  application-consumers:
    name: CSharp CLI and SDK application consumers
    uses: ./.github/workflows/issue779-checkpoint3-application.yml

  solution-coverage:
    name: Unchanged solution and codecov patch gates
    needs: application-consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Bind source and verify retired runtime is absent
        run: |
          set -euo pipefail
          umask 077
          printf 'NUGET_PACKAGES=%s/checkpoint4-nuget\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -m 0700 "$RUNNER_TEMP/checkpoint4-evidence"
          python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint4-evidence/source.json"
          python3 -B .github/issue779-checkpoint4/verify-cutover.py
          python3 -B .github/issue779-checkpoint4/test_cutover.py
          git rev-parse origin/main > "$RUNNER_TEMP/checkpoint4-evidence/comparison-base.txt"
      - name: Download current native measurement from the successful application lane
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue779-checkpoint3-application-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint4-native-input
      - name: Stage only fixed source-bound native measurement inputs
        run: |
          set -euo pipefail
          umask 077
          mkdir -p TestResults/issue779-native-measurement
          cp "$RUNNER_TEMP/checkpoint4-native-input/measurement-binding.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-supervision.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native-sdk.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/source.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/native/native-receipt.json" TestResults/issue779-native-measurement/
          cp "$RUNNER_TEMP/checkpoint4-native-input/root-file-tests/root-files.trx" TestResults/issue779-native-measurement/
          python3 -B - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('TestResults/issue779-native-measurement').resolve()
          settings = ET.Element('RunSettings')
          collector = ET.SubElement(ET.SubElement(ET.SubElement(settings, 'DataCollectionRunSettings'), 'DataCollectors'), 'DataCollector', friendlyName='XPlat Code Coverage')
          configuration = ET.SubElement(collector, 'Configuration')
          ET.SubElement(configuration, 'MergeWith').text = str(root / 'native-supervision.json')
          ET.SubElement(configuration, 'Format').text = 'cobertura'
          ET.ElementTree(settings).write(root / 'native.runsettings', encoding='utf-8', xml_declaration=True)
          PY
          printf 'EVIDENCEHOST_NATIVE_MEASUREMENT=1\n' >> "$GITHUB_ENV"
      - name: Restore the complete ordinary solution in locked mode
        run: dotnet restore ForgeTrust.AppSurface.slnx --locked-mode -p:EvidencePrivateQualification=None
      - name: Build and verify repository web assets
        run: |
          pnpm --dir Web install --frozen-lockfile
          pnpm --dir Web run assets:typecheck
          pnpm --dir Web run assets:test
          pnpm --dir Web run assets:build
          pnpm --dir Web run assets:verify
      - name: Verify generated snippets and package index
        run: |
          dotnet run --project tools/ForgeTrust.AppSurface.PackageIndex/ForgeTrust.AppSurface.PackageIndex.csproj -c Release --no-restore -- verify
          dotnet run --project tools/ForgeTrust.AppSurface.MarkdownSnippets/ForgeTrust.AppSurface.MarkdownSnippets.csproj -c Release --no-restore -- verify
      - name: Run the unchanged solution and patch coverage command
        env:
          BUILD_CONFIGURATION: Release
          BUILD_NO_RESTORE: "true"
          COVERAGE_PARALLELISM: "2"
          APP_SURFACE_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/docs-outline-layout-evidence
        run: |
          set -euo pipefail
          worker_uid="$(id -u)"
          worker_gid="$(id -g)"
          worker_groups="$(id -G | tr ' ' ',')"
          timeout --signal=KILL 4320 sudo --non-interactive /usr/bin/python3 -B tests/evidencehost-consumer/test_execution_broker.py \
            --worker-uid "$worker_uid" --worker-gid "$worker_gid" \
            --worker-supplementary-groups "$worker_groups" \
            --subject-uid 65533 --subject-gid 65531 \
            --dotnet "$(readlink -f "$(command -v dotnet)")" \
            --reportgenerator-package "$NUGET_PACKAGES/reportgenerator/5.5.10/tools/net10.0" \
            --command-timeout-seconds 4200 -- \
            /usr/bin/env BUILD_CONFIGURATION=Release BUILD_NO_RESTORE=true COVERAGE_PARALLELISM=2 NUGET_PACKAGES="$NUGET_PACKAGES" EVIDENCEHOST_NATIVE_MEASUREMENT=1 APP_SURFACE_TEST_ARTIFACTS_DIR="$APP_SURFACE_TEST_ARTIFACTS_DIR" \
            /usr/bin/bash ./scripts/coverage-solution.sh 2>&1 | tee "$RUNNER_TEMP/checkpoint4-evidence/coverage.log"
      - name: Recheck source after all executions
        if: always()
        run: python3 -B .github/issue779-checkpoint2/capture-source.py "$GITHUB_SHA" "$RUNNER_TEMP/checkpoint4-evidence/source.json" --verify
      - name: Retain numerical reports and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue779-checkpoint4-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkpoint4-evidence
            TestResults/coverage-merged/coverage.cobertura.xml
            TestResults/coverage-merged/coverage-gate.json
            TestResults/coverage-merged/patch-coverage*.json
            TestResults/coverage-merged/coverage-patch-targets.json
            TestResults/coverage-merged/coverage-patch-targets.md
            TestResults/coverage-merged/timings.json
            TestResults/coverage-merged/**/dotnet-test.log
            TestResults/coverage-merged/**/*.trx
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
