name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v.
        required: true
      date:
        description: Release date in YYYY-MM-DD form.
        required: true
      base-ref:
        description: Branch name to prepare from.
        required: false
        default: main
  pull_request:
    paths:
      - CHANGELOG.md
      - releases/**
      - packages/package-index.yml
      - tools/ForgeTrust.AppSurface.Release/**
      - eng/release
      - .github/workflows/release-prep.yml

concurrency:
  group: release-prep-${{ github.event.inputs.version || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'forge-trust/AppSurface' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate release bot token
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_BOT_TOKEN}" ]]; then
            echo "RELEASE_BOT_TOKEN is required so release preparation can push a branch and open a pull request." >&2
            exit 1
          fi

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Verify base is current
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          expected_base="$(git rev-parse "origin/${BASE_REF}")"
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head}" != "${expected_base}" ]]; then
            echo "Release prep must run from the current origin/${BASE_REF} commit. HEAD=${actual_head}; origin/${BASE_REF}=${expected_base}." >&2
            exit 1
          fi

      - name: Prepare release files
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          ./eng/release prepare \
            --version "${VERSION}" \
            --date "${RELEASE_DATE}" \
            --report "${RUNNER_TEMP}/release-prep-report.md"

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ inputs.version }}
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"
          git config user.name "appsurface-release-bot"
          git config user.email "appsurface-release-bot@users.noreply.github.com"
          git checkout -b "${branch}"
          git add \
            "releases/v${VERSION}.md" \
            "releases/v${VERSION}.md.yml" \
            "releases/v${VERSION}.release.json" \
            "releases/v${VERSION}.evidence.json" \
            releases/current.md \
            CHANGELOG.md \
            releases/unreleased.md \
            releases/unreleased.md.yml
          if git ls-files --deleted -- releases/unreleased.entries | grep -q .; then
            git add -u -- releases/unreleased.entries
          fi
          git commit -m "chore(release): prepare v${VERSION}"
          git push --force-with-lease origin "${branch}"
          existing_pr="$(gh pr list --head "${branch}" --json number --jq '.[0].number // ""')"
          if [[ -n "${existing_pr}" ]]; then
            gh pr edit "${existing_pr}" --title "chore(release): prepare v${VERSION}" --body-file "${RUNNER_TEMP}/release-prep-report.md"
          else
            gh pr create \
              --base "${BASE_REF}" \
              --head "${branch}" \
              --title "chore(release): prepare v${VERSION}" \
              --body-file "${RUNNER_TEMP}/release-prep-report.md"
          fi

  release-prep-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Verify complete release-preparation diff
        env:
          RELEASE_PREP_REPORT: ${{ runner.temp }}/release-prep-diff-report.md
        run: |
          set -euo pipefail
          ./eng/release verify-prep-diff \
            --base-ref "${GITHUB_BASE_REF}" \
            --report "${RELEASE_PREP_REPORT}"

      - name: Validate release semantics
        if: ${{ success() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          dotnet test tools/ForgeTrust.AppSurface.Release.Tests/ForgeTrust.AppSurface.Release.Tests.csproj
          manifest_paths="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- ':(glob)releases/v*.release.json')"
          if [[ -z "${manifest_paths}" ]]; then
            exit 0
          fi
          if [[ "$(printf '%s\n' "${manifest_paths}" | sed '/^$/d' | wc -l | tr -d ' ')" != "1" ]]; then
            echo "verify-prep-diff accepted an invalid release manifest set." >&2
            exit 1
          fi
          version="${manifest_paths#releases/v}"
          version="${version%.release.json}"
          if [[ "${version}" == *-* ]]; then
            ./eng/release check --version "${version}" --fail-on-warnings --allow-existing-targets
            exit 0
          fi

          evidence_path="releases/v${version}.evidence.json"
          docs_exact_tree_path="$(jq -r '.docsArchive.exactTreePath // ""' "${evidence_path}")"
          docs_release_manifest_sha256="$(jq -r '.docsArchive.releaseManifestSha256 // ""' "${evidence_path}")"
          if [[ -z "${docs_exact_tree_path}" || -z "${docs_release_manifest_sha256}" ]]; then
            echo "Stable release evidence must include docsArchive.exactTreePath and docsArchive.releaseManifestSha256 before release-prep review." >&2
            exit 1
          fi

          normalized_exact_tree_path="${docs_exact_tree_path#./}"
          case "${normalized_exact_tree_path}" in
            ""|/*|../*|*/../*|*/..|"."|".."|.*|*/.*|*//*)
              echo "Stable docs exactTreePath '${docs_exact_tree_path}' must be a trusted-root-relative path with no parent, hidden, or empty segments." >&2
              exit 1
              ;;
          esac

          docs_release_root="${RUNNER_TEMP}/appsurface-release-prep-docs-${version}"
          docs_exact_tree="${docs_release_root}/${normalized_exact_tree_path}"
          mkdir -p "$(dirname "${docs_exact_tree}")"
          docs_source_ref="$(jq -r '.preparationBaseCommit // ""' "releases/v${version}.release.json")"
          if [[ -z "${docs_source_ref}" ]]; then
            docs_source_ref="$(git rev-parse HEAD)"
          fi
          export AppSurfaceDocs__Contributor__DefaultBranch="${BASE_REF}"
          export AppSurfaceDocs__Contributor__SourceRef="${docs_source_ref}"
          export AppSurfaceDocs__Contributor__SourceUrlTemplate="https://github.com/${GITHUB_REPOSITORY}/blob/{branch}/{path}"
          export AppSurfaceDocs__Contributor__SymbolSourceUrlTemplate="https://github.com/${GITHUB_REPOSITORY}/blob/{ref}/{path}#L{line}"
          export AppSurfaceDocs__Contributor__EditUrlTemplate="https://github.com/${GITHUB_REPOSITORY}/edit/{branch}/{path}"
          export AppSurfaceDocs__Contributor__LastUpdatedMode="Git"
          export AppSurfaceDocs__Identity__DisplayName="AppSurface"
          export AppSurfaceDocs__Identity__Wordmark__HighlightText="Surface"
          export AppSurfaceDocs__Identity__Wordmark__HighlightColor="#3b82f6"
          export AppSurfaceDocs__Identity__BrandingAssets__DirectoryPath="branding"
          export AppSurfaceDocs__Identity__BrandingAssets__AllowSvgAssets="true"
          export AppSurfaceDocs__Identity__Logo__Path="/branding/appsurface-site-icon.svg"
          export AppSurfaceDocs__Identity__Favicon__SvgPath="/branding/appsurface-site-icon.svg"
          export AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0="Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js"
          printf '%s\n' '/' '/docs' > "${RUNNER_TEMP}/appsurface-docs-seeds.txt"

          docs_export_repo="."
          docs_export_project="Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"
          if git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            docs_export_repo="${RUNNER_TEMP}/appsurface-release-prep-source-${version}"
            git worktree add --detach "${docs_export_repo}" "refs/tags/v${version}^{commit}"
            docs_export_project="${docs_export_repo}/Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"
            docs_source_ref="$(git -C "${docs_export_repo}" rev-parse HEAD)"
          fi
          export AppSurfaceDocs__Contributor__SourceRef="${docs_source_ref}"

          dotnet run --project "${docs_export_project}" -c Release -- \
            docs export \
            --repo "${docs_export_repo}" \
            --mode cdn \
            --seeds "${RUNNER_TEMP}/appsurface-docs-seeds.txt" \
            --output "${docs_exact_tree}" \
            --public-origin https://forge-trust.com \
            --startup-timeout-seconds 30 \
            --strict

          catalog_release_manifest_sha256="${docs_release_manifest_sha256}"
          if [[ "${catalog_release_manifest_sha256}" == "generated" ]]; then
            catalog_release_manifest_sha256="$(sha256sum "${docs_exact_tree}/.appsurface-docs-release-manifest.json" | awk '{print $1}')"
          fi

          jq -n \
            --arg version "${version}" \
            --arg exactTreePath "${docs_exact_tree_path}" \
            --arg releaseManifestSha256 "${catalog_release_manifest_sha256}" \
            '{
              recommendedVersion: $version,
              versions: [
                {
                  version: $version,
                  label: $version,
                  summary: ("Stable AppSurface release " + $version),
                  exactTreePath: $exactTreePath,
                  releaseManifestSha256: $releaseManifestSha256,
                  supportState: "Current",
                  visibility: "Public",
                  advisoryState: "None"
                }
              ]
            }' > "${docs_release_root}/versions.json"

          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release -- \
            docs verify-archive \
            --catalog "${docs_release_root}/versions.json" \
            --version "${version}" \
            --trusted-release-root "${docs_release_root}"

          ./eng/release check \
            --version "${version}" \
            --fail-on-warnings \
            --allow-existing-targets \
            --docs-catalog "${docs_release_root}/versions.json" \
            --docs-trusted-release-root "${docs_release_root}"

      - name: Publish release-preparation diff report
        if: ${{ always() }}
        env:
          RELEASE_PREP_REPORT: ${{ runner.temp }}/release-prep-diff-report.md
        run: |
          set -euo pipefail
          if [[ -L "${RELEASE_PREP_REPORT}" ]]; then
            echo "Release-preparation report must not be a symbolic link." >&2
            exit 1
          fi
          if [[ -f "${RELEASE_PREP_REPORT}" ]]; then
            cat "${RELEASE_PREP_REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            rm -- "${RELEASE_PREP_REPORT}"
          else
            echo "# Release-preparation diff report" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "The verifier did not produce a report; inspect the failed verification step." >> "${GITHUB_STEP_SUMMARY}"
          fi
