name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v.
        required: true
      date:
        description: Release date in YYYY-MM-DD form.
        required: true
      base-ref:
        description: Branch name to prepare from.
        required: false
        default: main
  pull_request:
    paths:
      - CHANGELOG.md
      - releases/**
      - packages/package-index.yml
      - tools/ForgeTrust.AppSurface.Release/**
      - eng/release
      - .github/workflows/release-prep.yml

concurrency:
  group: release-prep-${{ github.event.inputs.version || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'forge-trust/AppSurface' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep generated pull-request branches outside the protected release/* source namespace.
      RELEASE_BRANCH: release-bot/v${{ inputs.version }}
    permissions:
      contents: read

    steps:
      - name: Validate trusted release base
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          if [[ ! "${BASE_REF}" =~ ^(main|release/[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release Prep supports only main or a maintained release/<major>.<minor>.<patch> branch; configure those refs as protected. Received '${BASE_REF}'." >&2
            exit 1
          fi

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Verify base is current
        env:
          BASE_REF: ${{ inputs.base-ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          github_token_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="${github_token_header}" \
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          expected_base="$(git rev-parse "origin/${BASE_REF}")"
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head}" != "${expected_base}" ]]; then
            echo "Release prep must run from the current origin/${BASE_REF} commit. HEAD=${actual_head}; origin/${BASE_REF}=${expected_base}." >&2
            exit 1
          fi

      - name: Prepare release files
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          ./eng/release prepare \
            --version "${VERSION}" \
            --date "${RELEASE_DATE}" \
            --report "${RUNNER_TEMP}/release-prep-report.md"

      - name: Commit release preparation
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "appsurface-release-bot"
          git config user.email "appsurface-release-bot@users.noreply.github.com"
          git -c core.hooksPath=/dev/null checkout -b "${RELEASE_BRANCH}"
          git add \
            "releases/v${VERSION}.md" \
            "releases/v${VERSION}.md.yml" \
            "releases/v${VERSION}.release.json" \
            "releases/v${VERSION}.evidence.json" \
            releases/current.md \
            CHANGELOG.md \
            releases/unreleased.md \
            releases/unreleased.md.yml
          if git ls-files --deleted -- releases/unreleased.entries | grep -q .; then
            git add -u -- releases/unreleased.entries
          fi
          git -c core.hooksPath=/dev/null commit -m "chore(release): prepare v${VERSION}"
          git bundle create "${RUNNER_TEMP}/release-prep.bundle" "${RELEASE_BRANCH}"

      # This job executes base-ref-controlled release tooling. It must never receive
      # App credentials; the next job runs on a fresh runner and consumes only these files.
      - name: Upload prepared release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-prep
          path: |
            ${{ runner.temp }}/release-prep.bundle
            ${{ runner.temp }}/release-prep-report.md
          if-no-files-found: error
          retention-days: 1

  publish-release-preparation:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_BRANCH: release-bot/v${{ inputs.version }}
    environment:
      name: release-prep
      deployment: false
    permissions:
      contents: read

    steps:
      # Do not check out base-ref-controlled source in this token-bearing job.
      - name: Download prepared release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-prep
          path: ${{ runner.temp }}/release-prep

      # Validate untrusted artifact content before this job reads App credentials.
      - name: Validate prepared release artifact
        env:
          BASE_REF: ${{ inputs.base-ref }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          artifact_directory="${RUNNER_TEMP}/release-prep"
          bundle_path="${artifact_directory}/release-prep.bundle"
          report_path="${artifact_directory}/release-prep-report.md"
          prepared_repository="${RUNNER_TEMP}/release-prep-validated.git"
          if [[ ! "${BASE_REF:-}" =~ ^(main|release/[0-9]+\.[0-9]+\.[0-9]+)$ || -z "${GITHUB_TOKEN:-}" || ! -f "${bundle_path}" || -L "${bundle_path}" || ! -f "${report_path}" || -L "${report_path}" ]]; then
            echo "Release Prep did not receive the expected regular bundle and report artifact files for a trusted release base." >&2
            exit 1
          fi
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git init --bare "${prepared_repository}"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" fetch "${bundle_path}" "refs/heads/${RELEASE_BRANCH}:refs/heads/${RELEASE_BRANCH}"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" remote add origin "https://github.com/forge-trust/AppSurface.git"
          read_token_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git_with_read_token() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="${read_token_header}" \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            git -c core.hooksPath=/dev/null "$@"
          }
          git_with_read_token -C "${prepared_repository}" fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          verified_base="$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" rev-parse "origin/${BASE_REF}^{commit}")"
          if ! GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" cat-file -e "${verified_base}^{commit}"; then
            echo "Release Prep bundle does not contain the current verified base commit ${verified_base}." >&2
            exit 1
          fi
          release_commit="$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" rev-parse "refs/heads/${RELEASE_BRANCH}^{commit}")"
          release_parents="$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" show -s --format=%P "${release_commit}")"
          if [[ "${release_parents}" != "${verified_base}" ]]; then
            echo "Release Prep bundle must contain exactly one release commit on current verified base ${verified_base}." >&2
            exit 1
          fi
          has_release_notes=false
          has_release_sidecar=false
          has_release_manifest=false
          has_release_evidence=false
          has_current_release=false
          has_changelog=false
          has_unreleased=false
          declare -A deleted_entry_paths=()
          while IFS=$'\t' read -r status path; do
            if [[ "${status}" == "A" && "${path}" == "releases/v${VERSION}.md" ]]; then
              has_release_notes=true
            elif [[ "${status}" == "A" && "${path}" == "releases/v${VERSION}.md.yml" ]]; then
              has_release_sidecar=true
            elif [[ "${status}" == "A" && "${path}" == "releases/v${VERSION}.release.json" ]]; then
              has_release_manifest=true
            elif [[ "${status}" == "A" && "${path}" == "releases/v${VERSION}.evidence.json" ]]; then
              has_release_evidence=true
            elif [[ "${status}" == "M" && "${path}" == "releases/current.md" ]]; then
              has_current_release=true
            elif [[ "${status}" == "M" && "${path}" == "CHANGELOG.md" ]]; then
              has_changelog=true
            elif [[ "${status}" == "M" && "${path}" == "releases/unreleased.md" ]]; then
              has_unreleased=true
            elif [[ "${status}" == "M" && "${path}" == "releases/unreleased.md.yml" ]]; then
              :
            elif [[ "${status}" == "D" && "${path}" == releases/unreleased.entries/*.md ]]; then
              entry_name="${path#releases/unreleased.entries/}"
              if [[ "${entry_name}" == */* || ! "${entry_name}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*\.md$ ]]; then
                echo "Release Prep bundle deletes an invalid unreleased entry path: ${path}." >&2
                exit 1
              fi
              deleted_entry_paths["${path}"]=true
            else
              echo "Release Prep bundle contains an unexpected change: ${status} ${path}." >&2
              exit 1
            fi
          done < <(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" diff --name-status --no-renames "${verified_base}" "${release_commit}")
          if [[ "${has_release_notes}" != true || "${has_release_sidecar}" != true || "${has_release_manifest}" != true || "${has_release_evidence}" != true || "${has_current_release}" != true || "${has_changelog}" != true || "${has_unreleased}" != true ]]; then
            echo "Release Prep bundle does not contain the complete expected release-preparation artifact set." >&2
            exit 1
          fi
          while IFS= read -r changed_regular_path; do
            tree_entry="$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" ls-tree "${release_commit}" -- "${changed_regular_path}")"
            tree_mode="${tree_entry%% *}"
            if [[ "${tree_mode}" != "100644" ]]; then
              echo "Release Prep bundle contains a non-regular release artifact: ${changed_regular_path} (${tree_mode:-missing})." >&2
              exit 1
            fi
          done < <(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" diff --name-only --diff-filter=AM "${verified_base}" "${release_commit}")
          manifest_entries_file="${RUNNER_TEMP}/release-prep-consumed-entries.json"
          if ! GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "${prepared_repository}" show "${release_commit}:releases/v${VERSION}.release.json" \
            | jq -ce 'if (.preparationBaseCommit | type) != "string" or .preparationBaseCommit == "" or (.consumedUnreleasedEntryPaths | type) != "array" then error("invalid release-preparation manifest entry paths") elif any(.consumedUnreleasedEntryPaths[]; type != "string") then error("invalid release-preparation manifest entry paths") else . end' \
              > "${manifest_entries_file}"; then
            echo "Release Prep bundle does not contain a valid release-preparation manifest." >&2
            exit 1
          fi
          preparation_base_commit="$(jq -r '.preparationBaseCommit' "${manifest_entries_file}")"
          if [[ "${preparation_base_commit}" != "${verified_base}" ]]; then
            echo "Release Prep manifest base commit does not match the verified base commit." >&2
            exit 1
          fi
          declare -A declared_entry_paths=()
          previous_declared_entry_path=""
          while IFS= read -r declared_entry_path; do
            entry_name="${declared_entry_path#releases/unreleased.entries/}"
            if [[ "${entry_name}" == "${declared_entry_path}" || "${entry_name}" == */* || ! "${entry_name}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*\.md$ ]]; then
              echo "Release Prep manifest declares an invalid consumed unreleased entry path: ${declared_entry_path}." >&2
              exit 1
            fi
            if [[ -n "${declared_entry_paths[${declared_entry_path}]:-}" ]]; then
              echo "Release Prep manifest declares the same consumed unreleased entry path more than once: ${declared_entry_path}." >&2
              exit 1
            fi
            if [[ -n "${previous_declared_entry_path}" && "${declared_entry_path}" < "${previous_declared_entry_path}" ]]; then
              echo "Release Prep manifest consumed unreleased entry paths must be ordinally sorted." >&2
              exit 1
            fi
            declared_entry_paths["${declared_entry_path}"]=true
            previous_declared_entry_path="${declared_entry_path}"
          done < <(jq -r '.consumedUnreleasedEntryPaths[]' "${manifest_entries_file}")
          for deleted_entry_path in "${!deleted_entry_paths[@]}"; do
            if [[ -z "${declared_entry_paths[${deleted_entry_path}]:-}" ]]; then
              echo "Release Prep bundle deletes an unreleased entry not declared by its manifest: ${deleted_entry_path}." >&2
              exit 1
            fi
          done
          for declared_entry_path in "${!declared_entry_paths[@]}"; do
            if [[ -z "${deleted_entry_paths[${declared_entry_path}]:-}" ]]; then
              echo "Release Prep manifest declares an unreleased entry that the bundle does not delete: ${declared_entry_path}." >&2
              exit 1
            fi
          done

      - name: Validate release bot app credentials
        env:
          RELEASE_BOT_APP_CLIENT_ID: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          RELEASE_BOT_APP_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_BOT_APP_CLIENT_ID}" ]]; then
            echo "RELEASE_BOT_APP_CLIENT_ID is required to mint the release bot installation token." >&2
            exit 1
          fi
          if [[ -z "${RELEASE_BOT_APP_PRIVATE_KEY}" ]]; then
            echo "RELEASE_BOT_APP_PRIVATE_KEY is required to mint the release bot installation token." >&2
            exit 1
          fi

      - name: Mint release bot installation token
        id: release-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: forge-trust
          repositories: AppSurface
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          BASE_REF: ${{ inputs.base-ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          push_repository="${RUNNER_TEMP}/release-prep-validated.git"
          report_path="${RUNNER_TEMP}/release-prep/release-prep-report.md"
          release_bot_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git_with_release_bot_token() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="${release_bot_header}" \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            git -c core.hooksPath=/dev/null "$@"
          }
          other_base_pr="$(gh pr list --head "${RELEASE_BRANCH}" --state open --json number,headRefName,headRepositoryOwner,isCrossRepository,baseRefName --jq '[.[] | select(.headRefName == env.RELEASE_BRANCH and .headRepositoryOwner.login == "forge-trust" and .isCrossRepository == false and .baseRefName != env.BASE_REF)][0].number // ""')"
          if [[ -n "${other_base_pr}" ]]; then
            echo "Release Prep will not overwrite ${RELEASE_BRANCH}: it already backs open pull request #${other_base_pr} targeting a different base branch." >&2
            exit 1
          fi
          if git_with_release_bot_token -C "${push_repository}" fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"; then
            :
          else
            fetch_status=$?
            if git_with_release_bot_token -C "${push_repository}" ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null; then
              echo "Release Prep could not safely fetch the existing ${RELEASE_BRANCH} branch (exit ${fetch_status})." >&2
              exit "${fetch_status}"
            else
              remote_branch_status=$?
            fi
            if [[ "${remote_branch_status}" -ne 2 ]]; then
              echo "Release Prep could not verify whether ${RELEASE_BRANCH} already exists (exit ${remote_branch_status})." >&2
              exit "${remote_branch_status}"
            fi
          fi
          git_with_release_bot_token -C "${push_repository}" push --force-with-lease origin "refs/heads/${RELEASE_BRANCH}:refs/heads/${RELEASE_BRANCH}"
          existing_pr="$(gh pr list --head "${RELEASE_BRANCH}" --base "${BASE_REF}" --state open --json number,headRefName,headRepositoryOwner,isCrossRepository,baseRefName --jq '[.[] | select(.headRefName == env.RELEASE_BRANCH and .headRepositoryOwner.login == "forge-trust" and .isCrossRepository == false and .baseRefName == env.BASE_REF)][0].number // ""')"
          if [[ -n "${existing_pr}" ]]; then
            gh pr edit "${existing_pr}" --title "chore(release): prepare v${VERSION}" --body-file "${report_path}"
          else
            gh pr create \
              --base "${BASE_REF}" \
              --head "${RELEASE_BRANCH}" \
              --title "chore(release): prepare v${VERSION}" \
              --body-file "${report_path}"
          fi

  release-prep-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Verify complete release-preparation diff
        env:
          RELEASE_PREP_REPORT: ${{ runner.temp }}/release-prep-diff-report.md
        run: |
          set -euo pipefail
          ./eng/release verify-prep-diff \
            --base-ref "${GITHUB_BASE_REF}" \
            --report "${RELEASE_PREP_REPORT}"

      - name: Validate release semantics
        if: ${{ success() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          manifest_paths="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- ':(glob)releases/v*.release.json')"
          if [[ -n "${manifest_paths}" ]]; then
            if [[ "$(printf '%s\n' "${manifest_paths}" | sed '/^$/d' | wc -l | tr -d ' ')" != "1" ]]; then
              echo "verify-prep-diff accepted an invalid release manifest set." >&2
              exit 1
            fi
            version="${manifest_paths#releases/v}"
            version="${version%.release.json}"
            export RELEASE_PREP_POLICY_BASE_REF="${BASE_REF}"
            export RELEASE_PREP_POLICY_VERSION="${version}"
          fi

          dotnet test tools/ForgeTrust.AppSurface.Release.Tests/ForgeTrust.AppSurface.Release.Tests.csproj
          if [[ -z "${manifest_paths}" ]]; then
            exit 0
          fi
          if [[ "${version}" == *-* ]]; then
            ./eng/release check --version "${version}" --fail-on-warnings --allow-existing-targets
            exit 0
          fi

          evidence_path="releases/v${version}.evidence.json"
          docs_exact_tree_path="$(jq -r '.docsArchive.exactTreePath // ""' "${evidence_path}")"
          docs_release_manifest_sha256="$(jq -r '.docsArchive.releaseManifestSha256 // ""' "${evidence_path}")"
          if [[ -z "${docs_exact_tree_path}" || -z "${docs_release_manifest_sha256}" ]]; then
            echo "Stable release evidence must include docsArchive.exactTreePath and docsArchive.releaseManifestSha256 before release-prep review." >&2
            exit 1
          fi

          normalized_exact_tree_path="${docs_exact_tree_path#./}"
          case "${normalized_exact_tree_path}" in
            ""|/*|../*|*/../*|*/..|"."|".."|.*|*/.*|*//*)
              echo "Stable docs exactTreePath '${docs_exact_tree_path}' must be a trusted-root-relative path with no parent, hidden, or empty segments." >&2
              exit 1
              ;;
          esac

          docs_release_root="${RUNNER_TEMP}/appsurface-release-prep-docs-${version}"
          docs_exact_tree="${docs_release_root}/${normalized_exact_tree_path}"
          mkdir -p "$(dirname "${docs_exact_tree}")"
          docs_source_ref="$(jq -r '.preparationBaseCommit // ""' "releases/v${version}.release.json")"
          if [[ -z "${docs_source_ref}" ]]; then
            docs_source_ref="$(git rev-parse HEAD)"
          fi
          export AppSurfaceDocs__Contributor__DefaultBranch="${BASE_REF}"
          export AppSurfaceDocs__Contributor__SourceRef="${docs_source_ref}"
          export AppSurfaceDocs__Contributor__SourceUrlTemplate="https://github.com/${GITHUB_REPOSITORY}/blob/{branch}/{path}"
          export AppSurfaceDocs__Contributor__SymbolSourceUrlTemplate="https://github.com/${GITHUB_REPOSITORY}/blob/{ref}/{path}#L{line}"
          export AppSurfaceDocs__Contributor__EditUrlTemplate="https://github.com/${GITHUB_REPOSITORY}/edit/{branch}/{path}"
          export AppSurfaceDocs__Contributor__LastUpdatedMode="Git"
          export AppSurfaceDocs__Identity__DisplayName="AppSurface"
          export AppSurfaceDocs__Identity__Wordmark__HighlightText="Surface"
          export AppSurfaceDocs__Identity__Wordmark__HighlightColor="#3b82f6"
          export AppSurfaceDocs__Identity__BrandingAssets__DirectoryPath="branding"
          export AppSurfaceDocs__Identity__BrandingAssets__AllowSvgAssets="true"
          export AppSurfaceDocs__Identity__Logo__Path="/branding/appsurface-site-icon.svg"
          export AppSurfaceDocs__Identity__Favicon__SvgPath="/branding/appsurface-site-icon.svg"
          export AppSurfaceDocs__Harvest__JavaScript__IncludeGlobs__0="Web/ForgeTrust.RazorWire/assets/contracts/razorwire-public-contracts.js"
          printf '%s\n' '/' '/docs' > "${RUNNER_TEMP}/appsurface-docs-seeds.txt"

          docs_export_repo="."
          docs_export_project="Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"
          if git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            docs_export_repo="${RUNNER_TEMP}/appsurface-release-prep-source-${version}"
            git worktree add --detach "${docs_export_repo}" "refs/tags/v${version}^{commit}"
            docs_export_project="${docs_export_repo}/Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj"
            docs_source_ref="$(git -C "${docs_export_repo}" rev-parse HEAD)"
          fi
          export AppSurfaceDocs__Contributor__SourceRef="${docs_source_ref}"

          dotnet run --project "${docs_export_project}" -c Release -- \
            docs export \
            --repo "${docs_export_repo}" \
            --mode cdn \
            --seeds "${RUNNER_TEMP}/appsurface-docs-seeds.txt" \
            --output "${docs_exact_tree}" \
            --public-origin https://forge-trust.com \
            --startup-timeout-seconds 30 \
            --strict

          catalog_release_manifest_sha256="${docs_release_manifest_sha256}"
          if [[ "${catalog_release_manifest_sha256}" == "generated" ]]; then
            catalog_release_manifest_sha256="$(sha256sum "${docs_exact_tree}/.appsurface-docs-release-manifest.json" | awk '{print $1}')"
          fi

          jq -n \
            --arg version "${version}" \
            --arg exactTreePath "${docs_exact_tree_path}" \
            --arg releaseManifestSha256 "${catalog_release_manifest_sha256}" \
            '{
              recommendedVersion: $version,
              versions: [
                {
                  version: $version,
                  label: $version,
                  summary: ("Stable AppSurface release " + $version),
                  exactTreePath: $exactTreePath,
                  releaseManifestSha256: $releaseManifestSha256,
                  supportState: "Current",
                  visibility: "Public",
                  advisoryState: "None"
                }
              ]
            }' > "${docs_release_root}/versions.json"

          dotnet run --project Cli/ForgeTrust.AppSurface.Cli/ForgeTrust.AppSurface.Cli.csproj -c Release -- \
            docs verify-archive \
            --catalog "${docs_release_root}/versions.json" \
            --version "${version}" \
            --trusted-release-root "${docs_release_root}"

          ./eng/release check \
            --version "${version}" \
            --fail-on-warnings \
            --allow-existing-targets \
            --docs-catalog "${docs_release_root}/versions.json" \
            --docs-trusted-release-root "${docs_release_root}"

      - name: Publish release-preparation diff report
        if: ${{ always() }}
        env:
          RELEASE_PREP_REPORT: ${{ runner.temp }}/release-prep-diff-report.md
        run: |
          set -euo pipefail
          if [[ -L "${RELEASE_PREP_REPORT}" ]]; then
            echo "Release-preparation report must not be a symbolic link." >&2
            exit 1
          fi
          if [[ -f "${RELEASE_PREP_REPORT}" ]]; then
            cat "${RELEASE_PREP_REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            rm -- "${RELEASE_PREP_REPORT}"
          else
            echo "# Release-preparation diff report" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "The verifier did not produce a report; inspect the failed verification step." >> "${GITHUB_STEP_SUMMARY}"
          fi
