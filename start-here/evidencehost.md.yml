trust:
  status: public preview CI evidence guide
  summary: EvidenceHost resolves only checked-in policy and explicit changed paths; it does not infer test completeness or silently promote observations into gates.
  freshness: Keep aligned with Evidence package READMEs and the appsurface evidence command surface.
  change_scope: Policy planning, producer lifecycle, and claims only. Consumer tests, resources, thresholds, and release decisions remain consumer-owned.
  archive: v1 does not provide independent artifact attestation, cross-job aggregation, a semantic low-value-line classifier, or a hosted dashboard.
